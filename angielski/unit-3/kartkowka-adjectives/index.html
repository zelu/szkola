<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7f8f5">
<title>8 przymiotników – obrazkowa nauka</title>
<style>
:root{
  --bg:#f7f8f5;
  --card:#ffffff;
  --line:#d9e1d7;
  --text:#1f2e24;
  --muted:#647267;
  --accent:#226a4b;
  --accent-soft:#edf5ef;
  --ok:#1f7a43;
  --bad:#9a3e35;
}
*{box-sizing:border-box}
body{
  margin:0;
  font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:var(--bg);
  color:var(--text);
  font-size:20px;
}
button{font:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:3px solid #79a98f;outline-offset:3px}
.shell{width:min(100% - 24px,680px);margin:0 auto;min-height:100dvh;display:flex;flex-direction:column}
main{flex:1;display:flex;align-items:center;justify-content:center;padding:18px 0}
.card{
  width:100%;
  background:var(--card);
  border:1px solid var(--line);
  border-radius:22px;
  padding:24px;
  min-height:calc(100dvh - 36px);
  display:flex;
  flex-direction:column;
}
.counter{font-size:.92rem;color:var(--muted);text-align:center;margin-bottom:8px}
.stage{font-size:1.02rem;font-weight:750;text-align:center;margin:0 0 16px}
.spacer{flex:1}
.picture{
  width:100%;
  max-width:370px;
  margin:0 auto 18px;
  background:#f9fbf8;
  border:2px solid var(--line);
  border-radius:20px;
  padding:10px;
}
.picture{position:relative;overflow:hidden;padding:0;background:#f3f5f2;border-width:1px;aspect-ratio:4 / 3}
.picture img{display:block;width:100%;height:100%;object-fit:contain}
.price-tag{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);background:#fff;border:3px solid #213428;border-radius:14px;padding:6px 20px;font-size:clamp(2rem,7vw,2.9rem);font-weight:900;white-space:nowrap;box-shadow:0 2px 12px #0004}
.image-unavailable{display:none;position:absolute;inset:0;align-items:center;justify-content:center;padding:24px;text-align:center;background:white;font-size:1.3rem;font-weight:700}
.word{
  font-size:clamp(2.2rem,8vw,3.4rem);
  font-weight:800;
  letter-spacing:-.03em;
  text-align:center;
  margin:0 0 6px;
}
.meaning{
  font-size:clamp(1.5rem,6vw,2rem);
  font-weight:700;
  text-align:center;
  margin:0 0 10px;
}
.note{
  font-size:1.03rem;
  color:var(--muted);
  text-align:center;
  margin:0 0 12px;
}
.prompt{
  font-size:clamp(1.5rem,5.5vw,2rem);
  font-weight:760;
  line-height:1.3;
  text-align:center;
  margin:0 0 16px;
}
.choices,.chunks{display:grid;gap:14px;margin-top:8px}
.big-btn,.chunk-btn,.main-btn,.ghost-btn,.icon-btn{
  min-height:64px;
  border-radius:16px;
  border:2px solid var(--line);
  background:#fff;
  color:var(--text);
}
.big-btn{
  width:100%;
  padding:16px 18px;
  font-size:1.45rem;
  font-weight:780;
}
.big-btn:active,.chunk-btn:active,.ghost-btn:active,.icon-btn:active{background:#f3f7f4}
.main-btn{
  width:100%;
  margin-top:18px;
  background:var(--accent);
  color:#fff;
  border-color:var(--accent);
  font-size:1.2rem;
  font-weight:800;
  padding:14px 18px;
}
.main-btn:disabled{opacity:.45;cursor:default}
.ghost-btn{
  width:100%;
  margin-top:10px;
  padding:12px 16px;
  font-size:1.05rem;
  font-weight:700;
  color:var(--accent);
}
.icon-row{display:flex;justify-content:center;gap:10px;margin-bottom:12px}
.icon-btn{padding:0 16px;font-size:1rem;font-weight:700;color:var(--accent);background:var(--accent-soft)}
.feedback{
  text-align:center;
  font-size:1.25rem;
  font-weight:780;
  margin:8px 0 0;
}
.feedback.ok{color:var(--ok)}
.feedback.bad{color:var(--bad)}
.answer{
  font-size:1.2rem;
  text-align:center;
  margin:8px 0 0;
}
.build{
  min-height:76px;
  border:2px dashed var(--line);
  border-radius:16px;
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  align-content:flex-start;
  justify-content:center;
  padding:12px;
  margin:8px 0 12px;
  background:#fbfcfa;
}
.built-part,.chunk-btn{
  padding:10px 14px;
  font-size:1.35rem;
  font-weight:780;
}
.built-part{background:var(--accent-soft);border-radius:14px;border:2px solid #cfe0d5}
.chunks{grid-template-columns:repeat(2,minmax(0,1fr))}
.chunk-btn[disabled]{opacity:.4;cursor:default}
.summary{
  text-align:center;
  font-size:clamp(2.8rem,11vw,4.2rem);
  font-weight:900;
  line-height:1.1;
  margin:6px 0 8px;
}
.list{margin-top:10px;border-top:1px solid var(--line);padding-top:10px}
.item{padding:8px 0;border-bottom:1px solid var(--line);font-size:1rem}
.item:last-child{border-bottom:0}
.hidden{display:none!important}
@media (max-width:480px){
  body{font-size:19px}
  .shell{width:min(100% - 16px,680px)}
  .card{padding:18px;min-height:calc(100dvh - 18px)}
  .picture{max-width:320px}
  .big-btn{font-size:1.28rem}
  .built-part,.chunk-btn{font-size:1.2rem}
}
</style>
</head>
<body>
<div class="shell">
  <main>
    <section id="screen" class="card" aria-live="polite"></section>
  </main>
</div>
<script>
(() => {
  'use strict';

  const words = [
    {
      en:'cheap', pl:'tani', pair:['cheap','expensive'],
      chunks:['ch','ea','p'],
      pic: null,
      scene:'Mała cena: 2 zł.'
    },
    {
      en:'expensive', pl:'drogi', pair:['cheap','expensive'],
      chunks:['ex','pen','sive'],
      pic: null,
      scene:'Duża cena: 200 zł.'
    },
    {
      en:'easy', pl:'łatwy', pair:['easy','difficult'],
      chunks:['ea','sy'],
      pic: null,
      scene:'To jest proste do zrobienia.'
    },
    {
      en:'difficult', pl:'trudny', pair:['easy','difficult'],
      chunks:['dif','fi','cult'],
      pic: null,
      scene:'To jest trudne do zrobienia.'
    },
    {
      en:'safe', pl:'bezpieczny', pair:['safe','dangerous'],
      chunks:['sa','fe'],
      pic: null,
      scene:'To jest bezpieczne.'
    },
    {
      en:'dangerous', pl:'niebezpieczny', pair:['safe','dangerous'],
      chunks:['dan','ger','ous'],
      pic: null,
      scene:'To jest niebezpieczne.'
    },
    {
      en:'boring', pl:'nudny', pair:['boring','exciting'],
      chunks:['bor','ing'],
      pic: null,
      scene:'To jest nudne.'
    },
    {
      en:'exciting', pl:'ekscytujący', pair:['boring','exciting'],
      chunks:['ex','cit','ing'],
      pic: null,
      scene:'To jest ekscytujące.'
    }
  ];

  // Zweryfikowane fotografie z serwisów bezpłatnych zdjęć.
  // Połączenie z internetem jest wymagane do załadowania zdjęć.
  const images = {
    cheap: 'https://assets.lummi.ai/assets/QmczVwG95H1JDyabHKhDPFKKmtjXu64EnApk4YczQnwsyg?auto=format&w=800',
    expensive: 'https://assets.lummi.ai/assets/QmczVwG95H1JDyabHKhDPFKKmtjXu64EnApk4YczQnwsyg?auto=format&w=800',
    easy: 'https://images.unsplash.com/photo-1637094408647-0d81d08f81b5?auto=format&fit=crop&w=800&q=85',
    difficult: 'https://images.unsplash.com/photo-1704027689069-747471f0a40a?auto=format&fit=crop&w=800&q=85',
    safe: 'https://images.unsplash.com/photo-1664497980678-11c35991a12c?auto=format&fit=crop&w=800&q=85',
    dangerous: 'https://images.unsplash.com/photo-1618325494752-a48728cc0edf?auto=format&fit=crop&w=800&q=85',
    boring: 'https://images.unsplash.com/photo-1758600436272-efba9e8183f0?auto=format&fit=crop&w=800&q=85',
    exciting: 'https://images.pexels.com/photos/5735790/pexels-photo-5735790.jpeg?auto=compress&cs=tinysrgb&w=800'
  };
  for (const w of words) {
    const price = w.en === 'cheap' ? '2 zł' : w.en === 'expensive' ? '200 zł' : '';
    const priceMarkup = price ? `<div class="price-tag" aria-label="Cena ${price}">${price}</div>` : '';
    w.pic = `<img src="${images[w.en]}" alt="Zdjęcie do słowa ${w.en}: ${w.scene}" loading="eager" referrerpolicy="no-referrer" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">` +
      `<div class="image-unavailable">Nie udało się wczytać zdjęcia.<br>Sprawdź połączenie z internetem.</div>` + priceMarkup;
  }

  const byEn = Object.fromEntries(words.map(w => [w.en, w]));
  const screen = document.getElementById('screen');
  const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const shuffle = arr => { const a=[...arr]; for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };

  const state = {
    stage:'start',
    learnIndex:0,
    chooseItems:[],
    chooseIndex:0,
    chooseLocked:false,
    choosePicked:'',
    buildItems:[],
    buildIndex:0,
    buildLocked:false,
    built:[],
    selected:[],
    scoreChoose:0,
    scoreBuild:0,
    errors:[]
  };

  function startChooseStage(){
    state.stage='choose';
    state.chooseItems=shuffle(words.map(w => ({ en:w.en, options:shuffle(w.pair) })));
    state.chooseIndex=0;
    state.chooseLocked=false;
    state.choosePicked='';
    render();
  }

  function startBuildStage(){
    state.stage='build';
    state.buildItems=shuffle(words.map(w => ({ en:w.en, chunks:shuffle([...w.chunks]) })));
    state.buildIndex=0;
    state.buildLocked=false;
    state.built=[];
    state.selected=[];
    render();
  }

  function resetAll(){
    state.stage='start';
    state.learnIndex=0;
    state.scoreChoose=0;
    state.scoreBuild=0;
    state.errors=[];
    render();
  }

  function speak(text){
    if(!('speechSynthesis' in window)) return;
    const synth = window.speechSynthesis;
    synth.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang='en-GB';
    u.rate=0.92;
    const voices = synth.getVoices();
    const v = voices.find(v => (v.lang||'').toLowerCase().replace('_','-')==='en-gb') || voices.find(v => (v.lang||'').toLowerCase().startsWith('en'));
    if(v) u.voice=v;
    synth.speak(u);
  }

  function renderStart(){
    screen.innerHTML = `
      <div class="spacer"></div>
      <h1 class="prompt">8 przymiotników</h1>
      <p class="note">Krótko. Spokojnie. Jedno zadanie na ekranie.</p>
      <button class="main-btn" data-action="start-learn">Zaczynamy</button>
      <div class="spacer"></div>
    `;
  }

  function renderLearn(){
    const w = words[state.learnIndex];
    screen.innerHTML = `
      <div class="counter">${state.learnIndex + 1} / ${words.length}</div>
      <div class="stage">Poznaj słowo</div>
      <div class="picture">${w.pic}</div>
      <div class="icon-row"><button class="icon-btn" data-action="say" aria-label="Odsłuchaj słowo">🔊 Posłuchaj</button></div>
      <div class="word" lang="en">${esc(w.en)}</div>
      <div class="meaning">${esc(w.pl)}</div>
      <div class="spacer"></div>
      <button class="main-btn" data-action="next-learn">${state.learnIndex === words.length - 1 ? 'Ćwiczymy' : 'Dalej'}</button>
    `;
  }

  function renderChoose(){
    const item = state.chooseItems[state.chooseIndex];
    const w = byEn[item.en];
    let html = `
      <div class="counter">${state.chooseIndex + 1} / ${state.chooseItems.length}</div>
      <div class="stage">Wybierz słowo</div>
      <div class="picture">${w.pic}</div>
      <p class="prompt">Które słowo pasuje?</p>
      <div class="choices">
        ${item.options.map(opt => `<button class="big-btn" data-choice="${esc(opt)}">${esc(opt)}</button>`).join('')}
      </div>
    `;

    if(state.chooseLocked){
      const ok = state.choosePicked === w.en;
      html += `
        <p class="feedback ${ok ? 'ok' : 'bad'}">${ok ? 'Dobrze!' : 'Poprawna odpowiedź:'}</p>
        <p class="answer"><strong>${esc(w.en)}</strong> = ${esc(w.pl)}</p>
        <button class="main-btn" data-action="next-choose">${state.chooseIndex === state.chooseItems.length - 1 ? 'Pisownia' : 'Dalej'}</button>
      `;
    }

    screen.innerHTML = html;
  }

  function renderBuild(){
    const item = state.buildItems[state.buildIndex];
    const w = byEn[item.en];
    const finished = state.built.length === w.chunks.length;
    const builtWord = state.built.join('');
    const ok = finished && builtWord === w.en;

    let html = `
      <div class="counter">${state.buildIndex + 1} / ${state.buildItems.length}</div>
      <div class="stage">Ułóż słowo</div>
      <div class="picture">${w.pic}</div>
      <div class="meaning">${esc(w.pl)}</div>
      <div class="build" aria-label="Układane słowo">
        ${state.built.length ? state.built.map(part => `<div class="built-part">${esc(part)}</div>`).join('') : '<div class="note">Dotknij kawałki słowa.</div>'}
      </div>
      <div class="chunks">
        ${item.chunks.map((part, index) => `<button class="chunk-btn" data-chunk-index="${index}" ${state.selected.includes(index) || state.buildLocked ? 'disabled' : ''}>${esc(part)}</button>`).join('')}
      </div>
    `;

    if(!state.buildLocked){
      html += `
        <button class="main-btn" data-action="check-build" ${finished ? '' : 'disabled'}>Sprawdź</button>
        <button class="ghost-btn" data-action="reset-build" ${state.built.length ? '' : 'disabled'}>Wyczyść</button>
      `;
    } else {
      html += `
        <p class="feedback ${ok ? 'ok' : 'bad'}">${ok ? 'Dobrze!' : 'Poprawne słowo:'}</p>
        <p class="answer"><strong>${esc(w.en)}</strong> = ${esc(w.pl)}</p>
        <button class="main-btn" data-action="next-build">${state.buildIndex === state.buildItems.length - 1 ? 'Wynik' : 'Dalej'}</button>
      `;
    }

    screen.innerHTML = html;
  }

  function renderEnd(){
    const total = words.length * 2;
    const score = state.scoreChoose + state.scoreBuild;
    const mistakes = state.errors.length
      ? `<div class="list">${state.errors.map(e => `<div class="item"><strong>${esc(e.en)}</strong> = ${esc(e.pl)}</div>`).join('')}</div>`
      : '<p class="note">Wszystkie odpowiedzi poprawne.</p>';

    screen.innerHTML = `
      <div class="spacer"></div>
      <div class="stage">Koniec</div>
      <div class="summary">${score} / ${total}</div>
      <p class="note">Rozpoznawanie: ${state.scoreChoose} / ${words.length}<br>Pisownia: ${state.scoreBuild} / ${words.length}</p>
      <p class="prompt" style="font-size:1.5rem">Słowa do dalszej nauki</p>
      ${mistakes}
      <button class="main-btn" data-action="restart">Jeszcze raz</button>
      <div class="spacer"></div>
    `;
  }

  function render(){
    if(state.stage === 'start') return renderStart();
    if(state.stage === 'learn') return renderLearn();
    if(state.stage === 'choose') return renderChoose();
    if(state.stage === 'build') return renderBuild();
    if(state.stage === 'end') return renderEnd();
  }

  screen.addEventListener('click', e => {
    const action = e.target.closest('[data-action]')?.dataset.action;
    const choice = e.target.closest('[data-choice]')?.dataset.choice;
    const chunkIndex = e.target.closest('[data-chunk-index]')?.dataset.chunkIndex;

    if(action){
      switch(action){
        case 'start-learn':
          state.stage='learn';
          state.learnIndex=0;
          render();
          return;
        case 'say':
          speak(words[state.learnIndex].en);
          return;
        case 'next-learn':
          if(state.learnIndex < words.length - 1){
            state.learnIndex += 1;
            render();
          } else {
            startChooseStage();
          }
          return;
        case 'next-choose':
          if(state.chooseIndex < state.chooseItems.length - 1){
            state.chooseIndex += 1;
            state.chooseLocked=false;
            state.choosePicked='';
            render();
          } else {
            startBuildStage();
          }
          return;
        case 'check-build': {
          const current = state.buildItems[state.buildIndex];
          const w = byEn[current.en];
          state.buildLocked = true;
          if(state.built.join('') === w.en){
            state.scoreBuild += 1;
          } else {
            state.errors.push({en:w.en, pl:w.pl});
          }
          render();
          return;
        }
        case 'reset-build':
          if(state.buildLocked) return;
          state.built=[];
          state.selected=[];
          render();
          return;
        case 'next-build':
          if(state.buildIndex < state.buildItems.length - 1){
            state.buildIndex += 1;
            state.buildLocked = false;
            state.built=[];
            state.selected=[];
            render();
          } else {
            state.stage='end';
            render();
          }
          return;
        case 'restart':
          resetAll();
          return;
      }
    }

    if(choice && state.stage === 'choose' && !state.chooseLocked){
      const current = state.chooseItems[state.chooseIndex];
      const w = byEn[current.en];
      state.choosePicked = choice;
      state.chooseLocked = true;
      if(choice === w.en){
        state.scoreChoose += 1;
      } else {
        state.errors.push({en:w.en, pl:w.pl});
      }
      render();
      return;
    }

    if(chunkIndex !== undefined && state.stage === 'build' && !state.buildLocked){
      const current = state.buildItems[state.buildIndex];
      const index = Number(chunkIndex);
      if(state.selected.includes(index)) return;
      state.selected.push(index);
      state.built.push(current.chunks[index]);
      render();
      return;
    }
  });

  render();

})();
</script>
</body>
</html>
