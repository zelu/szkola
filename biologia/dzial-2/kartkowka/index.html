  <style>

    *{box-sizing:border-box}html{scroll-behavior:auto}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;line-height:1.55}button{font:inherit;cursor:pointer}button:disabled{opacity:.5;cursor:not-allowed}button:focus-visible{outline:4px solid var(--focus);outline-offset:3px}main{max-width:920px;margin:0 auto;padding:20px 18px 72px}.site-header{background:#fff;border-bottom:1px solid var(--line)}.head-inner{max-width:920px;margin:0 auto;padding:14px 18px;display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{font-size:18px;font-weight:800;letter-spacing:-.035em}.brand .mark{display:inline-flex;align-items:center;justify-content:center;background:#dcebf8;color:var(--blue);border-radius:10px;width:40px;height:40px;margin-right:8px;font-size:15px}.head-actions{display:flex;gap:8px;flex-wrap:wrap}.nav-btn,.sound-btn{border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--ink);padding:9px 12px;font-weight:650;font-size:14px}.sound-btn{white-space:nowrap}.eyebrow{font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--blue);font-size:12px;margin:0 0 10px}.intro{padding:30px 0 16px}.intro h1,.page-heading h1{font-size:clamp(28px,5vw,38px);letter-spacing:-.045em;line-height:1.2;margin:0 0 12px}.intro p,.lead{font-size:18px;color:var(--muted);margin:0;max-width:720px}.summary{border:1px solid var(--line);border-radius:18px;padding:18px 20px;background:var(--paper);margin:22px 0}.summary-top{display:flex;justify-content:space-between;gap:12px;align-items:baseline;font-size:15px;font-weight:750}.progress{background:#e5edf4;overflow:hidden;height:9px;border-radius:99px;margin-top:12px}.progress > span{display:block;background:#3372ac;border-radius:99px;height:100%;transition:width .15s ease}.steps{display:flex;gap:7px;flex-wrap:wrap;margin:22px 0 20px}.step{background:var(--light);border:1px solid #d5e5f2;color:#2d4f6c;border-radius:10px;padding:8px 12px;font-size:14px;font-weight:650}.unit-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.unit-card{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:19px 19px 17px;display:flex;flex-direction:column;gap:8px}.unit-meta{font-size:13px;font-weight:800;color:var(--blue);text-transform:uppercase;letter-spacing:.04em}.unit-card h2{font-size:20px;line-height:1.25;margin:0;letter-spacing:-.025em}.unit-card p{color:var(--muted);font-size:15px;flex:1;margin:0}.small-done{color:var(--green);font-weight:750;font-size:13px}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}.btn{border-radius:13px;border:1px solid transparent;padding:13px 18px;font-size:16px;font-weight:750;min-height:52px;text-align:center}.btn-primary{background:var(--blue);color:#fff}.btn-primary:hover{background:#214d7c}.btn-secondary{background:#fff;color:var(--blue);border-color:#bdcbd8}.btn-quiet{background:#fff;color:var(--ink);border-color:var(--line)}.btn-small{min-height:42px;padding:8px 12px;font-size:14px;align-self:flex-start;margin-top:2px}.btn-block{width:100%}.divider{margin:28px 0;border:0;border-top:1px solid var(--line)}.test-promo{background:#fff;border:1px solid var(--line);padding:24px;border-radius:18px}.test-promo h2{font-size:23px;line-height:1.25;margin:0 0 8px}.test-promo p{font-size:16px;color:var(--muted);margin:0}.page-heading{margin:22px 0 18px}.page-heading .muted{color:var(--muted);font-weight:600;font-size:14px}.learning-card,.question-card,.result-card,.break-card{background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:clamp(20px,4vw,34px);box-shadow:0 3px 9px #19365208}.learning-card h2{font-size:clamp(25px,4.5vw,33px);line-height:1.25;letter-spacing:-.025em;margin:0 0 17px}.learn-text{font-size:clamp(20px,2.7vw,24px);font-weight:450;line-height:1.55;margin:0}.learn-text strong{font-weight:800}.remember{margin-top:24px;border-left:4px solid #80aed1;background:#f2f7fb;border-radius:0 12px 12px 0;padding:13px 15px;font-size:18px}.remember strong{font-weight:800}.learning-controls{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-top:18px}.question-card h2{font-size:clamp(23px,4vw,30px);line-height:1.32;letter-spacing:-.025em;margin:8px 0 26px}.answer-list{display:grid;gap:12px;margin-top:14px}.answer{width:100%;display:flex;align-items:center;gap:16px;min-height:68px;text-align:left;background:#fff;border:2px solid #d6e1ec;border-radius:14px;padding:12px 16px;color:var(--ink);font-size:clamp(17px,2.5vw,20px);font-weight:650}.answer:hover:not(:disabled){background:#f0f6fc;border-color:#a6c4dd}.answer .answer-letter{width:34px;height:34px;flex:0 0 34px;display:grid;place-items:center;background:#eaf1f7;color:#315b80;font-size:15px;border-radius:9px;font-weight:850}.answer.is-selected{border-color:var(--blue);background:#eef5fb}.answer.correct{border-color:#71b397;background:var(--green-bg)}.answer.incorrect{border-color:#d99a91;background:var(--red-bg)}.feedback{margin-top:18px;padding:16px 18px;border-radius:14px;font-size:17px;line-height:1.5}.feedback.good{background:var(--green-bg);border:1px solid #afd9c0}.feedback.bad{background:var(--red-bg);border:1px solid #e9bab3}.feedback strong{font-weight:850}.feedback p{margin:4px 0 0}.question-bottom{display:flex;justify-content:flex-end;margin-top:20px}.meter{display:flex;align-items:center;gap:12px;margin-bottom:15px;color:var(--muted);font-size:14px;font-weight:700}.meter .progress{flex:1;margin:0;height:7px}.diagram{margin:20px auto 6px;max-width:520px}.diagram svg{width:100%;height:auto;display:block;max-height:290px}.diagram-caption{color:var(--muted);font-size:14px;text-align:center;margin:0 auto 8px;max-width:480px}.result-card h2,.break-card h2{margin:0 0 10px;font-size:clamp(25px,4vw,32px)}.result-card p,.break-card p{font-size:18px;margin:4px 0 14px;color:var(--muted)}.big-score{font-size:clamp(45px,9vw,70px);line-height:1.1;letter-spacing:-.05em;font-weight:850;color:var(--blue);margin:10px 0 15px}.review-list{padding:0;list-style:none;display:grid;gap:12px}.review-item{background:#f7f9fb;border:1px solid var(--line);border-radius:12px;padding:14px}.review-item h3{font-size:16px;margin:0 0 6px}.review-item p{font-size:15px;margin:5px 0}.review-item .good-text{color:var(--green);font-weight:800}.review-item .bad-text{color:var(--red);font-weight:700}.mini-table{margin-top:20px;display:grid;gap:8px}.comparison{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:8px;margin-top:12px}.comparison .mini-cell{border:1px solid var(--line);border-radius:10px;background:#fafbfd;padding:10px 6px;text-align:center}.mini-cell strong{display:block;font-size:13px;margin:4px 0}.mini-cell span{font-size:13px;color:var(--muted)}.small-note{color:var(--muted);font-size:14px;margin:12px 0 0}.status-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:20px 0}.status-list div{background:#f6f9fc;border:1px solid var(--line);border-radius:12px;padding:12px}.status-list strong{display:block;font-size:18px}.status-list span{font-size:13px;color:var(--muted)}.tip{font-size:15px;color:var(--muted);margin-top:14px}.foot{margin-top:34px;border-top:1px solid var(--line);padding-top:16px;color:var(--muted);font-size:13px} .quiet-space{height:6px}.hidden{display:none!important} @media(max-width:640px){main{padding:14px 14px 46px}.head-inner{padding:10px 14px}.brand{font-size:16px}.brand .mark{width:34px;height:34px}.unit-grid{grid-template-columns:1fr}.intro{padding-top:24px}.learning-card,.question-card,.result-card,.break-card{padding:20px 18px}.learning-controls{flex-wrap:wrap}.learning-controls .btn-primary{flex:1}.answer{min-height:66px;padding:12px}.comparison{grid-template-columns:repeat(2,minmax(0,1fr))}.status-list{grid-template-columns:1fr 1fr}}@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}@media print {.site-header,.btn,.head-actions,.sound-btn{display:none!important}body{background:white}main{max-width:100%}.result-card{box-shadow:none}}

    /* Osobna kartkówka. Spokojne, duże pola do zaznaczania na tablecie. */
    .kart-promos{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
    .kart-promos .test-promo{height:100%;display:flex;flex-direction:column;gap:8px}
    .kart-promos .test-promo .actions{margin-top:auto;padding-top:14px}
    .kart-grid{display:grid;gap:12px;margin-top:22px}
    .kart-row{display:grid;grid-template-columns:minmax(100px,1fr) auto;align-items:center;gap:14px;padding:14px 16px;background:#f8fafc;border:1px solid var(--line);border-radius:14px}
    .kart-row .term{font-size:18px;font-weight:720}
    .kart-row .choice-pair{display:flex;gap:9px}
    .kart-chip{min-width:62px;min-height:50px;border:2px solid #cad8e4;border-radius:12px;background:white;color:var(--ink);font-weight:800;font-size:21px}
    .kart-chip[aria-pressed="true"]{border-color:var(--blue);background:#e8f1fa;color:var(--blue)}
    .kart-select{min-width:195px;max-width:280px;width:100%;border:2px solid #bdcad7;border-radius:12px;padding:12px;background:#fff;color:var(--ink);font:inherit;font-weight:650;font-size:17px;min-height:54px}
    .kart-number{display:inline-grid;place-items:center;background:#eaf1f8;color:#204b78;border-radius:9px;min-width:38px;height:38px;font-size:19px;font-weight:850}
    .kart-mark-row{display:grid;grid-template-columns:40px 1fr;gap:14px;align-items:center;border:1px solid var(--line);border-radius:13px;padding:10px 12px;background:#f9fbfd}
    .kart-mark-row .kart-select{max-width:none}
    .kart-functions{display:grid;gap:10px;margin:18px 0 24px;padding:16px 20px;background:#f4f7fa;border:1px solid var(--line);border-radius:14px}
    .kart-function{display:grid;grid-template-columns:30px 1fr;gap:12px;line-height:1.45}
    .kart-subtitle{font-size:17px;color:var(--muted);margin:6px 0 16px}
    .kart-note{background:#eef4fa;padding:13px 16px;border-radius:12px;color:#315572;font-size:15px;margin:20px 0 0}
    .kart-review{margin-top:20px}
    .kart-review strong{font-weight:800}
    @media(max-width:670px){.kart-promos{grid-template-columns:1fr}.kart-row{grid-template-columns:1fr;gap:10px}.kart-select{max-width:none}.kart-row .choice-pair{justify-content:flex-start}}

<body>
  <header class="site-header"><div class="head-inner"><div class="brand"><span class="mark">BIO</span> Świat komórek</div><div class="head-actions"><button type="button" class="nav-btn" data-action="home">Wszystkie tematy</button></div></div></header>
  <main id="app" aria-live="polite"></main>
  <script>
  'use strict';
  // Treści przygotowane wyłącznie na podstawie przesłanych stron 29–38 podręcznika.
  const modules = [
    {
      id:'podstawy', title:'Czym jest komórka?', sub:'Najważniejsza definicja i rodzaje organizmów.',
      cards:[
        {title:'Wszystko zaczyna się od komórki',text:'<strong>Komórka</strong> jest najmniejszą częścią organizmu, która może wykonywać czynności życiowe.',remember:'Komórka = podstawowa jednostka życia.',art:'cells'},
        {title:'Jedna albo wiele',text:'<strong>Jednokomórkowy</strong> organizm składa się z jednej komórki, np. bakteria. <strong>Wielokomórkowy</strong> składa się z wielu komórek, np. zwierzę.',remember:'Jednokomórkowy = 1 komórka. Wielokomórkowy = wiele komórek.'},
        {title:'Nie wszystkie są takie same',text:'Komórki różnią się <strong>wielkością, kształtem i budową</strong>. Kształt często pomaga im wykonywać zadanie.',remember:'Inne zadanie może oznaczać inny kształt.'}
      ],
      check:[
        {q:'Dlaczego komórkę nazywamy podstawową jednostką życia?',o:['Bo jest zawsze okrągła.','Bo wykonuje czynności życiowe.','Bo jest widoczna gołym okiem.'],a:1,why:'Komórka jest najmniejszą częścią organizmu zdolną do wykonywania czynności życiowych.'},
        {q:'Z ilu komórek składa się organizm jednokomórkowy?',o:['Z jednej.','Z wielu.','Z dwóch.'],a:0,why:'Organizm jednokomórkowy ma tylko jedną komórkę.'},
        {q:'Czym mogą się różnić komórki?',o:['Tylko kolorem.','Tylko miejscem występowania.','Wielkością, kształtem i budową.'],a:2,why:'Podręcznik wskazuje wielkość, kształt i budowę komórek.'}
      ]
    },
    {
      id:'ksztalty',title:'Kształty komórek',sub:'Plemnik, komórka nerwowa, jajowa i komórki roślin.',
      cards:[
        {title:'Ruch i zapasy',text:'<strong>Plemnik</strong> ma długą wić, dzięki której się porusza. <strong>Komórka jajowa</strong> ma kształt kuli i zawiera substancje zapasowe.',remember:'Plemnik: wić. Komórka jajowa: kula.',art:'shapes'},
        {title:'Informacje i ochrona',text:'<strong>Komórka nerwowa</strong> ma długie wypustki do przekazywania informacji. <strong>Komórka nabłonka</strong> przypomina kostkę i tworzy warstwę ochronną.',remember:'Nerwowa: wypustki. Nabłonkowa: kostka i ochrona.'},
        {title:'Kształty komórek roślin',text:'Komórki szparkowe przypominają <strong>nasiona fasoli</strong>. <strong>Włośniki</strong> są długie i pobierają wodę z solami mineralnymi. Komórki przewodzące wodę tworzą <strong>rury</strong>.',remember:'Kształt pomaga komórce w jej pracy.',art:'plantshape'}
      ],
      check:[
        {q:'Co umożliwia plemnikowi ruch?',o:['Ściana komórkowa.','Długa wić.','Chloroplast.'],a:1,why:'Dzięki długiej wici plemnik może się przemieszczać.'},
        {q:'Dlaczego komórka nerwowa ma długie wypustki?',o:['Żeby przekazywać informacje.','Żeby magazynować wodę.','Żeby chronić korzeń.'],a:0,why:'Wypustki łączą komórki nerwowe z innymi komórkami.'},
        {q:'Które komórki rośliny pobierają wodę i sole mineralne z podłoża?',o:['Komórki szparkowe.','Komórki jajowe.','Włośniki.'],a:2,why:'Włośniki to długie komórki w korzeniu pobierające wodę i sole mineralne.'}
      ]
    },
    {
      id:'zwierzeca',title:'Komórka zwierzęca',sub:'Błona, cytoplazma, cytozol i jądro.',
      cards:[
        {title:'Co otacza komórkę?',text:'<strong>Błona komórkowa</strong> otacza komórkę, oddziela ją od otoczenia i transportuje substancje do środka i na zewnątrz.',remember:'Błona = granica i transport.',art:'animal'},
        {title:'Co wypełnia komórkę?',text:'Wnętrze wypełnia <strong>cytoplazma</strong>. Jej galaretowatą częścią jest <strong>cytozol</strong>, w którym znajdują się inne elementy komórki.',remember:'Cytozol = galaretowata część cytoplazmy.'},
        {title:'Kto kieruje pracą?',text:'<strong>Jądro komórkowe</strong> kieruje procesami w komórce. Zawiera <strong>DNA</strong>. Zwykle znajduje się blisko środka komórki.',remember:'Jądro = kieruje pracą i zawiera DNA.',art:'animal'}
      ],
      check:[
        {q:'Co oddziela wnętrze komórki zwierzęcej od otoczenia?',o:['Błona komórkowa.','Rybosom.','Wakuola.'],a:0,why:'To błona komórkowa tworzy granicę i uczestniczy w transporcie substancji.'},
        {q:'Jak nazywa się galaretowata część cytoplazmy?',o:['Chloroplast.','Jądro.','Cytozol.'],a:2,why:'Cytozol to galaretowata substancja wypełniająca komórkę.'},
        {q:'Gdzie w komórce zwierzęcej znajduje się DNA?',o:['W ścianie komórkowej.','W jądrze komórkowym.','W wici.'],a:1,why:'Jądro komórkowe zawiera DNA i kieruje procesami w komórce.'}
      ]
    },
    {
      id:'funkcje',title:'Do czego służą elementy?',sub:'Mitochondria, rybosomy, wakuole i inne.',
      cards:[
        {title:'Energia i białka',text:'<strong>Mitochondria</strong> dostarczają energii komórce. <strong>Rybosomy</strong> odpowiadają za wytwarzanie białek.',remember:'Mitochondrium = energia. Rybosom = białka.',art:'animal'},
        {title:'Małe pęcherzyki',text:'<strong>Wakuole (wodniczki)</strong> w komórce zwierzęcej mają postać małych pęcherzyków. Mogą uczestniczyć w pobieraniu, trawieniu i usuwaniu substancji.',remember:'Wakuola = pęcherzyk uczestniczący w różnych czynnościach.'},
        {title:'Transport wewnątrz komórki',text:'<strong>Aparat Golgiego</strong> przekształca i transportuje białka. <strong>Siateczka śródplazmatyczna</strong> bierze udział w wytwarzaniu i transporcie białek i tłuszczów.',remember:'Aparat Golgiego i siateczka pomagają w wytwarzaniu lub transporcie substancji.'}
      ],
      check:[
        {q:'Który element dostarcza komórce energii?',o:['Rybosom.','Mitochondrium.','Wakuola.'],a:1,why:'Mitochondrium to centrum energetyczne komórki.'},
        {q:'Co wytwarzają rybosomy?',o:['Białka.','Wodę.','Ścianę komórkową.'],a:0,why:'Rybosomy odpowiadają za wytwarzanie białek.'},
        {q:'Który element przekształca i transportuje białka?',o:['Jądro komórkowe.','Wić.','Aparat Golgiego.'],a:2,why:'Aparat Golgiego odpowiada za przekształcanie i transportowanie białek.'}
      ]
    },
    {
      id:'jadrowe',title:'Jądrowe i bezjądrowe',sub:'Jaka jest najważniejsza różnica?',
      cards:[
        {title:'Komórki jądrowe',text:'Komórki <strong>zwierząt, roślin i grzybów</strong> mają jądro komórkowe. Dlatego nazywamy je <strong>jądrowymi</strong>.',remember:'Zwierzęca + roślinna + grzybowa = jądrowe.',art:'animal'},
        {title:'Komórki bezjądrowe',text:'Komórki <strong>bakterii</strong> nie mają jądra komórkowego. Ich <strong>nić DNA</strong> znajduje się w cytozolu.',remember:'Bakteria: bez jądra, ale ma DNA.',art:'bacteria'},
        {title:'Co jest wspólne?',text:'Każdy z czterech omawianych rodzajów komórek ma <strong>błonę komórkową, cytozol i rybosomy</strong>.',remember:'Wszystkie: błona + cytozol + rybosomy.'}
      ],
      check:[
        {q:'Która z tych komórek jest bezjądrowa?',o:['Zwierzęca.','Roślinna.','Bakteryjna.'],a:2,why:'Komórka bakteryjna nie ma jądra komórkowego.'},
        {q:'Gdzie znajduje się nić DNA bakterii?',o:['W cytozolu.','W jądrze komórkowym.','W chloroplaście.'],a:0,why:'Bakteria nie ma jądra, a jej DNA znajduje się w cytozolu.'},
        {q:'Co mają wszystkie cztery rodzaje komórek?',o:['Chloroplasty.','Błonę komórkową.','Jądro komórkowe.'],a:1,why:'Błona występuje w komórce zwierzęcej, roślinnej, grzybowej i bakteryjnej.'}
      ]
    },
    {
      id:'roslinna',title:'Komórka roślinna',sub:'Ściana komórkowa, chloroplasty i duża wakuola.',
      cards:[
        {title:'Dodatkowa osłona',text:'Poza błoną komórka roślinna ma <strong>ścianę komórkową</strong>. Nadaje jej kształt i chroni ją. Głównym składnikiem ściany jest <strong>celuloza</strong>.',remember:'Ściana komórkowa = kształt i ochrona.',art:'plant'},
        {title:'Zielone chloroplasty',text:'<strong>Chloroplasty</strong> zawierają zielony barwnik <strong>chlorofil</strong>. Dzięki nim zachodzi <strong>fotosynteza</strong>, czyli wytwarzanie substancji pokarmowych.',remember:'Chloroplast = fotosynteza.',art:'plant'},
        {title:'Duża wakuola',text:'W typowej komórce roślinnej jest zwykle <strong>jedna duża wakuola</strong>. Zawiera głównie wodę i pomaga utrzymać jej odpowiednią ilość w komórce.',remember:'Komórka roślinna: zwykle jedna duża wakuola.'},
        {title:'Nie zapomnij o wspólnych częściach',text:'Komórka roślinna ma też <strong>błonę, cytozol, jądro, mitochondria i rybosomy</strong>, podobnie jak komórka zwierzęca.',remember:'Roślinna = wspólne części + ściana + chloroplasty.'}
      ],

    <g fill="#4e807e"><circle cx="325" cy="219" r="3"/><circle cx="347" cy="219" r="3"/><circle cx="156" cy="69" r="3"/></g><text x="260" y="286" text-anchor="middle" fill="#526274" font-size="15">Komórka roślinna · uproszczony rysunek</text></svg></div><p class="diagram-caption">Gruby zielony obrys: ściana. Zielone owale: chloroplasty. Jasne wnętrze: duża wakuola.</p>`;

    <text x="256" y="236" text-anchor="middle" fill="#526274" font-size="15">Bakteria · uproszczony rysunek</text></svg></div><p class="diagram-caption">Fioletowa nić: DNA. Kropki: rybosomy. Długi „ogon”: rzęska.</p>`;
    if(kind==='fungus')return `<div class="diagram"><svg viewBox="0 0 520 260" role="img" aria-label="Uproszczony schemat komórki grzybowej: ściana, błona, jądro, mitochondria i wakuola"><ellipse cx="260" cy="126" rx="170" ry="108" fill="#dbc0a0" stroke="#a57c50" stroke-width="13"/><ellipse cx="260" cy="126" rx="158" ry="96" fill="#daedf1" stroke="#8bb2ad" stroke-width="4"/><circle cx="245" cy="113" r="55" fill="#8872a4" stroke="#5f507c" stroke-width="5"/><circle cx="255" cy="110" r="11" fill="#5e4a7e"/><ellipse cx="354" cy="166" rx="37" ry="26" fill="#f2fafc" stroke="#9cc2cd" stroke-width="3"/><g fill="#d18c58" stroke="#a56339" stroke-width="3"><ellipse cx="156" cy="125" rx="33" ry="15" transform="rotate(-35 156 125)"/><ellipse cx="354" cy="90" rx="33" ry="15" transform="rotate(40 354 90)"/></g><g fill="#577880"><circle cx="171" cy="77" r="4"/><circle cx="192" cy="188" r="4"/><circle cx="303" cy="197" r="4"/><circle cx="340" cy="55" r="4"/></g><text x="260" y="255" text-anchor="middle" fill="#526274" font-size="15">Komórka grzybowa · uproszczony rysunek</text></svg></div><p class="diagram-caption">Brązowy obrys: ściana z chityny. Fioletowe: jądro. Nie ma chloroplastów.</p>`;
    if(kind==='shapes')return `<div class="diagram"><svg viewBox="0 0 520 205" role="img" aria-label="Kształty komórek: plemnik z wicią, komórka jajowa kula, komórka nerwowa z wypustkami"><g stroke="#447c9d" fill="none" stroke-width="5" stroke-linecap="round"><path d="M96 68q-16 27 1 49t-20 28t-9 32"/></g><ellipse cx="95" cy="53" rx="17" ry="25" fill="#8bbbd6" stroke="#447c9d" stroke-width="3" transform="rotate(-20 95 53)"/><circle cx="252" cy="88" r="45" fill="#f2c36a" stroke="#bf9353" stroke-width="4"/><g stroke="#7e6650" stroke-width="4" stroke-linecap="round"><path d="M412 88L376 44M412 88l3 -62M412 88l41 -40M412 88l50 10M412 88l-48 39M412 88l25 54M412 88l12 77M376 44l-16 -9M376 44l1 -19M453 48l15 -8M364 127l-14 -5M437 142l10 8"/></g><circle cx="412" cy="88" r="17" fill="#c8a17c" stroke="#83644c" stroke-width="4"/><g text-anchor="middle" fill="#526274" font-size="15"><text x="92" y="201">Plemnik</text><text x="252" y="153">Komórka jajowa</text><text x="414" y="201">Nerwowa</text></g></svg></div>`;
    if(kind==='plantshape')return `<div class="diagram"><svg viewBox="0 0 520 205" role="img" aria-label="Kształty komórek roślinnych: dwie fasolkowate komórki szparkowe, włośnik i długa komórka przewodząca wodę"><path d="M88 35q-55 38 -13 95q35 22 53 -30q-44 10 -40 -65Z" fill="#8ec08d" stroke="#397c5a" stroke-width="4"/><path d="M137 34q49 51 4 99q-35 9 -33 -34q37 -15 29 -65Z" fill="#8ec08d" stroke="#397c5a" stroke-width="4"/><g fill="#bd9876" stroke="#886b52" stroke-width="4"><path d="M214 35h54v79l18 14 56 27 -62 -12 -23 -16 -43 -1Z"/><path d="M375 28h59v124h-59Z"/></g><g stroke="#845f3e" stroke-width="5" fill="none"><path d="M378 45q40 6 53 28M378 70q40 6 53 28M378 95q40 6 53 28M378 120q40 6 53 28"/></g><g text-anchor="middle" fill="#526274" font-size="15"><text x="110" y="185">Szparkowe</text><text x="269" y="185">Włośnik</text><text x="405" y="185">Transport wody</text></g></svg></div>`;
    if(kind==='compare')return `<div class="comparison" role="group" aria-label="Porównanie komórek"><div class="mini-cell"><strong>Zwierzęca</strong><span>Jądro: tak<br>Ściana: nie<br>Chloroplasty: nie</span></div><div class="mini-cell"><strong>Roślinna</strong><span>Jądro: tak<br>Ściana: tak<br>Chloroplasty: tak*</span></div><div class="mini-cell"><strong>Grzybowa</strong><span>Jądro: tak<br>Ściana: tak<br>Chloroplasty: nie</span></div><div class="mini-cell"><strong>Bakteryjna</strong><span>Jądro: nie<br>Ściana: tak<br>Chloroplasty: nie</span></div></div><p class="small-note">* Dotyczy typowej komórki zielonej części rośliny, np. liścia.</p>`;

  }

  // Zaznaczona na schemacie część: czerwone kółko bez podpisów podpowiadających rozwiązanie.
  const markers={
    animal:{nucleus:[273,137,34],mitochondrion:[140,119,27],membrane:[260,28,13],vacuole:[406,97,24],ribosome:[170,76,12]},
    plant:{chloroplast:[344,69,24],vacuole:[269,162,32],wall:[96,50,15],nucleus:[223,79,32],mitochondrion:[158,213,20]},
    bacteria:{dna:[264,120,30],flagellum:[468,213,15],ribosome:[177,159,15],wall:[87,119,15]},
    fungus:{wall:[91,126,16],nucleus:[245,113,30],vacuole:[354,166,27],mitochondrion:[354,90,23]}
  };
  function markedArt(kind,part){
    const coords=markers[kind]&&markers[kind][part];
    if(!coords)return '';
    const [x,y,r]=coords;
    const circles=`<g aria-hidden="true"><circle cx="${x}" cy="${y}" r="${r}" fill="none" stroke="#fff" stroke-width="11"/><circle cx="${x}" cy="${y}" r="${r}" fill="none" stroke="#c63e35" stroke-width="5"/></g>`;
    return svgArt(kind)
      .replace(/<p class="diagram-caption">[\s\S]*?<\/p>/,'')
      .replace(/aria-label="[^"]*"/,'aria-label="Schemat komórki z elementem zaznaczonym czerwonym kółkiem"')
      .replace('</svg>',circles+'</svg>');
  }

  function home(){
    const done=progress.done.length;
    const next=modules.findIndex(x=>!progress.done.includes(x.id));
    return `<section class="intro"><p class="eyebrow">Biologia · dział o komórkach</p><h1>Odkryj świat komórek</h1><p>${modules.length} krótkich tematów. W każdym: kilka małych lekcji i 3 pytania sprawdzające. Potem osobna kartkówka i test końcowy sprawdzający cały zakres. <strong>Kolejność pytań i odpowiedzi zmienia się w każdej próbie.</strong></p></section>
      <div class="steps" aria-label="Etapy nauki"><span class="step">1. Nauka</span><span class="step">2. Test sprawdzający</span><span class="step">3. Kartkówka</span><span class="step">4. Test końcowy</span></div>
      <section class="summary"><div class="summary-top"><span>Ukończone tematy</span><span>${done} z ${modules.length}</span></div><div class="progress"><span style="width:${percent(done,modules.length)}%"></span></div><div class="actions">${btn('continue',done===modules.length?'Powtórz pierwszy temat':done>0?'Kontynuuj naukę':'Zacznij naukę')}</div></section>
      <h2 id="units-heading" style="font-size:22px;margin:25px 0 14px">Wybierz krótki temat</h2><div class="unit-grid" aria-labelledby="units-heading">${modules.map((m,i)=>`<article class="unit-card"><div class="unit-meta">Temat ${String(i+1).padStart(2,'0')} · ${m.cards.length} krótkie ekrany</div><h2>${esc(m.title)}</h2><p>${esc(m.sub)}</p>${progress.done.includes(m.id)?'<span class="small-done">✓ Ukończony test sprawdzający</span>':''}<button type="button" class="btn btn-secondary btn-small" data-action="start-lesson" data-mi="${i}">${progress.done.includes(m.id)?'Powtórz temat':'Ucz się'}</button></article>`).join('')}</div>
      <hr class="divider"><div class="kart-promos"><section class="test-promo"><p class="eyebrow">Etap 3</p><h2>Kartkówka</h2><p>4 zadania na podstawie przesłanej kartkówki: organizmy jądrowe, podpisywanie rysunku, znaki +/− i dopasowanie funkcji. Łącznie 11 punktów. Wynik dopiero po oddaniu.</p>${progress.lastKart?`<p class="small-note"><strong>Ostatni wynik:</strong> ${progress.lastKart.score} / ${progress.lastKart.total}</p>`:''}<div class="actions">${btn('kart-intro','Przejdź do kartkówki')}</div></section><section class="test-promo"><p class="eyebrow">Etap 4</p><h2>Test końcowy</h2><p>${examTargets.length} pytań w krótkich rundach po maksymalnie 6. Bez limitu czasu. Po oddaniu zobaczysz wynik i błędy, bez poprawek pojedynczych odpowiedzi.</p>${progress.lastExam?`<p class="small-note"><strong>Ostatni wynik:</strong> ${progress.lastExam.score} / ${progress.lastExam.total}</p>`:''}<div class="actions">${btn('exam-intro','Przejdź do testu końcowego')}</div></section></div><p class="foot">Materiał: przesłane zdjęcia podręcznika, strony 29–38. Postęp zapisuje się na tym urządzeniu w tej przeglądarce.</p>`;
  }
  function lesson(){const m=mod(),card=m.cards[state.ci];return `<header class="page-heading"><p class="eyebrow">Temat ${state.mi+1} / ${modules.length} · Nauka</p><h1>${esc(m.title)}</h1><p class="muted">Jeden mały krok na raz. Bez pośpiechu.</p></header>${meter(state.ci+1,m.cards.length,'Ekran')}<section class="learning-card" data-readable><h2>${esc(card.title)}</h2><p class="learn-text">${card.text}</p>${card.art?svgArt(card.art):''}<div class="remember"><strong>Zapamiętaj:</strong> ${esc(card.remember)}</div></section><div class="learning-controls"><button class="btn btn-quiet" type="button" data-action="prev-card" ${state.ci===0?'disabled':''}>Wstecz</button>${listen()}${btn('next-card',state.ci===m.cards.length-1?'Sprawdź, co pamiętasz':'Dalej')}</div>`}
  function questionView(q,n,total,mode){const check=mode==='check';const review=mode==='review';const idx=review?state.reviewIndex:check?state.qi:state.examIndex;const ans=review?state.reviewAnswers[idx]:check?state.checkAnswers[idx]:state.examAnswers[idx];const picked=ans!==undefined;const feedback=check||review;const label=check?'Test sprawdzający':review?'Powtórka błędów':'Test końcowy';const term=check?mod().title:(review?'Ćwiczymy to, co było trudne':'Runda '+(Math.floor(idx/EXAM_ROUND_SIZE)+1)+' z '+examRoundCount());const classFor=(i)=>{if(!picked)return '';if(feedback){if(i===q.a)return ' correct';if(i===ans)return ' incorrect';return '';}return i===ans?' is-selected':''};const answeredRight=picked&&ans===q.a;
    return `<header class="page-heading"><p class="eyebrow">${esc(label)}</p><h1>${esc(term)}</h1>${!check&&!review?'<p class="muted">Wynik poznasz na końcu. Bez limitu czasu.</p>':'<p class="muted">Wybierz jedną odpowiedź.</p>'}</header>${meter(idx+1,total,'Pytanie')}<section class="question-card"><div data-readable><h2>${esc(q.q)}</h2>${q.mark?markedArt(q.art,q.mark):q.art?svgArt(q.art):''}</div><div class="answer-list" role="group" aria-label="Wybierz odpowiedź">${q.o.map((v,i)=>`<button class="answer${classFor(i)}" data-action="answer" data-answer="${i}" type="button" ${feedback&&picked?'disabled':''} aria-pressed="${picked&&ans===i?'true':'false'}"><span class="answer-letter">${['A','B','C'][i]}</span><span>${esc(v)}</span></button>`).join('')}</div>${feedback&&picked?`<div class="feedback ${answeredRight?'good':'bad'}" role="status"><strong>${answeredRight?'✓ Dobrze!':'Spróbuj zapamiętać:'}</strong><p>${esc(q.why)}</p>${!answeredRight?`<p><strong>Poprawna odpowiedź:</strong> ${esc(q.o[q.a])}</p>`:''}</div>`:''}${!feedback&&picked?'<p class="tip">Odpowiedź zaznaczona. Możesz ją zmienić przed przejściem dalej.</p>':''}<div class="question-bottom">${btn('next-question',idx===total-1?(check||review?'Zobacz wynik':'Oddaj test i zobacz wynik'):'Następne pytanie', 'btn-primary',!picked)}</div></section>${check?'<p class="tip">W treningu od razu widzisz wyjaśnienie, także po pomyłce.</p>':''}`;
  }
  function checkDone(){const m=mod();const score=state.checkQuestions.reduce((n,q,i)=>n+(state.checkAnswers[i]===q.a),0);const errors=state.checkQuestions.map((q,i)=>state.checkAnswers[i]===q.a?null:{...q,moduleId:m.id}).filter(Boolean);const next=state.mi<modules.length-1;
    return `<header class="page-heading"><p class="eyebrow">Temat ${state.mi+1} · Zakończony</p><h1>${esc(m.title)}</h1></header><section class="result-card"><h2>Test sprawdzający ukończony</h2><div class="big-score">${score} / ${state.checkQuestions.length}</div><p>${score===state.checkQuestions.length?'Wszystkie odpowiedzi poprawne.':score===state.checkQuestions.length-1?'Dobrze! Została tylko jedna rzecz do powtórzenia.':'Możesz wrócić do pytań i spokojnie je powtórzyć.'}</p>${errors.length?`<div class="review-list">${errors.map(q=>`<div class="review-item"><h3>${esc(q.q)}</h3><p class="good-text">${esc(q.o[q.a])}</p><p>${esc(q.why)}</p></div>`).join('')}</div>`:'<p class="good-text">✓ Ten temat jest opanowany.</p>'}<div class="actions">${errors.length?btn('retry-errors','Powtórz błędy','btn-secondary'):''}${btn('retry-lesson','Jeszcze raz nauka','btn-quiet')}${next?btn('next-module','Następny temat'):btn('kart-intro','Kartkówka')}</div></section>`;
  }
  function examIntro(){return `<header class="page-heading"><p class="eyebrow">Etap 4 · Test końcowy</p><h1>Co już wiesz o komórkach?</h1></header><section class="result-card"><h2>${examTargets.length} pytań. ${examRoundCount()} krótkich rund.</h2><p>W każdej rundzie jest maksymalnie 6 pytań. Po każdej można zrobić przerwę. Pytania i odpowiedzi losujemy na nowo przed każdym testem. W każdej próbie dostaniesz jedno pytanie z każdego z 30 ważnych zagadnień.</p><p><strong>Jak na sprawdzianie:</strong> po oddaniu testu zobaczysz wynik, swoje błędy i poprawne odpowiedzi. Nie można poprawiać pojedynczych pytań. Kolejna próba oznacza rozwiązanie wszystkich 30 pytań od początku.</p><div class="status-list"><div><strong>${examTargets.length}</strong><span>pytań</span></div><div><strong>${examRoundCount()} rund</strong><span>po 6 pytań</span></div><div><strong>Bez zegara</strong><span>pracujesz we własnym tempie</span></div><div><strong>Bez poprawek</strong><span>kolejna próba to cały test</span></div></div><div class="actions">${btn('start-exam','Rozpocznij test')}${btn('home','Wróć do tematów','btn-secondary')}</div></section>`}
  function examBreak(){const completed=state.examIndex,total=state.examQuestions.length;return `<header class="page-heading"><p class="eyebrow">Test końcowy · Przerwa</p><h1>Runda ${Math.floor(completed/EXAM_ROUND_SIZE)} zakończona</h1></header><section class="break-card"><h2>Masz już ${completed} z ${total} odpowiedzi.</h2><p>Możesz teraz zrobić przerwę. Nie ma pośpiechu.</p><div class="progress"><span style="width:${percent(completed,total)}%"></span></div><div class="actions">${btn('continue-exam','Rozpocznij kolejną rundę')}</div><p class="tip">Jeżeli pozostaniesz na tej stronie, test będzie czekał na dalsze odpowiedzi.</p></section>`}
  function examDone(){const q=state.examQuestions,ans=state.examAnswers;const score=q.reduce((n,item,i)=>n+(ans[i]===item.a),0);const errors=q.map((item,i)=>ans[i]===item.a?null:{...item,chosen:ans[i]}).filter(Boolean);const breakdown=modules.map(m=>{const vals=q.map((item,i)=>({item,i})).filter(x=>x.item.moduleId===m.id);return {m,score:vals.filter(v=>ans[v.i]===v.item.a).length,total:vals.length}});
    return `<header class="page-heading"><p class="eyebrow">Test końcowy · Wyniki</p><h1>Twój wynik</h1></header><section class="result-card"><div class="big-score">${score} / ${q.length}</div><p>${score===q.length?'Wszystkie odpowiedzi poprawne!':score>=Math.ceil(q.length*.78)?'Dużo już umiesz. Warto powtórzyć kilka szczegółów.':'Dobra okazja, żeby jeszcze raz przejść krótkie tematy.'}</p><div class="mini-table">${breakdown.map(x=>`<div class="summary-top" style="border-bottom:1px solid var(--line);padding:8px 0"><span>${esc(x.m.title)}</span><span>${x.score}/${x.total}</span></div>`).join('')}</div><p class="tip"><strong>Test został oddany.</strong> Odpowiedzi są zapisane w wyniku i nie można już ich zmieniać. Jeśli chcesz poprawić wynik, rozwiąż cały test od początku.</p><div class="actions">${btn('exam-intro','Rozwiąż cały test ponownie','btn-secondary')}${btn('home','Wszystkie tematy','btn-quiet')}</div></section>${errors.length?`<h2 style="font-size:22px;margin:24px 0 12px">Błędne odpowiedzi (${errors.length})</h2><p class="tip">Poniżej możesz sprawdzić swoje błędy. To tylko podgląd, bez możliwości zmiany odpowiedzi i wyniku.</p><div class="review-list">${errors.map(item=>`<div class="review-item"><h3>${esc(item.q)}</h3><p class="bad-text">Twoja odpowiedź: ${esc(item.o[item.chosen])}</p><p class="good-text">Poprawna: ${esc(item.o[item.a])}</p><p>${esc(item.why)}</p></div>`).join('')}</div>`:''}`;
  }
  function reviewDone(){const qs=state.reviewQuestions;const score=qs.reduce((n,q,i)=>n+(state.reviewAnswers[i]===q.a),0);return `<header class="page-heading"><p class="eyebrow">Powtórka błędów</p><h1>Powtórka zakończona</h1></header><section class="result-card"><div class="big-score">${score} / ${qs.length}</div><p>${score===qs.length?'Teraz wszystko się zgadza.':'Do tych pytań możesz wrócić jeszcze raz.'}</p><div class="actions">${score<qs.length?btn('retry-review','Jeszcze raz błędne','btn-secondary'):''}${btn('home','Wszystkie tematy')}${btn('exam-intro','Test końcowy','btn-quiet')}</div></section>`}

  // Kartkówka: pojedynczy spójny zestaw czterech typów zadań z przesłanego zdjęcia.
  // W kolejnych podejściach wybieramy drugi wariant każdego typu, bez nazw grup.
  const kartVariants={
    choice:[
      {q:'W którym punkcie wymieniono wyłącznie organizmy jądrowe?',options:['Tylko bakterie.','Bakterie i zwierzęta.','Rośliny i zwierzęta.','Bakterie i grzyby.'],correct:'Rośliny i zwierzęta.',why:'Komórki zwierzęce i roślinne mają jądro. Bakterie go nie mają.'},
      {q:'W którym punkcie wymieniono wyłącznie organizmy bezjądrowe?',options:['Bakterie i zwierzęta.','Tylko bakterie.','Bakterie i grzyby.','Rośliny i zwierzęta.'],correct:'Tylko bakterie.',why:'Spośród tych organizmów tylko bakterie mają komórki bezjądrowe.'}
    ],
    diagram:[
      {q:'Podpisz wskazane elementy komórki bakteryjnej.',art:'bacteria',targets:[{key:'rzęska',coord:[463,211],badge:[481,151]},{key:'nić DNA',coord:[263,120],badge:[268,34]},{key:'ściana komórkowa',coord:[88,119],badge:[34,72]}],options:['cytozol','ściana komórkowa','rzęska','nić DNA'],why:'W komórce bakteryjnej nić DNA znajduje się w cytozolu, ściana jest na zewnątrz błony, a rzęska może służyć do ruchu.'},
      {q:'Podpisz wskazane elementy komórki roślinnej.',art:'plant',targets:[{key:'mitochondrium',coord:[158,213],badge:[143,261]},{key:'wakuola',coord:[270,158],badge:[316,187]},{key:'ściana komórkowa',coord:[97,50],badge:[45,29]}],options:['chloroplast','wakuola','ściana komórkowa','mitochondrium'],why:'Mitochondrium dostarcza energii, wakuola to duży jasny pęcherz, a ściana komórkowa tworzy sztywny obrys.'}
    ],
    compare:[
      {q:'Wpisz „+” przy elementach wspólnych dla komórki roślinnej i zwierzęcej, a „−” przy tych, które je różnią.',rows:[{name:'błona komórkowa',value:'+'},{name:'ściana komórkowa',value:'−'},{name:'mitochondrium',value:'+'},{name:'chloroplasty',value:'−'}],why:'Obie komórki mają błonę i mitochondria. Ściana komórkowa i chloroplasty odróżniają typową komórkę roślinną od zwierzęcej.'},
      {q:'Wpisz „+” przy elementach wspólnych dla komórki roślinnej i bakteryjnej, a „−” przy tych, które je różnią.',rows:[{name:'rzęska',value:'−'},{name:'błona komórkowa',value:'+'},{name:'mitochondrium',value:'−'},{name:'ściana komórkowa',value:'+'}],why:'Komórka roślinna i bakteryjna mają błonę oraz ścianę. Roślinna ma mitochondria, a niektóre bakterie mają rzęski.'}
    ],
    match:[
      {q:'Połącz każdy element komórki z jego funkcją.',items:['Ściana komórkowa','Jądro komórkowe','Chloroplast'],functions:['Wytwarza substancje pokarmowe podczas fotosyntezy.','Nadaje kształt komórce i chroni ją przed uszkodzeniami.','Dostarcza komórce energii.','Kieruje wszystkimi czynnościami życiowymi komórki.'],keys:{'Ściana komórkowa':'Nadaje kształt komórce i chroni ją przed uszkodzeniami.','Jądro komórkowe':'Kieruje wszystkimi czynnościami życiowymi komórki.','Chloroplast':'Wytwarza substancje pokarmowe podczas fotosyntezy.'},why:'Ściana chroni i nadaje kształt, jądro kieruje pracą komórki, a chloroplast bierze udział w fotosyntezie.'},
      {q:'Połącz każdy element komórki z jego funkcją.',items:['Ściana komórkowa','Mitochondrium','Jądro komórkowe'],functions:['Dostarcza komórce energii.','Nadaje kształt komórce i chroni ją przed uszkodzeniami.','Kieruje wszystkimi czynnościami życiowymi komórki.','Wytwarza substancje pokarmowe podczas fotosyntezy.'],keys:{'Ściana komórkowa':'Nadaje kształt komórce i chroni ją przed uszkodzeniami.','Mitochondrium':'Dostarcza komórce energii.','Jądro komórkowe':'Kieruje wszystkimi czynnościami życiowymi komórki.'},why:'Ściana chroni, mitochondrium dostarcza energii, jądro kieruje czynnościami komórki.'}
    ]
  };
  const kartPoints={choice:1,diagram:3,compare:4,match:3};
  const kartTotal=11;
  function kartNew(){
    if(!shuffleHistory.kartVariants)shuffleHistory.kartVariants={};
    const selected=Object.keys(kartVariants).map(type=>{
      const variants=kartVariants[type];
      const prev=shuffleHistory.kartVariants[type];
      const i=shuffled(variants.map((_,n)=>n)).find(n=>n!==prev)??0;
      shuffleHistory.kartVariants[type]=i;
      const t={...variants[i],type,uid:`kart-${type}-${i}`};
      if(type==='choice')t.options=changedShuffle(t.options,shuffleHistory.options[t.uid],v=>v);
      if(type==='diagram')t.options=changedShuffle(t.options,shuffleHistory.options[t.uid],v=>v);
      if(type==='compare')t.rows=shuffled(t.rows);
      if(type==='match'){t.items=shuffled(t.items);t.functions=changedShuffle(t.functions,shuffleHistory.options[t.uid],v=>v)}
      if(t.options)shuffleHistory.options[t.uid]=[...t.options];
      if(t.type==='match')shuffleHistory.options[t.uid]=[...t.functions];
      return t;
    });
    state.kartTasks=changedShuffle(selected,shuffleHistory.orders.kart,t=>t.uid);
    shuffleHistory.orders.kart=state.kartTasks.map(t=>t.uid);
    try{localStorage.setItem(shuffleKey,JSON.stringify(shuffleHistory))}catch(e){}
    state.kartAnswers=state.kartTasks.map(()=>({}));state.kartIndex=0;
    navigate('kart');
  }
  function kartIntro(){
    return `<header class="page-heading"><p class="eyebrow">Etap 3 · Kartkówka</p><h1>Krótka kartkówka z komórek</h1></header><section class="result-card"><h2>4 zadania · 11 punktów</h2><p>Na podstawie przesłanego zdjęcia. Bez podziału na grupy. Zadania: wybór odpowiedzi, podpisy na rysunku, znaki +/− oraz dopasowanie funkcji.</p><p><strong>Zasada sprawdzianu:</strong> nie ma podpowiedzi ani poprawiania błędów po oddaniu. Wynik, swoje odpowiedzi i rozwiązania zobaczysz na samym końcu. Następna próba oznacza całą kartkówkę od początku.</p><div class="status-list"><div><strong>4 zadania</strong><span>jedno na ekranie</span></div><div><strong>11 punktów</strong><span>za wszystkie odpowiedzi</span></div><div><strong>Bez zegara</strong><span>w swoim tempie</span></div><div><strong>Nowy układ</strong><span>przy następnej próbie</span></div></div><div class="actions">${btn('start-kart','Rozpocznij kartkówkę')}${btn('home','Wszystkie tematy','btn-secondary')}</div></section>`;
  }
  function kartDiagram(t){
    const out=t.targets.map(({coord,badge},i)=>{
      const [x,y]=coord,[bx,by]=badge;
      return `<g aria-hidden="true"><path d="M${bx} ${by} L${x} ${y}" fill="none" stroke="#b34231" stroke-width="2.8"/><circle cx="${x}" cy="${y}" r="5.8" fill="#b34231" stroke="white" stroke-width="2"/><circle cx="${bx}" cy="${by}" r="16" fill="#fff" stroke="#b34231" stroke-width="3"/><text x="${bx}" y="${by+6}" font-size="17" fill="#842b23" text-anchor="middle" font-weight="800">${i+1}</text></g>`;
    }).join('');
    return svgArt(t.art).replace(/<p class="diagram-caption">[\s\S]*?<\/p>/,'')
      .replace(/aria-label="[^"]*"/,'aria-label="Schemat komórki z trzema oznaczeniami numerowanymi od 1 do 3"')
      .replace('</svg>',out+'</svg>');
  }
  function kartComplete(){
    const t=state.kartTasks[state.kartIndex],a=state.kartAnswers[state.kartIndex];
    if(!t)return false;
    if(t.type==='choice')return a.pick!==undefined;
    if(t.type==='diagram')return t.targets.every((_,i)=>a[i]!==undefined&&a[i]!=='');
    if(t.type==='compare')return t.rows.every(row=>a[row.name]!==undefined);
    if(t.type==='match')return t.items.every(name=>a[name]!==undefined&&a[name]!=='');
    return false;
  }
  function kartScreen(){
    const t=state.kartTasks[state.kartIndex],a=state.kartAnswers[state.kartIndex];
    let inner='';
    if(t.type==='choice')inner=`<div class="answer-list">${t.options.map((v,i)=>`<button class="answer${a.pick===v?' is-selected':''}" type="button" data-action="kart-pick" data-value="${esc(v)}" aria-pressed="${a.pick===v}"><span class="answer-letter">${'ABCD'[i]}</span><span>${esc(v)}</span></button>`).join('')}</div>`;
    if(t.type==='diagram')inner=`${kartDiagram(t)}<div class="kart-grid" aria-label="Nazwij wskazane części">${t.targets.map((item,i)=>`<label class="kart-mark-row"><span class="kart-number">${i+1}</span><select class="kart-select" data-kart-select="1" data-key="${i}" aria-label="Element numer ${i+1}"><option value="">Wybierz nazwę</option>${t.options.map(v=>`<option value="${esc(v)}" ${a[i]===v?'selected':''}>${esc(v)}</option>`).join('')}</select></label>`).join('')}</div>`;
    if(t.type==='compare')inner=`<div class="kart-grid">${t.rows.map(row=>`<div class="kart-row"><span class="term">${esc(row.name)}</span><div class="choice-pair" role="group" aria-label="${esc(row.name)}: wspólne czy różne"><button type="button" class="kart-chip" data-action="kart-compare" data-key="${esc(row.name)}" data-value="+" aria-pressed="${a[row.name]==='+'}">+</button><button type="button" class="kart-chip" data-action="kart-compare" data-key="${esc(row.name)}" data-value="−" aria-pressed="${a[row.name]==='−'}">−</button></div></div>`).join('')}</div><p class="small-note">+ = wspólny element. − = element, który różni komórki.</p>`;
    if(t.type==='match')inner=`<div class="kart-functions" aria-label="Lista funkcji">${t.functions.map((fun,i)=>`<div class="kart-function"><strong>${i+1}.</strong><span>${esc(fun)}</span></div>`).join('')}</div><div class="kart-grid">${t.items.map((name,i)=>`<label class="kart-row"><span class="term">${esc(name)}</span><select class="kart-select" data-kart-select="1" data-key="${esc(name)}" aria-label="Funkcja: ${esc(name)}"><option value="">Wybierz numer</option>${t.functions.map((fun,j)=>`<option value="fn${j}" ${a[name]===('fn'+j)?'selected':''}>${j+1}</option>`).join('')}</select></label>`).join('')}</div>`;
    return `<header class="page-heading"><p class="eyebrow">Kartkówka · bez podpowiedzi</p><h1>${t.type==='choice'?'Wybierz odpowiedź':t.type==='diagram'?'Podpisz rysunek':t.type==='compare'?'Wspólne czy różne?':'Dopasuj funkcje'}</h1><p class="muted">Bez informacji o poprawności przed oddaniem kartkówki.</p></header>${meter(state.kartIndex+1,state.kartTasks.length,'Zadanie')}<section class="question-card"><div data-readable><h2>${esc(t.q)}</h2></div>${inner}<div class="kart-note">Za to zadanie: <strong>${kartPoints[t.type]} ${kartPoints[t.type]===1?'punkt':'punkty'}</strong>. Odpowiedzi sprawdzimy dopiero na końcu.</div><div class="question-bottom">${btn('kart-next',state.kartIndex===state.kartTasks.length-1?'Oddaj kartkówkę':'Następne zadanie','btn-primary',!kartComplete())}</div></section>`;
  }
  function kartCheck(){
    const details=[];
    state.kartTasks.forEach((t,i)=>{
      const a=state.kartAnswers[i];
      if(t.type==='choice')details.push({ok:a.pick===t.correct,title:t.q,own:a.pick,correct:t.correct,why:t.why});
      else if(t.type==='diagram')t.targets.forEach((target,j)=>details.push({ok:a[j]===target.key,title:`${t.q} Element ${j+1}`,own:a[j],correct:target.key,why:t.why}));
      else if(t.type==='compare')t.rows.forEach(r=>details.push({ok:a[r.name]===r.value,title:`${t.q} ${r.name}`,own:a[r.name],correct:r.value,why:t.why}));
      else if(t.type==='match')t.items.forEach(name=>{
        const chosen=t.functions[Number(a[name].slice(2))];
        details.push({ok:chosen===t.keys[name],title:`${name} — funkcja`,own:chosen,correct:t.keys[name],why:t.why});
      });
    });
    return details;
  }
  function kartDone(){
    const rows=kartCheck(),score=rows.filter(r=>r.ok).length,errors=rows.filter(r=>!r.ok);
    return `<header class="page-heading"><p class="eyebrow">Kartkówka oddana · Wyniki</p><h1>Twój wynik</h1></header><section class="result-card"><div class="big-score">${score} / ${kartTotal}</div><p>${score===kartTotal?'Wszystkie odpowiedzi poprawne!':'Poniżej zobaczysz, które odpowiedzi były błędne.'}</p><p class="tip"><strong>Kartkówka oddana.</strong> Nie można poprawić pojedynczych odpowiedzi. Aby poprawić wynik, trzeba rozwiązać wszystkie cztery zadania od początku.</p><div class="actions">${btn('kart-intro','Rozwiąż całą kartkówkę ponownie','btn-secondary')}${btn('home','Wszystkie tematy','btn-quiet')}</div></section><h2 style="font-size:22px;margin:24px 0 12px">${errors.length?'Błędne odpowiedzi ('+errors.length+')':'Wszystkie odpowiedzi są poprawne'}</h2>${errors.length?`<div class="review-list kart-review">${errors.map(row=>`<div class="review-item"><h3>${esc(row.title)}</h3><p class="bad-text">Twoja odpowiedź: ${esc(row.own)}</p><p class="good-text">Poprawna odpowiedź: ${esc(row.correct)}</p><p>${esc(row.why)}</p></div>`).join('')}</div>`:'<p class="good-text">✓ Kartkówka rozwiązana bez błędów.</p>'}`;
  }

  function render(){let html='';if(state.page==='home')html=home();if(state.page==='lesson')html=lesson();if(state.page==='check')html=questionView(state.checkQuestions[state.qi],state.qi+1,state.checkQuestions.length,'check');if(state.page==='checkdone')html=checkDone();if(state.page==='kartintro')html=kartIntro();if(state.page==='kart')html=kartScreen();if(state.page==='kartdone')html=kartDone();if(state.page==='examintro')html=examIntro();if(state.page==='exam')html=questionView(state.examQuestions[state.examIndex],state.examIndex+1,state.examQuestions.length,'exam');if(state.page==='exambreak')html=examBreak();if(state.page==='examdone')html=examDone();if(state.page==='review')html=questionView(state.reviewQuestions[state.reviewIndex],state.reviewIndex+1,state.reviewQuestions.length,'review');if(state.page==='reviewdone')html=reviewDone();app.innerHTML=html;}
  function startLesson(i){state.mi=i;state.ci=0;state.page='lesson';render();jump()}
  function shuffled(arr){
    const copy=[...arr];
    for(let i=copy.length-1;i>0;i--){
      const j=Math.floor(Math.random()*(i+1));
      [copy[i],copy[j]]=[copy[j],copy[i]];
    }
    return copy;
  }
  // Losowanie bez bezpośredniego powtórzenia dokładnie tego samego układu.
  function changedShuffle(items,lastArrangement,identity){
    const result=shuffled(items);
    if(result.length>1&&Array.isArray(lastArrangement)&&
        result.every((item,index)=>identity(item)===lastArrangement[index])){
      const i=Math.floor(Math.random()*result.length);
      const j=(i+1+Math.floor(Math.random()*(result.length-1)))%result.length;
      [result[i],result[j]]=[result[j],result[i]];
    }
    return result;
  }
  function prepareQuestions(questions,quizId){
    // Pytania i odpowiedzi tasujemy tylko przy STARTOWANIU, nie przy renderowaniu ekranu.
    const order=changedShuffle(questions,shuffleHistory.orders[quizId],q=>q.uid);
    shuffleHistory.orders[quizId]=order.map(q=>q.uid);
    const prepared=order.map(q=>{
      // Te pola przechowują pierwotne odpowiedzi także podczas kolejnych powtórek.
      const baseChoices=q.baseChoices||q.o;
      const baseAnswer=q.baseAnswer===undefined?q.a:q.baseAnswer;
      const choices=changedShuffle(baseChoices.map((text,index)=>({text,index})),shuffleHistory.options[q.uid],v=>v.index);
      shuffleHistory.options[q.uid]=choices.map(x=>x.index);
      return {...q,baseChoices,baseAnswer,o:choices.map(x=>x.text),a:choices.findIndex(x=>x.index===baseAnswer)};
    });
    try{localStorage.setItem(shuffleKey,JSON.stringify(shuffleHistory))}catch(e){}
    return prepared;
  }
  function startCheck(){
    // 3 zadania po każdym temacie. Pula może być większa: dobieramy losowo różne przykłady.
    const chosen=shuffled(mod().check.map((q,i)=>({...q,uid:`check-${mod().id}-${i}`}))).slice(0,3);
    state.checkQuestions=prepareQuestions(chosen,`check-${mod().id}`);
    state.qi=0;state.checkAnswers=[];state.page='check';render();jump();
  }
  function startExam(){
    if(!shuffleHistory.targetVariants)shuffleHistory.targetVariants={};
    // Z każdego zakresu wybieramy jedną wersję pytania. Następny test wykorzysta inną wersję.
    const selected=examTargets.map(target=>{
      const variants=target.questions.map((q,i)=>({...q,uid:`exam-${target.id}-${i}`,moduleId:target.moduleId,goalId:target.id,variant:i}));
      const previous=shuffleHistory.targetVariants[target.id];
      const chosen=shuffled(variants).find(x=>x.variant!==previous)||variants[0];
      shuffleHistory.targetVariants[target.id]=chosen.variant;
      return chosen;
    });
    state.examQuestions=prepareQuestions(selected,'exam');
    state.examAnswers=[];state.examIndex=0;state.page='exam';render();jump();
  }
  function startReview(list){
    state.reviewQuestions=prepareQuestions(list,'review');
    state.reviewAnswers=[];state.reviewIndex=0;state.page='review';render();jump();
  }
  function navigate(page){stopSpeech();state.page=page;render();jump()}
  document.addEventListener('click',event=>{const el=event.target.closest('[data-action]');if(!el||el.disabled)return;const action=el.dataset.action;
    if(action==='speak'){speakCurrent();return}
    if(action==='home'){navigate('home');return}
    if(action==='continue'){const idx=modules.findIndex(x=>!progress.done.includes(x.id));startLesson(idx===-1?0:idx);return}
    if(action==='start-lesson'){startLesson(Number(el.dataset.mi));return}
    if(action==='prev-card'){state.ci=Math.max(0,state.ci-1);navigate('lesson');return}
    if(action==='next-card'){if(state.ci<mod().cards.length-1){state.ci++;navigate('lesson')}else startCheck();return}
    if(action==='answer'){
      const n=Number(el.dataset.answer);
      if(state.page==='check'){if(state.checkAnswers[state.qi]!==undefined)return;state.checkAnswers[state.qi]=n}
      else if(state.page==='exam'){state.examAnswers[state.examIndex]=n}
      else if(state.page==='review'){if(state.reviewAnswers[state.reviewIndex]!==undefined)return;state.reviewAnswers[state.reviewIndex]=n}
      else return;
      render();return;
    }
    if(action==='next-question'){
      if(state.page==='check'){
        if(state.checkAnswers[state.qi]===undefined)return;
        if(++state.qi>=state.checkQuestions.length){if(!progress.done.includes(mod().id)){progress.done.push(mod().id);save()}navigate('checkdone')}else navigate('check');return;
      }
      if(state.page==='review'){
        if(state.reviewAnswers[state.reviewIndex]===undefined)return;
        if(++state.reviewIndex>=state.reviewQuestions.length)navigate('reviewdone');else navigate('review');return;
      }
      if(state.page==='exam'){
        if(state.examAnswers[state.examIndex]===undefined)return;
        state.examIndex++;
        if(state.examIndex===state.examQuestions.length){const score=state.examQuestions.reduce((n,q,i)=>n+(state.examAnswers[i]===q.a),0);progress.lastExam={score,total:state.examQuestions.length};save();navigate('examdone')}
        else if(state.examIndex%EXAM_ROUND_SIZE===0)navigate('exambreak');else navigate('exam');return;
      }
    }
    if(action==='kart-pick'&&state.page==='kart'){state.kartAnswers[state.kartIndex].pick=el.dataset.value;render();return}
    if(action==='kart-compare'&&state.page==='kart'){state.kartAnswers[state.kartIndex][el.dataset.key]=el.dataset.value;render();return}
    if(action==='kart-next'&&state.page==='kart'){
      if(!kartComplete())return;
      state.kartIndex++;
      if(state.kartIndex===state.kartTasks.length){const items=kartCheck();progress.lastKart={score:items.filter(r=>r.ok).length,total:items.length};save();navigate('kartdone')}
      else navigate('kart');
      return;
    }
    if(action==='retry-lesson'){startLesson(state.mi);return}
    if(action==='retry-errors'){startReview(state.checkQuestions.filter((q,i)=>state.checkAnswers[i]!==q.a));return}
    if(action==='next-module'){startLesson(Math.min(modules.length-1,state.mi+1));return}
    if(action==='kart-intro'){navigate('kartintro');return}
    if(action==='start-kart'){kartNew();return}
    if(action==='exam-intro'){navigate('examintro');return}
    if(action==='start-exam'){startExam();return}
    if(action==='continue-exam'){navigate('exam');return}
    if(action==='retry-review'){startReview(state.reviewQuestions.filter((q,i)=>state.reviewAnswers[i]!==q.a));return}
  });
  document.addEventListener('change',event=>{
    const el=event.target.closest('[data-kart-select]');
    if(!el||state.page!=='kart')return;
    state.kartAnswers[state.kartIndex][el.dataset.key]=el.value||undefined;
    const next=document.querySelector('[data-action="kart-next"]');
    if(next)next.disabled=!kartComplete();
  });
  render();
  </script>
</body>
