font-weight:850;color:var(--blue);margin:10px 0 15px}.review-list{padding:0;list-style:none;display:grid;gap:12px}.review-item{background:#f7f9fb;border:1px solid var(--line);border-radius:12px;padding:14px}.review-item h3{font-size:16px;margin:0 0 6px}.review-item p{font-size:15px;margin:5px 0}.review-item .good-text{color:var(--green);font-weight:800}.review-item .bad-text{color:var(--red);font-weight:700}.mini-table{margin-top:20px;display:grid;gap:8px}.comparison{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:8px;margin-top:12px}.comparison .mini-cell{border:1px solid var(--line);border-radius:10px;background:#fafbfd;padding:10px 6px;text-align:center}.mini-cell strong{display:block;font-size:13px;margin:4px 0}.mini-cell span{font-size:13px;color:var(--muted)}.small-note{color:var(--muted);font-size:14px;margin:12px 0 0}.status-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:20px 0}.status-list div{background:#f6f9fc;border:1px solid var(--line);border-radius:12px;padding:12px}.status-list strong{display:block;font-size:18px}.status-list span{font-size:13px;color:var(--muted)}.tip{font-size:15px;color:var(--muted);margin-top:14px}.foot{margin-top:34px;border-top:1px solid var(--line);padding-top:16px;color:var(--muted);font-size:13px} .quiet-space{height:6px}.hidden{display:none!important} @media(max-width:640px){main{padding:14px 14px 46px}.head-inner{padding:10px 14px}.brand{font-size:16px}.brand .mark{width:34px;height:34px}.unit-grid{grid-template-columns:1fr}.intro{padding-top:24px}.learning-card,.question-card,.result-card,.break-card{padding:20px 18px}.learning-controls{flex-wrap:wrap}.learning-controls .btn-primary{flex:1}.answer{min-height:66px;padding:12px}.comparison{grid-template-columns:repeat(2,minmax(0,1fr))}.status-list{grid-template-columns:1fr 1fr}}@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}@media print {.site-header,.btn,.head-actions,.sound-btn{disp <body>
  <header class="site-header"><div class="head-inner"><div class="brand"><span class="mark">BIO</span> Świat komórek</div><div class="head-actions"><button type="button" class="nav-btn" data-action="home">Wszystkie tematy</button></div></div></header>
  <main id="app" aria-live="polite"></main>
  <script>
  'use strict';
  // Treści przygotowane wyłącznie na podstawie przesłanych stron 29–38 podręcznika.
  const modules = [
    {
      id:'podstawy', title:'Czym jest komórka?', sub:'Najważniejsza definicja i rodzaje organizmów.',
      cards:[
        {title:'Wszystko zaczyna się od komórki',text:'<strong>Komórka</strong> jest najmniejszą częścią organizmu, która może wykonywać czynności życiowe.',remember:'Komórka = podstawowa jednostka życia.',art:'cells'},
        {title:'Jedna albo wiele',text:'<strong>Jednokomórkowy</strong> organizm składa się z jednej komórki, np. bakteria. <strong>Wielokomórkowy</strong> składa się z wielu komórek, np. zwierzę.',remember:'Jednokomórkowy = 1 komórka. Wielokomórkowy = wiele komórek.'},
        {title:'Nie wszystkie są takie same',text:'Komórki różnią się <strong>wielkością, kształtem i budową</strong>. Kształt często pomaga im wykonywać zadanie.',remember:'Inne zadanie może oznaczać inny kształt.'}
      ],
      check:[
        {q:'Dlaczego komórkę nazywamy podstawową jednostką życia?',o:['Bo jest zawsze okrągła.','Bo wykonuje czynności życiowe.','Bo jest widoczna gołym okiem.'],a:1,why:'Komórka jest najmniejszą częścią organizmu zdolną do wykonywania czynności życiowych.'},
        {q:'Z ilu komórek składa się organizm jednokomórkowy?',o:['Z jednej.','Z wielu.','Z dwóch.'],a:0,why:'Organizm jednokomórkowy ma tylko jedną komórkę.'},
        {q:'Czym mogą się różnić komórki?',o:['Tylko kolorem.','Tylko miejscem występowania.','Wielkością, kształtem i budową.'],a:2,why:'Podręcznik wskazuje wielkość, kształt i budowę komórek.'}
      ]
    },
    {
      id:'ksztalty',title:'Kształty komórek',sub:'Plemnik, komórka nerwowa, jajowa i komórki roślin.',
      cards:[
        {title:'Ruch i zapasy',text:'<strong>Plemnik</strong> ma długą wić, dzięki której się porusza. <strong>Komórka jajowa</strong> ma kształt kuli i zawiera substancje zapasowe.',remember:'Plemnik: wić. Komórka jajowa: kula.',art:'shapes'},
        {title:'Informacje i ochrona',text:'<strong>Komórka nerwowa</strong> ma długie wypustki do przekazywania informacji. <strong>Komórka nabłonka</strong> przypomina kostkę i tworzy warstwę ochronną.',remember:'Nerwowa: wypustki. Nabłonkowa: kostka i ochrona.'},
        {title:'Kształty komórek roślin',text:'Komórki szparkowe przypominają <strong>nasiona fasoli</strong>. <strong>Włośniki</strong> są długie i pobierają wodę z solami mineralnymi. Komórki przewodzące wodę tworzą <strong>rury</strong>.',remember:'Kształt pomaga komórce w jej pracy.',art:'plantshape'}
      ],
      check:[
        {q:'Co umożliwia plemnikowi ruch?',o:['Ściana komórkowa.','Długa wić.','Chloroplast.'],a:1,why:'Dzięki długiej wici plemnik może się przemieszczać.'},
        {q:'Dlaczego komórka nerwowa ma długie wypustki?',o:['Żeby przekazywać informacje.','Żeby magazynować wodę.','Żeby chronić korzeń.'],a:0,why:'Wypustki łączą komórki nerwowe z innymi komórkami.'},
        {q:'Które komórki rośliny pobierają wodę i sole mineralne z podłoża?',o:['Komórki szparkowe.','Komórki jajowe.','Włośniki.'],a:2,why:'Włośniki to długie komórki w korzeniu pobierające wodę i sole mineralne.'}
      ]
    },
    {
      id:'zwierzeca',title:'Komórka zwierzęca',sub:'Błona, cytoplazma, cytozol i jądro.',
      cards:[
        {title:'Co otacza komórkę?',text:'<strong>Błona komórkowa</strong> otacza komórkę, oddziela ją od otoczenia i transportuje substancje do środka i na zewnątrz.',remember:'Błona = granica i transport.',art:'animal'},
        {title:'Co wypełnia komórkę?',text:'Wnętrze wypełnia <strong>cytoplazma</strong>. Jej galaretowatą częścią jest <strong>cytozol</strong>, w którym znajdują się inne elementy komórki.',remember:'Cytozol = galaretowata część cytoplazmy.'},
        {title:'Kto kieruje pracą?',text:'<strong>Jądro komórkowe</strong> kieruje procesami w komórce. Zawiera <strong>DNA</strong>. Zwykle znajduje się blisko środka komórki.',remember:'Jądro = kieruje pracą i zawiera DNA.',art:'animal'}
      ],
      check:[
        {q:'Co oddziela wnętrze komórki zwierzęcej od otoczenia?',o:['Błona komórkowa.','Rybosom.','Wakuola.'],a:0,why:'To błona komórkowa tworzy granicę i uczestniczy w transporcie substancji.'},
        {q:'Jak nazywa się galaretowata część cytoplazmy?',o:['Chloroplast.','Jądro.','Cytozol.'],a:2,why:'Cytozol to galaretowata substancja wypełniająca komórkę.'},
        {q:'Gdzie w komórce zwierzęcej znajduje się DNA?',o:['W ścianie komórkowej.','W jądrze komórkowym.','W wici.'],a:1,why:'Jądro komórkowe zawiera DNA i kieruje procesami w komórce.'}
      ]
    },
    {
      id:'funkcje',title:'Do czego służą elementy?',sub:'Mitochondria, rybosomy, wakuole i inne.',
      cards:[
        {title:'Energia i białka',text:'<strong>Mitochondria</strong> dostarczają energii komórce. <strong>Rybosomy</strong> odpowiadają za wytwarzanie białek.',remember:'Mitochondrium = energia. Rybosom = białka.',art:'animal'},
        {title:'Małe pęcherzyki',text:'<strong>Wakuole (wodniczki)</strong> w komórce zwierzęcej mają postać małych pęcherzyków. Mogą uczestniczyć w pobieraniu, trawieniu i usuwaniu substancji.',remember:'Wakuola = pęcherzyk uczestniczący w różnych czynnościach.'},
        {title:'Transport wewnątrz komórki',text:'<strong>Aparat Golgiego</strong> przekształca i transportuje białka. <strong>Siateczka śródplazmatyczna</strong> bierze udział w wytwarzaniu i transporcie białek i tłuszczów.',remember:'Aparat Golgiego i siateczka pomagają w wytwarzaniu lub transporcie substancji.'}
      ],
      check:[
        {q:'Który element dostarcza komórce energii?',o:['Rybosom.','Mitochondrium.','Wakuola.'],a:1,why:'Mitochondrium to centrum energetyczne komórki.'},
        {q:'Co wytwarzają rybosomy?',o:['Białka.','Wodę.','Ścianę komórkową.'],a:0,why:'Rybosomy odpowiadają za wytwarzanie białek.'},
        {q:'Który element przekształca i transportuje białka?',o:['Jądro komórkowe.','Wić.','Aparat Golgiego.'],a:2,why:'Aparat Golgiego odpowiada za przekształcanie i transportowanie białek.'}
      ]
    },
    {
      id:'jadrowe',title:'Jądrowe i bezjądrowe',sub:'Jaka jest najważniejsza różnica?',
      cards:[
        {title:'Komórki jądrowe',text:'Komórki <strong>zwierząt, roślin i grzybów</strong> mają jądro komórkowe. Dlatego nazywamy je <strong>jądrowymi</strong>.',remember:'Zwierzęca + roślinna + grzybowa = jądrowe.',art:'animal'},
        {title:'Komórki bezjądrowe',text:'Komórki <strong>bakterii</strong> nie mają jądra komórkowego. Ich <strong>nić DNA</strong> znajduje się w cytozolu.',remember:'Bakteria: bez jądra, ale ma DNA.',art:'bacteria'},
        {title:'Co jest wspólne?',text:'Każdy z czterech omawianych rodzajów komórek ma <strong>błonę komórkową, cytozol i rybosomy</strong>.',remember:'Wszystkie: błona + cytozol + rybosomy.'}
      ],
      check:[
        {q:'Która z tych komórek jest bezjądrowa?',o:['Zwierzęca.','Roślinna.','Bakteryjna.'],a:2,why:'Komórka bakteryjna nie ma jądra komórkowego.'},
        {q:'Gdzie znajduje się nić DNA bakterii?',o:['W cytozolu.','W jądrze komórkowym.','W chloroplaście.'],a:0,why:'Bakteria nie ma jądra, a jej DNA znajduje się w cytozolu.'},
        {q:'Co mają wszystkie cztery rodzaje komórek?',o:['Chloroplasty.','Błonę komórkową.','Jądro komórkowe.'],a:1,why:'Błona występuje w komórce zwierzęcej, roślinnej, grzybowej i bakteryjnej.'}
      ]
    },
    {
      id:'roslinna',title:'Komórka roślinna',sub:'Ściana komórkowa, chloroplasty i duża wakuola.',
      cards:[
        {title:'Dodatkowa osłona',text:'Poza błoną komórka roślinna ma <strong>ścianę komórkową</strong>. Nadaje jej kształt i chroni ją. Głównym składnikiem ściany jest <strong>celuloza</strong>.',remember:'Ściana komórkowa = kształt i ochrona.',art:'plant'},
        {title:'Zielone chloroplasty',text:'<strong>Chloroplasty</strong> zawierają zielony barwnik <strong>chlorofil</strong>. Dzięki nim zachodzi <strong>fotosynteza</strong>, czyli wytwarzanie substancji pokarmowych.',remember:'Chloroplast = fotosynteza.',art:'plant'},
        {title:'Duża wakuola',text:'W typowej komórce roślinnej jest zwykle <strong>jedna duża wakuola</strong>. Zawiera głównie wodę i pomaga utrzymać jej odpowiednią ilość w komórce.',remember:'Komórka roślinna: zwykle jedna duża wakuola.'},
        {title:'Nie zapomnij o wspólnych częściach',text:'Komórka roślinna ma też <strong>błonę, cytozol, jądro, mitochondria i rybosomy</strong>, podobnie jak komórka zwierzęca.',remember:'Roślinna = wspólne części + ściana + chloroplasty.'}
      ],
      check:[
        {q:'Co nadaje komórce roślinnej kształt i chroni ją?',o:['Ściana komórkowa.','Wić.','Rybosom.'],a:0,why:'Sztywna ściana komórkowa nadaje kształt i chroni komórkę.'},
        {q:'Gdzie zachodzi fotosynteza?',o:['W mitochondriach.','W chloroplastach.','W rybosomach.'],a:1,why:'Chloroplasty odpowiadają za przeprowadzanie fotosyntezy.'},
        {q:'Jaka wakuola najczęściej występuje w komórce roślinnej?',o:['Brak wakuoli.','Wiele drobnych wakuol.','Jedna duża wakuola.'],a:2,why:'Podręcznik opisuje zwykle jedną dużą wakuolę położoną w centrum komórki roślinnej.'}
      ]
    },
    {
      id:'bakteryjna',title:'Komórka bakteryjna',sub:'Nić DNA, ściana, otoczka i rzęska.',
      cards:[
        {title:'Bakteria nie ma jądra',text:'Komórka bakteryjna ma <strong>nić DNA w cytozolu</strong>. Są w niej także <strong>rybosomy i błona komórkowa</strong>. Nie ma jądra ani mitochondriów.',remember:'Bakteria = nić DNA zamiast jądra.',art:'bacteria'},
        {title:'Ściana i otoczka',text:'Na zewnątrz błony bakteria ma <strong>ścianę komórkową</strong>. Niektóre bakterie mają również <strong>otoczkę śluzową</strong>, która chroni m.in. przed wysychaniem.',remember:'Otoczka śluzowa: dodatkowa ochrona.'},
        {title:'Jak bakteria się porusza?',text:'Niektóre bakterie mają <strong>rzęski</strong>, dzięki którym mogą się poruszać. Nie wszystkie bakterie mają rzęski.',remember:'Rzęska = ruch bakterii.',art:'bacteria'}
      ],
      check:[
        {q:'Czego nie ma komórka bakteryjna?',o:['Rybosomów.','Jądra komórkowego.','Błony komórkowej.'],a:1,why:'DNA bakterii nie znajduje się w jądrze, tylko w cytozolu.'},
        {q:'Co chroni niektóre bakterie przed wysychaniem?',o:['Otoczka śluzowa.','Chloroplast.','Jądro.'],a:0,why:'Otoczka śluzowa niektórych bakterii chroni je między innymi przed wysychaniem.'},
        {q:'Co umożliwia ruch części komórek bakteryjnych?',o:['Wakuola.','Ściana komórkowa.','Rzęska.'],a:2,why:'Niektóre bakterie poruszają się za pomocą rzęski.'}
      ]
    },
    {
      id:'grzybowa',title:'Komórka grzybowa',sub:'Co łączy grzyby z roślinami i zwierzętami?',
      cards:[

    if(kind==='shapes')return `<div class="diagram"><svg viewBox="0 0 520 205" role="img" aria-label="Kształty komórek: plemnik z wicią, komórka jajowa kula, komórka nerwowa z wypustkami"><g stroke="#447c9d" fill="none" stroke-width="5" stroke-linecap="round"><path d="M96 68q-16 27 1 49t-20 28t-9 32"/></g><ellipse cx="95" cy="53" rx="17" ry="25" fill="#8bbbd6" stroke="#447c9d" stroke-width="3" transform="rotate(-20 95 53)"/><circle cx="252" cy="88" r="45" fill="#f2c36a" stroke="#bf9353" stroke-width="4"/><g stroke="#7e6650" stroke-width="4" stroke-linecap="round"><path d="M412 88L376 44M412 88l3 -62M412 88l41 -40M412 88l50 10M412 88l-48 39M412 88l25 54M412 88l12 77M376 44l-16 -9M376 44l1 -19M453 48l15 -8M364 127l-14 -5M437 142l10 8"/></g><circle cx="412" cy="88" r="17" fill="#c8a17c" stroke="#83644c" stroke-width="4"/><g text-anchor="middle" fill="#526274" font-size="15"><text x="92" y="201">Plemnik</text><text x="252" y="153">Komórka jajowa</text><text x="414" y="201">Nerwowa</text></g></svg></div>`;
    if(kind==='plantshape')return `<div class="diagram"><svg viewBox="0 0 520 205" role="img" aria-label="Kształty komórek roślinnych: dwie fasolkowate komórki szparkowe, włośnik i długa komórka przewodząca wodę"><path d="M88 35q-55 38 -13 95q35 22 53 -30q-44 10 -40 -65Z" fill="#8ec08d" stroke="#397c5a" stroke-width="4"/><path d="M137 34q49 51 4 99q-35 9 -33 -34q37 -15 29 -65Z" fill="#8ec08d" stroke="#397c5a" stroke-width="4"/><g fill="#bd9876" stroke="#886b52" stroke-width="4"><path d="M214 35h54v79l18 14 56 27 -62 -12 -23 -16 -43 -1Z"/><path d="M375 28h59v124h-59Z"/></g><g stroke="#845f3e" stroke-width="5" fill="none"><path d="M378 45q40 6 53 28M378 70q40 6 53 28M378 95q40 6 53 28M378 120q40 6 53 28"/></g><g text-anchor="middle" fill="#526274" font-size="15"><text x="110" y="185">Szparkowe</text><text x="269" y="185">Włośnik</text><text x="405" y="185">Transport wody</text></g></svg></div>`;
    if(kind==='compare')return `<div class="comparison" role="group" aria-label="Porównanie komórek"><div class="mini-cell"><strong>Zwierzęca</strong><span>Jądro: tak<br>Ściana: nie<br>Chloroplasty: nie</span></div><div class="mini-cell"><strong>Roślinna</strong><span>Jądro: tak<br>Ściana: tak<br>Chloroplasty: tak*</span></div><div class="mini-cell"><strong>Grzybowa</strong><span>Jądro: tak<br>Ściana: tak<br>Chloroplasty: nie</span></div><div class="mini-cell"><strong>Bakteryjna</strong><span>Jądro: nie<br>Ściana: tak<br>Chloroplasty: nie</span></div></div><p class="small-note">* Dotyczy typowej komórki zielonej części rośliny, np. liścia.</p>`;
    return '';
  }
  function home(){
    const done=progress.done.length;
    const next=modules.findIndex(x=>!progress.done.includes(x.id));
    return `<section class="intro"><p class="eyebrow">Biologia · dział o komórkach</p><h1>Odkryj świat komórek</h1><p>9 krótkich tematów. W każdym: kilka małych lekcji i 3 pytania sprawdzające. Na koniec jeden wspólny test. <strong>Kolejność pytań i odpowiedzi zmienia się w każdej próbie.</strong></p></section>
      <div class="steps" aria-label="Etapy nauki"><span class="step">1. Nauka</span><span class="step">2. Test sprawdzający</span><span class="step">3. Test końcowy</span></div>
      <section class="summary"><div class="summary-top"><span>Ukończone tematy</span><span>${done} z ${modules.length}</span></div><div class="progress"><span style="width:${percent(done,modules.length)}%"></span></div><div class="actions">${btn('continue',done===modules.length?'Powtórz pierwszy temat':done>0?'Kontynuuj naukę':'Zacznij naukę')}</div></section>
      <h2 id="units-heading" style="font-size:22px;margin:25px 0 14px">Wybierz krótki temat</h2><div class="unit-grid" aria-labelledby="units-heading">${modules.map((m,i)=>`<article class="unit-card"><div class="unit-meta">Temat ${String(i+1).padStart(2,'0')} · ${m.cards.length} krótkie ekrany</div><h2>${esc(m.title)}</h2><p>${esc(m.sub)}</p>${progress.done.includes(m.id)?'<span class="small-done">✓ Ukończony test sprawdzający</span>':''}<button type="button" class="btn btn-secondary btn-small" data-action="start-lesson" data-mi="${i}">${progress.done.includes(m.id)?'Powtórz temat':'Ucz się'}</button></article>`).join('')}</div>
      <hr class="divider"><section class="test-promo"><h2>Test końcowy</h2><p>18 pytań podzielonych na 3 rundy po 6. Bez limitu czasu. Po każdej rundzie możesz zrobić przerwę. Wynik pokaże się na końcu.</p>${progress.lastExam?`<p class="small-note"><strong>Ostatni wynik:</strong> ${progress.lastExam.score} / ${progress.lastExam.total}</p>`:''}<div class="actions">${btn('exam-intro','Przejdź do testu końcowego')}</div></section><p class="foot">Materiał: przesłane zdjęcia podręcznika, strony 29–38. Postęp zapisuje się na tym urządzeniu w tej przeglądarce.</p>`;
  }
  function lesson(){const m=mod(),card=m.cards[state.ci];return `<header class="page-heading"><p class="eyebrow">Temat ${state.mi+1} / ${modules.length} · Nauka</p><h1>${esc(m.title)}</h1><p class="muted">Jeden mały krok na raz. Bez pośpiechu.</p></header>${meter(state.ci+1,m.cards.length,'Ekran')}<section class="learning-card" data-readable><h2>${esc(card.title)}</h2><p class="learn-text">${card.text}</p>${card.art?svgArt(card.art):''}<div class="remember"><strong>Zapamiętaj:</strong> ${esc(card.remember)}</div></section><div class="learning-controls"><button class="btn btn-quiet" type="button" data-action="prev-card" ${state.ci===0?'disabled':''}>Wstecz</button>${listen()}${btn('next-card',state.ci===m.cards.length-1?'Sprawdź, co pamiętasz':'Dalej')}</div>`}
  function questionView(q,n,total,mode){const check=mode==='check';const review=mode==='review';const idx=review?state.reviewIndex:check?state.qi:state.examIndex;const ans=review?state.reviewAnswers[idx]:check?state.checkAnswers[idx]:state.examAnswers[idx];const picked=ans!==undefined;const feedback=check||review;const label=check?'Test sprawdzający':review?'Powtórka błędów':'Test końcowy';const term=check?mod().title:(review?'Ćwiczymy to, co było trudne':'Runda '+(Math.floor(idx/6)+1)+' z 3');const classFor=(i)=>{if(!picked)return '';if(feedback){if(i===q.a)return ' correct';if(i===ans)return ' incorrect';return '';}return i===ans?' is-selected':''};const answeredRight=picked&&ans===q.a;
    return `<header class="page-heading"><p class="eyebrow">${esc(label)}</p><h1>${esc(term)}</h1>${!check&&!review?'<p class="muted">Wynik poznasz na końcu. Bez limitu czasu.</p>':'<p class="muted">Wybierz jedną odpowiedź.</p>'}</header>${meter(idx+1,total,'Pytanie')}<section class="question-card"><div data-readable><h2>${esc(q.q)}</h2>${q.art?svgArt(q.art):''}</div><div class="answer-list" role="group" aria-label="Wybierz odpowiedź">${q.o.map((v,i)=>`<button class="answer${classFor(i)}" data-action="answer" data-answer="${i}" type="button" ${feedback&&picked?'disabled':''} aria-pressed="${picked&&ans===i?'true':'false'}"><span class="answer-letter">${['A','B','C'][i]}</span><span>${esc(v)}</span></button>`).join('')}</div>${feedback&&picked?`<div class="feedback ${answeredRight?'good':'bad'}" role="status"><strong>${answeredRight?'✓ Dobrze!':'Spróbuj zapamiętać:'}</strong><p>${esc(q.why)}</p>${!answeredRight?`<p><strong>Poprawna odpowiedź:</strong> ${esc(q.o[q.a])}</p>`:''}</div>`:''}${!feedback&&picked?'<p class="tip">Odpowiedź zaznaczona. Możesz ją zmienić przed przejściem dalej.</p>':''}<div class="question-bottom">${btn('next-question',idx===total-1?(check||review?'Zobacz wynik':'Zakończ test'):'Następne pytanie', 'btn-primary',!picked)}</div></section>${check?'<p class="tip">W treningu od razu widzisz wyjaśnienie, także po pomyłce.</p>':''}`;
  }
  function checkDone(){const m=mod();const score=state.checkQuestions.reduce((n,q,i)=>n+(state.checkAnswers[i]===q.a),0);const errors=state.checkQuestions.map((q,i)=>state.checkAnswers[i]===q.a?null:{...q,moduleId:m.id}).filter(Boolean);const next=state.mi<modules.length-1;
    return `<header class="page-heading"><p class="eyebrow">Temat ${state.mi+1} · Zakończony</p><h1>${esc(m.title)}</h1></header><section class="result-card"><h2>Test sprawdzający ukończony</h2><div class="big-score">${score} / ${state.checkQuestions.length}</div><p>${score===state.checkQuestions.length?'Wszystkie odpowiedzi poprawne.':score===state.checkQuestions.length-1?'Dobrze! Została tylko jedna rzecz do powtórzenia.':'Możesz wrócić do pytań i spokojnie je powtórzyć.'}</p>${errors.length?`<div class="review-list">${errors.map(q=>`<div class="review-item"><h3>${esc(q.q)}</h3><p class="good-text">${esc(q.o[q.a])}</p><p>${esc(q.why)}</p></div>`).join('')}</div>`:'<p class="good-text">✓ Ten temat jest opanowany.</p>'}<div class="actions">${errors.length?btn('retry-errors','Powtórz błędy','btn-secondary'):''}${btn('retry-lesson','Jeszcze raz nauka','btn-quiet')}${next?btn('next-module','Następny temat'):btn('exam-intro','Test końcowy')}</div></section>`;
  }
  function examIntro(){return `<header class="page-heading"><p class="eyebrow">Etap 3 · Test końcowy</p><h1>Co już wiesz o komórkach?</h1></header><section class="result-card"><h2>18 pytań. 3 krótkie rundy.</h2><p>Każda runda ma 6 pytań. Po każdej można zrobić przerwę. Pytania i odpowiedzi losujemy na nowo przed każdym testem. Odpowiedzi i wynik zobaczysz na końcu.</p><div class="status-list"><div><strong>18</strong><span>pytań</span></div><div><strong>3 × 6</strong><span>krótkie rundy</span></div><div><strong>Bez zegara</strong><span>pracujesz we własnym tempie</span></div><div><strong>Powtórka</strong><span>pytań, które sprawiły trudność</span></div></div><div class="actions">${btn('start-exam','Rozpocznij test')}${btn('home','Wróć do tematów','btn-secondary')}</div></section>`}
  function examBreak(){const completed=state.examIndex;return `<header class="page-heading"><p class="eyebrow">Test końcowy · Przerwa</p><h1>Runda ${Math.floor(completed/6)} zakończona</h1></header><section class="break-card"><h2>Masz już ${completed} z 18 odpowiedzi.</h2><p>Możesz teraz zrobić przerwę. Nie ma pośpiechu.</p><div class="progress"><span style="width:${percent(completed,18)}%"></span></div><div class="actions">${btn('continue-exam','Rozpocznij kolejną rundę')}</div><p class="tip">Jeżeli pozostaniesz na tej stronie, test będzie czekał na dalsze odpowiedzi.</p></section>`}
  function examDone(){const q=state.examQuestions,ans=state.examAnswers;const score=q.reduce((n,item,i)=>n+(ans[i]===item.a),0);const errors=q.map((item,i)=>ans[i]===item.a?null:{...item,chosen:ans[i]}).filter(Boolean);const breakdown=modules.map(m=>{const vals=q.map((item,i)=>({item,i})).filter(x=>x.item.moduleId===m.id);return {m,score:vals.filter(v=>ans[v.i]===v.item.a).length,total:vals.length}});
    return `<header class="page-heading"><p class="eyebrow">Test końcowy · Wyniki</p><h1>Twój wynik</h1></header><section class="result-card"><div class="big-score">${score} / ${q.length}</div><p>${score===q.length?'Wszystkie odpowiedzi poprawne!':score>=14?'Dużo już umiesz. Warto powtórzyć kilka szczegółów.':'Dobra okazja, żeby jeszcze raz przejść krótkie tematy.'}</p><div class="mini-table">${breakdown.map(x=>`<div class="summary-top" style="border-bottom:1px solid var(--line);padding:8px 0"><span>${esc(x.m.title)}</span><span>${x.score}/${x.total}</span></div>`).join('')}</div><div class="actions">${errors.length?btn('review-exam-errors',`Powtórz błędy (${errors.length})`):''}${btn('exam-intro','Nowy test','btn-secondary')}${btn('home','Wszystkie tematy','btn-quiet')}</div></section>${errors.length?`<h2 style="font-size:22px;margin:24px 0 12px">Co warto powtórzyć?</h2><div class="review-list">${errors.map(item=>`<div class="review-item"><h3>${esc(item.q)}</h3><p class="bad-text">Twoja odpowiedź: ${esc(item.o[item.chosen])}</p><p class="good-text">Poprawna: ${esc(item.o[item.a])}</p><p>${esc(item.why)}</p></div>`).join('')}</div>`:''}`;
  }
  function reviewDone(){const qs=state.reviewQuestions;const score=qs.reduce((n,q,i)=>n+(state.reviewAnswers[i]===q.a),0);return `<header class="page-heading"><p class="eyebrow">Powtórka błędów</p><h1>Powtórka zakończona</h1></header><section class="result-card"><div class="big-score">${score} / ${qs.length}</div><p>${score===qs.length?'Teraz wszystko się zgadza.':'Do tych pytań możesz wrócić jeszcze raz.'}</p><div class="actions">${score<qs.length?btn('retry-review','Jeszcze raz błędne','btn-secondary'):''}${btn('home','Wszystkie tematy')}${btn('exam-intro','Test końcowy','btn-quiet')}</div></section>`}
  function render(){let html='';if(state.page==='home')html=home();if(state.page==='lesson')html=lesson();if(state.page==='check')html=questionView(state.checkQuestions[state.qi],state.qi+1,state.checkQuestions.length,'check');if(state.page==='checkdone')html=checkDone();if(state.page==='examintro')html=examIntro();if(state.page==='exam')html=questionView(state.examQuestions[state.examIndex],state.examIndex+1,state.examQuestions.length,'exam');if(state.page==='exambreak')html=examBreak();if(state.page==='examdone')html=examDone();if(state.page==='review')html=questionView(state.reviewQuestions[state.reviewIndex],state.reviewIndex+1,state.reviewQuestions.length,'review');if(state.page==='reviewdone')html=reviewDone();app.innerHTML=html;}
  function startLesson(i){state.mi=i;state.ci=0;state.page='lesson';render();jump()}
  function shuffled(arr){
    const copy=[...arr];
    for(let i=copy.length-1;i>0;i--){
      const j=Math.floor(Math.random()*(i+1));
      [copy[i],copy[j]]=[copy[j],copy[i]];
    }
    return copy;
  }
  // Losowanie bez bezpośredniego powtórzenia dokładnie tego samego układu.
  function changedShuffle(items,lastArrangement,identity){
    const result=shuffled(items);
    if(result.length>1&&Array.isArray(lastArrangement)&&
        result.every((item,index)=>identity(item)===lastArrangement[index])){
      const i=Math.floor(Math.random()*result.length);
      const j=(i+1+Math.floor(Math.random()*(result.length-1)))%result.length;
      [result[i],result[j]]=[result[j],result[i]];
    }
    return result;
  }
  function prepareQuestions(questions,quizId){
    // Pytania i odpowiedzi tasujemy tylko przy STARTOWANIU, nie przy renderowaniu ekranu.
    const order=changedShuffle(questions,shuffleHistory.orders[quizId],q=>q.uid);
    shuffleHistory.orders[quizId]=order.map(q=>q.uid);
    const prepared=order.map(q=>{
      // Te pola przechowują pierwotne odpowiedzi także podczas kolejnych powtórek.
      const baseChoices=q.baseChoices||q.o;
      const baseAnswer=q.baseAnswer===undefined?q.a:q.baseAnswer;
      const choices=changedShuffle(baseChoices.map((text,index)=>({text,index})),shuffleHistory.options[q.uid],v=>v.index);
      shuffleHistory.options[q.uid]=choices.map(x=>x.index);
      return {...q,baseChoices,baseAnswer,o:choices.map(x=>x.text),a:choices.findIndex(x=>x.index===baseAnswer)};
    });
    try{localStorage.setItem(shuffleKey,JSON.stringify(shuffleHistory))}catch(e){}
    return prepared;
  }
  function startCheck(){
    state.checkQuestions=prepareQuestions(mod().check.map((q,i)=>({...q,uid:`check-${mod().id}-${i}`})),`check-${mod().id}`);
    state.qi=0;state.checkAnswers=[];state.page='check';render();jump();
  }
  function startExam(){
    const selected=modules.flatMap(m=>shuffled(finalBank[m.id].map((q,i)=>({...q,uid:`exam-${m.id}-${i}`,moduleId:m.id}))).slice(0,2));
    state.examQuestions=prepareQuestions(selected,'exam');
    state.examAnswers=[];state.examIndex=0;state.page='exam';render();jump();
  }
  function startReview(list){
    state.reviewQuestions=prepareQuestions(list,'review');
    state.reviewAnswers=[];state.reviewIndex=0;state.page='review';render();jump();
  }
  function navigate(page){stopSpeech();state.page=page;render();jump()}
  document.addEventListener('click',event=>{const el=event.target.closest('[data-action]');if(!el||el.disabled)return;const action=el.dataset.action;
    if(action==='speak'){speakCurrent();return}
    if(action==='home'){navigate('home');return}
    if(action==='continue'){const idx=modules.findIndex(x=>!progress.done.includes(x.id));startLesson(idx===-1?0:idx);return}
    if(action==='start-lesson'){startLesson(Number(el.dataset.mi));return}
    if(action==='prev-card'){state.ci=Math.max(0,state.ci-1);navigate('lesson');return}
    if(action==='next-card'){if(state.ci<mod().cards.length-1){state.ci++;navigate('lesson')}else startCheck();return}
    if(action==='answer'){
      const n=Number(el.dataset.answer);
      if(state.page==='check'){if(state.checkAnswers[state.qi]!==undefined)return;state.checkAnswers[state.qi]=n}
      else if(state.page==='exam'){state.examAnswers[state.examIndex]=n}
      else if(state.page==='review'){if(state.reviewAnswers[state.reviewIndex]!==undefined)return;state.reviewAnswers[state.reviewIndex]=n}
      else return;
      render();return;
    }
    if(action==='next-question'){
      if(state.page==='check'){
        if(state.checkAnswers[state.qi]===undefined)return;
        if(++state.qi>=state.checkQuestions.length){if(!progress.done.includes(mod().id)){progress.done.push(mod().id);save()}navigate('checkdone')}else navigate('check');return;
      }
      if(state.page==='review'){
        if(state.reviewAnswers[state.reviewIndex]===undefined)return;
        if(++state.reviewIndex>=state.reviewQuestions.length)navigate('reviewdone');else navigate('review');return;
      }
      if(state.page==='exam'){
        if(state.examAnswers[state.examIndex]===undefined)return;
        state.examIndex++;
        if(state.examIndex===state.examQuestions.length){const score=state.examQuestions.reduce((n,q,i)=>n+(state.examAnswers[i]===q.a),0);progress.lastExam={score,total:state.examQuestions.length};save();navigate('examdone')}
        else if(state.examIndex%6===0)navigate('exambreak');else navigate('exam');return;
      }
    }
    if(action==='retry-lesson'){startLesson(state.mi);return}
    if(action==='retry-errors'){startReview(state.checkQuestions.filter((q,i)=>state.checkAnswers[i]!==q.a));return}
    if(action==='next-module'){startLesson(Math.min(modules.length-1,state.mi+1));return}
    if(action==='exam-intro'){navigate('examintro');return}
    if(action==='start-exam'){startExam();return}
    if(action==='continue-exam'){navigate('exam');return}
    if(action==='review-exam-errors'){startReview(state.examQuestions.filter((q,i)=>state.examAnswers[i]!==q.a));return}
    if(action==='retry-review'){startReview(state.reviewQuestions.filter((q,i)=>state.reviewAnswers[i]!==q.a));return}
  });
  render();
  </script>
</body>
</html>
