const tasks=[{"num":1,"title":"Dopisz właściwe pojęcia","intro":"Dopisz do definicji właściwe nazwy spośród podanych.","chips":["mapa poziomicowa","obszary wodne","depresja","mapa cyfrowa","skala"],"fields":[{"key":"1a","label":"A. Informuje, ile razy pomniejszono na mapie rozmiary obiektów i odległości w terenie.","kind":"text","answer":"skala"},{"key":"1b","label":"B. Mapa, której zaletą jest częste aktualizowanie jej treści.","kind":"text","answer":"mapa cyfrowa"},{"key":"1c","label":"C. Obszary zaznaczone na mapie kolorem niebieskim.","kind":"text","answer":"obszary wodne"},{"key":"1d","label":"D. Mapa przedstawiająca ukształtowanie powierzchni Ziemi za pomocą poziomic.","kind":"text","answer":"mapa poziomicowa"}]},{"num":2,"title":"Zamień skalę liczbową na mianowaną","intro":"Zaznacz odpowiedź, w której poprawnie zamieniono skalę liczbową <strong>1:250 000</strong> na skalę mianowaną.","fields":[{"key":"2a","label":"Wybierz odpowiedź.","kind":"select","options":[["A","1 cm – 250 000 m, 1 cm – 2500 km, 1 cm – 2,5 cm"],["B","1 cm – 250 000 cm, 1 cm – 2500 m, 1 cm – 2,5 km"],["C","1 cm – 250 000 cm, 1 cm – 250 m, 1 cm – 0,25 km"]],"answer":"B"}],"solution":"1 cm na mapie to 250 000 cm = 2500 m = 2,5 km w terenie."},{"num":3,"title":"Odczytaj obiekty z mapy","intro":"Odczytaj i zapisz nazwy lub rodzaje obiektów na mapie Słowińskiego Parku Narodowego.","image":"park","fields":[{"key":"3a","label":"1. Tereny, które leżą na południe od miejscowości Kluki.","kind":"text","answer":"bagna"},{"key":"3b","label":"2. Wzniesienie leżące tuż obok Smołdzina.","kind":"text","answer":"Rowokół","accept":["rowokol"]},{"key":"3c","label":"3. Dowolna miejscowość, w której znajduje się hotel.","kind":"text","manual":true,"example":"Np. Rowy, Gardna Wielka, Smołdzino lub Kluki."}]},{"num":4,"title":"Czytaj plan Zamościa","intro":"Wykonaj polecenia na podstawie planu miasta. Najpierw oceń trzy zdania, a potem ułóż kolejność ulic i placów.","image":"zamosc","sections":[{"heading":"A. Prawda czy fałsz?","fields":[{"key":"4a","label":"1. Na zachód od Rynku Wielkiego znajduje się synagoga.","kind":"select","options":[["P","Prawda"],["F","Fałsz"]],"answer":"F"},{"key":"4b","label":"2. Na terenie Parku Miejskiego znajdują się dwie fontanny.","kind":"select","options":[["P","Prawda"],["F","Fałsz"]],"answer":"F"},{"key":"4c","label":"3. Tuż obok nowej Bramy Lwowskiej znajduje się rondo Braci Pomarańskich.","kind":"select","options":[["P","Prawda"],["F","Fałsz"]],"answer":"P"}]},{"heading":"B. Uporządkuj trasę","text":"Ułóż drogę <strong>od dawnej Akademii Zamojskiej do Rynku Wodnego</strong>.","chips":["A. Ulica B. Moranda","B. Ulica Ratuszowa","C. Rynek Wielki","D. Ulica Pereca"],"fields":[{"key":"4d1","label":"1. miejsce na trasie","kind":"select","options":[["A","A"],["B","B"],["C","C"],["D","D"]],"answer":"D","manual":true,"example":"D → B → C → A"},{"key":"4d2","label":"2. miejsce na trasie","kind":"select","options":[["A","A"],["B","B"],["C","C"],["D","D"]],"answer":"B","manual":true,"example":"D → B → C → A"},{"key":"4d3","label":"3. miejsce na trasie","kind":"select","options":[["A","A"],["B","B"],["C","C"],["D","D"]],"answer":"C","manual":true,"example":"D → B → C → A"},{"key":"4d4","label":"4. miejsce na trasie","kind":"select","options":[["A","A"],["B","B"],["C","C"],["D","D"]],"answer":"A","manual":true,"example":"D → B → C → A"}]}]},{"num":5,"title":"Cztery elementy mapy","intro":"Na podstawie planu z poprzedniego zadania wymień cztery elementy mapy.","fields":[{"key":"5a","label":"1. element","kind":"text","answer":"tytuł","accept":["tytul mapy"]},{"key":"5b","label":"2. element","kind":"text","answer":"skala","accept":["skala mapy"]},{"key":"5c","label":"3. element","kind":"text","answer":"legenda","accept":["legenda mapy"]},{"key":"5d","label":"4. element","kind":"text","answer":"treść","accept":["tresc mapy","treść mapy"]}],"groupUnordered":true,"note":"Elementy można podać w dowolnej kolejności."},{"num":6,"title":"Wysokość bezwzględna i względna","intro":"Uzupełnij zdania na podstawie rysunku.","image":"alt","fields":[{"key":"6a","label":"Wysokość każdego punktu na Ziemi mierzona od poziomu morza to wysokość…","kind":"text","answer":"bezwzględna"},{"key":"6b","label":"Zapisuje się ją w…","kind":"text","answer":"metrach nad poziomem morza","accept":["m n.p.m.","mnpm","metrach n.p.m.","metry nad poziomem morza"]},{"key":"6c","label":"Na rysunku została oznaczona cyfrą…","kind":"select","options":[["1","1"],["2","2"]],"answer":"1"}]},{"num":7,"title":"Oblicz wysokość i rozpoznaj stok","intro":"Wykonaj polecenia na podstawie rysunku poziomicowego.","image":"contour","fields":[{"key":"7a","label":"A. Jaką wysokość musi pokonać turysta idący z punktu D na szczyt oznaczony krzyżykiem? Wpisz liczbę w metrach.","kind":"text","answer":"230","accept":["230 m","230m"]},{"key":"7b","label":"B. Z którego punktu turysta wejdzie na szczyt po bardziej stromym stoku?","kind":"select","options":[["A","A"],["C","C"]],"answer":"C"}],"solution":"D: 550 m n.p.m., szczyt: 780 m n.p.m. → 780 − 550 = 230 m. Bardziej stromy stok: C (poziomice leżą bliżej siebie)."},{"num":8,"title":"Barwy hipsometryczne","intro":"Uzupełnij zdanie, wybierając rodzaj obszaru i kolor na mapie hipsometrycznej.","text":"Obszary leżące na wysokości od <strong>0 do 300 m n.p.m.</strong> to…","fields":[{"key":"8a","label":"Rodzaj obszaru","kind":"select","options":[["niziny","Niziny"],["wyżyny","Wyżyny"]],"answer":"niziny"},{"key":"8b","label":"Kolor na mapie","kind":"select","options":[["zielony","Odcienie zieleni"],["żółty","Odcienie żółci"]],"answer":"zielony"}]},{"num":9,"title":"Rozpoznaj rodzaje map","intro":"Przyjrzyj się trzem fragmentom map. Wpisz właściwy numer przy każdym rodzaju mapy.","image":"three","fields":[{"key":"9a","label":"A. Mapa krajobrazowa","kind":"select","options":[["1","1"],["2","2"],["3","3"]],"answer":"3"},{"key":"9b","label":"B. Plan miasta","kind":"select","options":[["1","1"],["2","2"],["3","3"]],"answer":"2"},{"ke const group='D';
const key='geo-mapa-polski-test-'+group+'-v2';
const main=document.getElementById('main');
let state={started:false,finished:false,current:0,answers:{}};
try{const v=JSON.parse(localStorage.getItem(key));if(v&&typeof v==='object'&&v.answers)state={...state,...v}}catch(e){}
function save(){try{localStorage.setItem(key,JSON.stringify(state))}catch(e){}}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function norm(s){return String(s??'').toLocaleLowerCase('pl-PL').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/ł/g,'l').replace(/[^a-z0-9]/g,'').trim()}
function fieldsOf(t){return [...(t.fields||[]),...(t.sections||[]).flatMap(s=>s.fields||[])]}
function filled(f){return String(state.answers[f.key]??'').trim().length>0}
function countAnswered(){return tasks.filter(t=>fieldsOf(t).every(filled)).length}
function progress(){return `<div class="progress-wrap"><div class="progress-label"><span>Praca własna · bez punktacji</span><span>${countAnswered()} z 10 zadań uzupełnionych</span></div><div class="progress-track"><div class="progress-fill" style="width:${countAnswered()*10}%"></div></div></div>`}
function nav(){return `<nav class="stepnav" aria-label="Wybierz zadanie">${tasks.map((t,i)=>`<button type="button" data-jump="${i}" class="step ${state.current===i?'current':fieldsOf(t).every(filled)?'done':''}" aria-label="Zadanie ${i+1}" ${state.current===i?'aria-current="step"':''}>${i+1}</button>`).join('')}</nav>`}
function chips(list){return list?.length?`<div class="chips">${list.map(x=>`<span class="chip">${esc(x)}</span>`).join('')}</div>`:''}
function figure(name){const compact=name==='alt'||name==='contour';return `<figure class="figure"><img class="${compact?'compact':''}" alt="Ilustracja do zadania" src="${images[name]}"><figcaption><button class="zoom-btn" type="button" data-zoom="${name}">⌕ Powiększ ilustrację</button></figcaption></figure>`}
function field(f){const value=String(state.answers[f.key]??'');const id='field-'+f.key;
 const c=f.options;
 let control;
 if(c){
  if(c.length<=3){control=`<div class="options" role="radiogroup" aria-label="${esc(f.label)}">${c.map(([v,l])=>`<label class="opt"><input type="radio" name="${esc(f.key)}" data-field="${esc(f.key)}" value="${esc(v)}" ${v===value?'checked':''}><span>${esc(l)}</span></label>`).join('')}</div>`}
  else control=`<select class="selectbox" id="${id}" data-field="${esc(f.key)}"><option value="">Wybierz literę</option>${c.map(([v,l])=>`<option value="${esc(v)}" ${v===value?'selected':''}>${esc(l)}</option>`).join('')}</select>`;
 }else{const long=f.manual&&f.key==='10a';control=long?`<textarea class="textbox longtext" id="${id}" data-field="${esc(f.key)}" placeholder="Wpisz własnymi słowami…">${esc(value)}</textarea>`:`<input class="textbox" id="${id}" type="text" autocomplete="off" data-field="${esc(f.key)}" value="${esc(value)}" placeholder="Wpisz odpowiedź…">`}
 return `<div class="field"><label class="fieldlabel" ${(!c||c.length>3)?`for="${id}"`:''}>${esc(f.label)}</label>${control}${f.note?`<p class="note">${esc(f.note)}</p>`:''}</div>`;
}
function intro(){return `<div class="eyebrow">Dział 1 · Mapa Polski</div><h1>Test sprawdzający<br>Grupa ${group}</h1><p class="lead">10 zadań wybranych z grup A i B: pojęcia, skala, czytanie map, poziomice i orientowanie mapy.</p><div class="intro-box"><strong>Jak pracować?</strong><ul><li>Rozwiązuj po jednym zadaniu. Możesz wracać do wcześniejszych.</li><li>Kliknij „Powiększ ilustrację”, aby dokładniej obejrzeć mapę.</li><li>Odpowiedzi sprawdzisz dopiero po zakończeniu.</li><li>Nie ma limitu czasu ani licznika punktów.</li></ul><p class="small">Twoje wpisane odpowiedzi zapiszą się automatycznie na tym urządzeniu.</p></div><div class="controls"><button class="btn btn-primary" data-action="start">${countAnswered()>0?'Kontynuuj test':'Rozpocznij test'} →</button>${countAnswered()>0?'<button class="btn" data-action="restart">Zacznij od nowa</button>':''}</div>`}
function taskView(){const t=tasks[state.current];return `${progress()}${nav()}<div class="taskhead"><div class="tasknum">${t.num}</div><div><div class="eyebrow">Zadanie ${t.num} z 10</div><h2>${esc(t.title)}</h2></div></div><p class="taskintro">${t.intro}</p>${t.text?`<p class="tasktext">${t.text}</p>`:''}${chips(t.chips)}${t.image?figure(t.image):''}${t.note?`<p class="note">${esc(t.note)}</p>`:''}${(t.fields||[]).map(field).join('')}${(t.sections||[]).map(s=>`<section class="section"><h3>${esc(s.heading)}</h3>${s.text?`<p class="tasktext">${s.text}</p>`:''}${chips(s.chips)}${s.fields.map(field).join('')}</section>`).join('')}<div class="controls"><button class="btn" data-action="previous">← ${state.current===0?'Początek':'Poprzednie'}</button><button class="btn btn-primary" data-action="next">${state.current===9?'Zakończ i sprawdź':'Następne zadanie →'}</button></div>`}
function correct(f){if(!filled(f))return null;if(f.manual)return 'manual';const v=norm(state.answers[f.key]);return [f.answer,...(f.accept||[])].some(x=>norm(x)===v)?'good':'bad'}
function review(){let result=`<div class="summary-head"><div class="eyebrow">Grupa ${group} · koniec sprawdzianu</div><h1>Sprawdź swoje odpowiedzi</h1><p class="lead">Porównaj odpowiedzi z kluczem. W zadaniach otwartych sprawdź, czy znaczenie Twojej odpowiedzi zgadza się z przykładem. Nie ma tutaj punktacji ani ocen.</p><div class="intro-box"><strong>Warto sprawdzić jeszcze raz:</strong><p>Obliczenia wykonuj na kartce. Jeśli odpowiedź jest inna niż przykładowa, wróć do mapy i przeanalizuj ją ponownie.</p></div></div>`;
 for(const t of tasks){const fs=fieldsOf(t);let statuses=fs.map(correct);if(t.groupUnordered){const requested=fs.map(f=>norm(f.answer)).sort().join('|');const got=fs.map(f=>norm(state.answers[f.key])).sort().join('|');statuses=statuses.map(x=>x===null?null:requested===got?'good':'bad')}
 const allGood=statuses.every(x=>x==='good'), incomplete=statuses.some(x=>x===null), check=statuses.some(x=>x==='manual');
 const status=incomplete?'Niepełne':check?'Porównaj samodzielnie':allGood?'Zgodne z kluczem':'Do poprawy';
 const cls=incomplete?'check':check?'check':allGood?'good':'bad';
 result+=`<section class="review"><div class="review-top"><div class="review-title">${t.num}. ${esc(t.title)}</div><span class="status ${cls}">${status}</span></div>`;
 for(let i=0;i<fs.length;i++){const f=fs[i],v=state.answers[f.key];const model=f.example||f.answer||'';
 result+=`<div class="review-row"><b>${esc(f.label)}</b><div class="answer">Twoja odpowiedź: ${filled(f)?`<strong>${esc(v)}</strong>`:'<i>brak odpowiedzi</i>'}</div><div class="key">${f.manual?'Przykładowa odpowiedź':'Odpowiedź według klucza'}: <strong>${esc(model)}</strong></div></div>`;}
 if(t.solution)result+=`<div class="hint">${esc(t.solution)}</div>`;
 result+=`<button class="go-to" data-jump="${t.num-1}">Wróć do zadania ${t.num}</button></section>`;
 }
 return result+`<div class="controls"><button class="btn" data-action="revisit">Wróć do zadań</button><button class="btn btn-primary" data-action="restart">Zacznij test od nowa</button></div>`;
}
function render(){main.innerHTML=!state.started?intro():state.finished?review():taskView();save();}
function toTop(){window.scrollTo({top:0,behavior:'instant'});}
function move(i){state.current=Math.min(9,Math.max(0,i));state.started=true;state.finished=false;render();toTop()}
function finish(){const n=tasks.filter(t=>!fieldsOf(t).every(filled)).length;if(n&& !confirm(`Nie wszystkie zadania są wypełnione (${n} niepełnych). Czy na pewno zakończyć i zobaczyć odpowiedzi?`))return;state.finished=true;render();toTop()}
function restart(){if(!confirm('Usunąć wpisane odpowiedzi i rozpocząć test od początku?'))return;state={started:true,finished:false,current:0,answers:{}};render();toTop()}
main.addEventListener('click',e=>{const action=e.target.closest('[data-action]')?.dataset.action;const jump=e.target.closest('[data-jump]')?.dataset.jump;const zoom=e.target.closest('[data-zoom]')?.dataset.zoom;
 if(jump!==undefined){move(Number(jump));return}if(zoom){document.getElementById('zoomimg').src=images[zoom];document.getElementById('zoom').showModal();return}
 if(action==='start'){state.started=true;state.finished=false;render();toTop()}else if(action==='restart')restart();else if(action==='previous')state.current===0?(state.started=false,render(),toTop()):move(state.current-1);else if(action==='next')state.current===9?finish():move(state.current+1);else if(action==='revisit')move(0);
});
function changeValue(e){const el=e.target.closest('[data-field]');if(!el)return;state.answers[el.dataset.field]=el.value;save();const wrap=main.querySelector('.progress-wrap');if(wrap){wrap.outerHTML=progress();const n=main.querySelector('.stepnav');if(n)n.outerHTML=nav();}}
main.addEventListener('input',changeValue);main.addEventListener('change',changeValue);
document.getElementById('zoomclose').addEventListener('click',()=>document.getElementById('zoom').close());document.getElementById('zoom').addEventListener('click',e=>{if(e.target===e.currentTarget)e.currentTarget.close()});
render();
</script>
</body></html>
