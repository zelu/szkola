background:#f2f6f5;padding:17px;border-radius:13px;margin:15px 0}.topicPills{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.topicPill{font-size:13px;background:#f3f6f4;border-radius:100px;padding:5px 11px;color:#365861}.checks{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px;margin:16px 0}.check{padding:14px;border:1px solid var(--line);border-radius:13px;background:white}.check b{display:block}.check span{font-size:13px;color:var(--muted)}.resetLine{margin-top:30px;border-top:1px solid var(--line);padding-top:15px}.separator{height:1px;background:var(--line);margin:18px 0}.footer{font-size:12px;color:var(--muted);margin-top:24px}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}

<script>
'use strict';
const UNITS=[
  {id:'map',name:'Mapa i skala',short:'Mapa i skala',subtitle:'Elementy mapy, znaki, rodzaje skali i przeliczanie',range:'Strony 8–11'},
  {id:'distance',name:'Odległości na mapie i w terenie',short:'Odległości',subtitle:'Linijka, kilka odcinków, nitka i podziałka liniowa',range:'Strony 12–14'},
  {id:'terrain',name:'Ukształtowanie powierzchni',short:'Teren i poziomice',subtitle:'Wysokości, poziomice, formy terenu i barwy',range:'Strony 15–20'},
  {id:'reading',name:'Czytamy mapę najbliższej okolicy',short:'Czytanie map',subtitle:'Rodzaje map, plan miasta, mapa turystyczna i orientowanie',range:'Strony 21–27'}
];
const LESSONS={map:[],distance:[],terrain:[],reading:[]};
function L(unit,title,html,visual){LESSONS[unit].push({title,html,visual});}
// Karty nauki. Jedna krótka porcja wiedzy na ekran.
L('map','Co to jest mapa?',`<p><span class="key">Mapa</span> pokazuje Ziemię lub jej fragment <b>z góry</b>, na płaskiej powierzchni i <b>w pomniejszeniu</b>.</p><div class="example">Mapa okolicy pokazuje drogi, rzeki i budynki tak, jakbyśmy patrzyli na nie z lotu ptaka.</div>`,'simpleMap');
L('map','Cztery elementy mapy',`<p>Każda mapa powinna zawierać <b>4 elementy</b>:</p><ol><li><b>Tytuł</b> – co przedstawia mapa.</li><li><b>Treść</b> – obiekty pokazane na mapie.</li><li><b>Legendę</b> – wyjaśnienie znaków.</li><li><b>Skalę</b> – informację o pomniejszeniu.</li></ol>`,'simpleMap');
L('map','Czym jest treść mapy?',`<p>Treść mapy to wszystkie ważne obiekty i informacje umieszczone na mapie.</p><p>Pokazujemy je za pomocą <span class="key">znaków kartograficznych</span>, np. symbolu szpitala, linii drogi albo zielonej plamy lasu.</p>`,'symbols');
L('map','Znaki punktowe',`<p><span class="key">Znak punktowy</span> oznacza pojedynczy obiekt.</p><div class="example">Przykłady: muzeum, przystanek, poczta, samotne drzewo, parking.</div><p>To niewielki znaczek umieszczony w konkretnym miejscu.</p>`,'symbols');
L('map','Znaki liniowe',`<p><span class="key">Znak liniowy</span> pokazuje obiekt, który ma wyraźny przebieg.</p><div class="example">Przykłady: droga, rzeka, linia kolejowa, szlak turystyczny.</div><p>Zazwyczaj rysuje się je liniami w różnych kolorach lub stylach.</p>`,'symbols');
L('map','Znaki powierzchniowe',`<p><span class="key">Znak powierzchniowy</span> pokazuje duży obszar.</p><div class="example">Przykłady: las, jezioro, zabudowa miejska, cmentarz, łąka.</div><p>Najczęściej widzimy kolorową plamę.</p>`,'symbols');
L('map','Tytuł i legenda',`<p><b>Tytuł</b> mówi, jaki obszar lub zjawisko przedstawia mapa.</p><p><b>Legenda</b> wyjaśnia wszystkie użyte znaki kartograficzne.</p><div class="example">Gdy widzisz znak <b>P</b>, zajrzyj do legendy: może oznaczać parking.</div>`,'simpleMap');
L('map','Po co jest skala?',`<p><span class="key">Skala</span> informuje, ile razy zmniejszono na mapie odległości i wymiary w terenie.</p><p>Bez skali nie wiadomo, jak daleko od siebie leżą dwa miejsca.</p><div class="example">Skala <b>1:10 000</b> oznacza: 1 cm na mapie to 10 000 cm w rzeczywistości.</div>`,'scaleBar');
L('map','Skala liczbowa',`<p><b>Skala liczbowa</b> ma postać <span class="key">1:1000</span>, <span class="key">1:30 000</span> itd.</p><p>W skali <b>1:1000</b> jeden centymetr na mapie odpowiada 1000 centymetrów w terenie.</p><div class="example">1000 cm = <b>10 m</b>.</div>`,'scaleBar');
L('map','Skala mianowana',`<p><b>Skala mianowana</b> zapisuje odległość słowami i jednostkami.</p><div class="example"><b>1 cm – 100 m</b> oznacza: jeden centymetr na mapie to sto metrów w terenie.</div><p>To ten sam zapis co skala liczbowa <b>1:10 000</b>.</p>`,'scaleBar');
L('map','Podziałka liniowa',`<p><b>Podziałka liniowa</b> to narysowana linia z podziałem na odcinki i opisanymi odległościami.</p><p>Można na niej odczytać odległość w terenie bez mnożenia.</p><p>Ma też często krótki <b>odcinek wsteczny</b> na lewo od zera, podzielony na drobniejsze części.</p>`,'scaleBar');
L('map','Zamiana centymetrów',`<p>Przeliczając skalę, pamiętaj tylko o dwóch krokach:</p><ol><li><b>100 cm = 1 m</b> → podziel centymetry przez 100.</li><li><b>1000 m = 1 km</b> → podziel metry przez 1000.</li></ol><div class="example">100 000 cm = 1000 m = <b>1 km</b>.</div>`,'scaleBar');
L('map','Przeliczanie skali krok po kroku',`<p>Przykład: skala <b>1:250 000</b>.</p><ol><li>1 cm na mapie = 250 000 cm w terenie.</li><li>250 000 : 100 = <b>2500 m</b>.</li><li>2500 : 1000 = <b>2,5 km</b>.</li></ol><div class="example">Zapis mianowany: <b>1 cm – 2,5 km</b>.</div>`,'scaleBar');
L('map','Duży obszar, mniejsza skala',`<p>Na mapie miasta widać dużo szczegółów. Na mapie całej Polski widać mniej szczegółów.</p><p><b>Im większy mianownik skali, tym większy obszar może objąć mapa, ale tym mniej szczegółów widać.</b></p><div class="example">1:10 000 to skala <b>większa</b> niż 1:1 000 000.</div>`,'scaleCompare');
L('map','Jak zrobić podziałkę liniową?',`<ol><li>Przelicz skalę na mianowaną.</li><li>Narysuj linię z jednakowymi odcinkami, np. po <b>1 cm</b>.</li><li>Podpisz 0, 1, 2, 3… zgodnie z odległością w terenie.</li><li>Po lewej od zera możesz dodać <b>odcinek wsteczny</b>, podzielony na 10 mniejszych części.</li></ol><div class="example">Dla 1:100 000 podpisy: 0, 1, 2, 3, 4, 5 km.</div>`,'scaleBar');

L('distance','Co właściwie mierzymy?',`<p>Na mapie możesz mierzyć:</p><ul><li>odległość <b>w linii prostej</b>,</li><li>długość trasy składającej się z <b>prostych odcinków</b>,</li><li>długość <b>krętej</b> trasy.</li></ul><p>W zależności od kształtu trasy wybierasz linijkę albo nitkę.</p>`,'route');
L('distance','Odległość w linii prostej: krok 1',`<p><b>1.</b> Zmierz linijką odległość między punktami na mapie.</p><div class="example">Odcinek AB ma <b>3 cm</b>.</div><p>Zapisz wynik w centymetrach.</p>`,'route');
L('distance','Odległość w linii prostej: krok 2',`<p><b>2.</b> Odczytaj skalę, np. <b>1:30 000</b>.</p><p><b>3.</b> Zamień ją: 1 cm = 30 000 cm = <b>300 m</b>.</p><p><b>4.</b> Pomnóż: 3 · 300 m = <b>900 m</b> = 0,9 km.</p>`,'scaleBar');
L('distance','Trasa z kilku odcinków',`<p>Jeśli trasa składa się z prostych części:</p><ol><li>Zmierz każdą część.</li><li>Dodaj wszystkie odcinki.</li><li>Przelicz sumę na odległość w terenie za pomocą skali.</li></ol><div class="example">6 cm + 3 cm = 9 cm. Przy 1:30 000 otrzymasz <b>9 · 300 m = 2700 m = 2,7 km</b>.</div>`,'route');
L('distance','Trasa kręta: przyda się nitka',`<p><b>Nitką</b> łatwiej zmierzyć drogę z licznymi zakrętami, np. szlak turystyczny.</p><ol><li>Ułóż nitkę dokładnie wzdłuż trasy.</li><li>Zaznacz na niej koniec.</li><li>Wyprostuj nitkę i porównaj z podziałką liniową.</li></ol>`,'curvedRoute');
L('distance','Odcinek wsteczny podziałki',`<p>To krótka część podziałki <b>na lewo od zera</b>.</p><p>Jeżeli główny odcinek oznacza 250 m, a odcinek wsteczny podzielono na 10 części, każda ma <b>25 m</b>.</p><div class="example">750 m + 125 m = <b>875 m</b>.</div>`,'scaleBar');
L('distance','Podziałka: odczytywanie bez mnożenia',`<p>Przyłóż początek zmierzonego odcinka do <b>zera</b> podziałki, a jego koniec odczytaj na liczbach.</p><p>Jeśli odległość mieści się między kreskami, można wykorzystać drobny odcinek wsteczny.</p><p>Na mapie nie zawsze da się odczytać długość z dokładnością do jednego metra.</p>`,'scaleBar');
L('distance','Co zapamiętać o jednostkach?',`<p>Wszystkie obliczenia wykonuj w <b>jednej jednostce</b>.</p><ul><li>100 cm = <b>1 m</b></li><li>1000 m = <b>1 km</b></li><li>1 km = <b>100 000 cm</b></li></ul><div class="example">1500 m = <b>1,5 km</b>.</div>`,'scaleBar');

L('terrain','Wysokość bezwzględna',`<p><span class="key">Wysokość bezwzględna</span> to wysokość punktu mierzona od <b>poziomu morza</b>.</p><p>Zapisujemy ją w <b>m n.p.m.</b> (metry nad poziomem morza).</p><div class="example">Szczyt: <b>720 m n.p.m.</b> – znajduje się 720 metrów ponad poziomem morza.</div>`,'height');
L('terrain','Wysokość względna',`<p><span class="key">Wysokość względna</span> to różnica wysokości między <b>dwoma miejscami</b>, np. szczytem a dnem doliny.</p><div class="example">Szczyt: 720 m n.p.m.<br>Dolina: 200 m n.p.m.<br><b>720 − 200 = 520 m</b> wysokości względnej.</div><p>Wysokość względną podajemy w metrach, bez „n.p.m.”.</p>`,'height');
L('terrain','Wysokość zależy od punktu startu',`<p>Ten sam szczyt ma <b>jedną wysokość bezwzględną</b>, ale różne wysokości względne, jeśli ruszasz z różnych miejsc.</p><div class="example">Szczyt 2000 m n.p.m.: od podnóża 1200 m n.p.m. to <b>800 m</b>; od podnóża 400 m n.p.m. to <b>1600 m</b>.</div>`,'height');
L('terrain','Czym są poziomice?',`<p><span class="key">Poziomica</span> (inaczej <b>izohipsa</b>) jest linią łączącą punkty o <b>tej samej wysokości bezwzględnej</b>.</p><p>Gdy naniesiemy poziomice na mapę, otrzymamy <b>mapę poziomicową</b>.</p>`,'hill');
L('terrain','Góra na mapie poziomicowej',`<p>Górę lub pagórek poznasz po <b>zamkniętych poziomicach</b>, których wartości <b>rosną do środka</b>.</p><div class="example">400 m → 450 m → 500 m → 550 m → szczyt.</div>`,'hill');
L('terrain','Kotlina na mapie poziomicowej',`<p><b>Kotlina</b> to teren wklęsły, otoczony wyżej położonym obszarem.</p><p>Na mapie poziomice otaczają jej środek prawie ze wszystkich stron, a wartości <b>maleją ku środkowi</b>.</p>`,'basin');
L('terrain','Dolina na mapie poziomicowej',`<p><b>Dolina</b> jest wydłużonym obniżeniem. Często płynie nią rzeka.</p><p>Na mapie poziomice układają się w pobliżu rzeki, a wysokości <b>maleją w kierunku dna doliny</b>.</p>`,'valley');
L('terrain','Dwa szczyty i przełęcz',`<p>Dwie pobliskie góry mają <b>dwa wierzchołki</b>, wokół których zamykają się coraz wyższe poziomice.</p><p>Niższe miejsce <b>pomiędzy szczytami</b> to <span class="key">przełęcz</span>.</p>`,'saddle');
L('terrain','Stromy czy łagodny stok?',`<p>Obserwuj <b>odstępy między poziomicami</b>:</p><ul><li><b>blisko siebie</b> → stok <b>stromy</b>,</li><li><b>daleko od siebie</b> → stok <b>łagodny</b>.</li></ul><p>Nie musisz nic liczyć, żeby to rozpoznać.</p>`,'slopes');
L('terrain','Co odczytamy z poziomic?',`<p>Mapa poziomicowa pozwala ustalić:</p><ul><li>wysokość bezwzględną punktów,</li><li>różnicę wysokości (względną),</li><li>stromiznę stoku,</li><li>kształt form terenu: góry, doliny, kotliny.</li></ul><p>Gdy punkt leży między dwiema poziomicami, podajemy jego <b>przybliżoną</b> wysokość.</p>`,'hill');
L('terrain','Mapa hipsometryczna',`<p>To mapa pokazująca ukształtowanie terenu za pomocą <b>poziomic i barw hipsometrycznych</b>.</p><p><b>Skala barw</b> w legendzie pokazuje, jakie wysokości odpowiadają danym kolorom.</p>`,'hypsometric');
L('terrain','Niziny i wyżyny',`<p>Według podziału z podręcznika:</p><ul><li><b>Niziny</b>: od 0 do 300 m n.p.m. – odcienie <span class="key">zieleni</span>.</li><li><b>Wyżyny</b>: zwykle powyżej 300 m n.p.m., z wysokościami względnymi do 300 m – odcienie <b>żółci</b>.</li></ul><p>Na schemacie podręcznika wyżyny pokazano od 300 do 500 m n.p.m.</p>`,'hypsometric');
L('terrain','Góry i depresje',`<p><b>Góry</b>: w podziale z książki są położone powyżej 500 m n.p.m. i mają wysokość względną ponad 300 m. Na mapie mają odcienie <b>pomarańczowe i czerwone</b>.</p><p><b>Depresja</b>: obszar lądowy <b>poniżej poziomu morza</b>, zaznaczany <b>ciemnozielono</b>.</p>`,'hypsometric');
L('terrain','Woda na mapie',`<p>Morza, jeziora i rzeki zaznacza się <b>kolorem niebieskim</b>.</p><p>Na mapach pokazujących głębokości wody ciemniejszy niebieski zazwyczaj oznacza <b>większą głębokość</b>.</p><div class="example">Nie myl niebieskiego jeziora z zielonym obszarem nizinnym.</div>`,'hypsometric');
L('terrain','Formy wypukłe i wklęsłe',`<p><b>Wypukłe</b> to pagórki, wzgórza i góry.</p><p><b>Wklęsłe</b> to m.in. doliny i kotliny.</p><div class="example">Jeśli teren jest wyższy w środku – myśl o wzniesieniu. Jeśli niższy w środku – myśl o zagłębieniu.</div>`,'hill');

L('reading','Po co mamy różne mapy?',`<p>Nie każda mapa pokazuje to samo. Rodzaj mapy wybieramy <b>według tego, co chcemy sprawdzić</b>.</p><p>Innych informacji potrzebuje turysta, innych kierowca, a jeszcze innych osoba analizująca lasy i pola.</p>`,'kinds');
L('reading','Mapa ogólnogeograficzna',`<p>Pokazuje <b>podstawowe informacje</b> o obszarze: ukształtowanie powierzchni, największe rzeki i jeziora, miasta, drogi, granice państw.</p><div class="example">Przyda się, gdy chcesz zobaczyć ogólny obraz Polski.</div>`,'kinds');
L('reading','Mapa krajobrazowa',`<p>Pokazuje przede wszystkim, <b>jak zagospodarowano teren</b>.</p><div class="example">Pola, łąki, lasy, zabudowa miejska, tereny przemysłowe.</div>`,'kinds');
L('reading','Mapa turystyczna',`<p>Pomaga planować wycieczki i zwiedzanie.</p><p>Znajdziesz na niej <b>szlaki turystyczne, miejsca noclegowe, zabytki, punkty widokowe</b> i inne atrakcje.</p>`,'tourist');
L('reading','Plan miasta',`<p>Plan obejmuje <b>niewielki obszar</b>, np. miasto albo osiedle, ale pokazuje go bardzo dokładnie.</p><p>Pomaga znaleźć <b>ulice, budynki, przystanki, muzea, poczty i parki</b>.</p>`,'city');
L('reading','Mapa cyfrowa',`<p>Mapa cyfrowa to mapa <b>elektroniczna</b>, np. w telefonie.</p><p>Możesz ją przybliżać, oddalać, wybierać informacje, sprawdzać drogę i korzystać z aktualizacji.</p><p>Jej zaletą jest też wygoda w nawigacji.</p>`,'kinds');
L('reading','Cztery główne kierunki',`<p>Na wielu mapach północ (N) jest u góry, południe (S) na dole, zachód (W) z lewej, a wschód (E) z prawej.</p><p>Tak jest, <b>jeśli mapa jest ustawiona północą do góry</b>.</p>`,'compass');
L('reading','Kierunki pośrednie',`<p>Pomiędzy kierunkami głównymi mamy m.in.:</p><ul><li><b>NE</b> – północny wschód,</li><li><b>NW</b> – północny zachód,</li><li><b>SE</b> – południowy wschód,</li><li><b>SW</b> – południowy zachód.</li></ul><div class="example">U góry i w lewo = <b>północny zachód</b>.</div>`,'compass');
L('reading','Orientowanie mapy',`<p><span class="key">Zorientować mapę</span> znaczy tak ją obrócić, żeby kierunki na mapie zgadzały się z kierunkami w rzeczywistości.</p><p>Możesz to zrobić na <b>dwa sposoby</b>: za pomocą kompasu lub rozpoznanych obiektów w terenie.</p>`,'compass');
L('reading','Orientowanie za pomocą kompasu',`<ol><li>Połóż mapę poziomo.</li><li>Przyłóż kompas do jej krawędzi i poczekaj, aż igła wskaże północ.</li><li>Obróć mapę tak, by północ na mapie pokryła się z północą wskazywaną przez kompas.</li></ol>`,'compass');
L('reading','Orientowanie za pomocą obiektów',`<ol><li>Znajdź w otoczeniu charakterystyczne obiekty, np. most i wieżę.</li><li>Odszukaj je na mapie.</li><li>Obróć mapę, aż kierunki do tych obiektów na mapie będą zgodne z tym, co widzisz.</li></ol>`,'city');
L('reading','Siatka liter i liczb',`<p>Na planach miasta często widzimy <b>kolumny oznaczone literami</b> i <b>wiersze oznaczone liczbami</b>.</p><p>Współrzędne <b>C2</b> to przecięcie kolumny <b>C</b> z wierszem <b>2</b>.</p><p>Na planie ćwiczeniowym poniżej znajduje się tam muzeum.</p>`,'city');
L('reading','Jak korzystać z planu?',`<ol><li>Sprawdź <b>tytuł i legendę</b>.</li><li>Znajdź szukany obiekt (pomaga siatka).</li><li>Sprawdź <b>kierunki</b> i przebieg ulic.</li><li>Jeśli trzeba, skorzystaj ze <b>skali</b> do obliczenia odległości.</li></ol>`,'city');
L('reading','Jak zaplanować trasę na mapie turystycznej?',`<ol><li>Znajdź punkt startu i cel.</li><li>Odczytaj z legendy drogi, szlaki i obiekty turystyczne.</li><li>Sprawdź, którędy biegnie trasa.</li><li>Oblicz odległość ze skali albo podziałki.</li></ol>`,'tourist');
L('reading','Przykłady z podręcznika',`<p>Na planie Krakowa <b>Planty</b> otaczają Stare Miasto, a w polu <b>C2</b> znajdziesz kościół Mariacki i kościół Świętej Trójcy.</p><p>Na mapie Pojezierza Leszczyńskiego między <b>Brennem a Wieleniem</b> przebiega droga wojewódzka <b>305</b>.</p><p>To przykłady wyszukiwania informacji w legendzie i na mapie.</p>`,'tourist');

L('map','Powtórka: mapa i skala',`<p><b>Wystarczy, że umiesz:</b></p><ul><li>wymienić cztery elementy mapy;</li><li>odróżnić znaki punktowe, liniowe i powierzchniowe;</li><li>rozpoznać trzy postacie skali;</li><li>przeliczyć centymetry na metry i kilometry.</li></ul><div class="example">Teraz sprawdzisz te rzeczy na krótkich zadaniach. Nie musisz pamiętać wszystkiego od razu.</div>`,'symbols');

L('reading','Powtórka: czytanie map',`<ul><li><b>Ogólnogeograficzna</b> → podstawowe informacje.</li><li><b>Krajobrazowa</b> → użytkowanie terenu.</li><li><b>Turystyczna</b> → szlaki i atrakcje.</li><li><b>Plan miasta</b> → ulice i budynki.</li></ul><p>Przed wyruszeniem w teren sprawdź legendę, skalę i <b>zorientuj mapę</b>.</p>`,'city');
// Baza zadań: trening używa całego banku; test pełny sprawdza 10 umiejętności w każdym dziale.
const QUESTIONS={map:[],distance:[],terrain:[],reading:[]};
let qserial=0;
function C(u,q,options,correct,explain,hint='',visual='',core=false){QUESTIONS[u].push({id:'q'+(++qserial),kind:'choice',q,options,correct,explain,hint:hint||'Przypomnij sobie właściwą definicję z nauki.',visual,core});}
function N(u,q,answer,suffix,explain,hint='',visual='',core=false){QUESTIONS[u].push({id:'q'+(++qserial),kind:'number',q,answer,suffix,explain,hint:hint||'Rozpisz działanie krok po kroku.',visual,core});}
function T(u,q,answers,explain,hint='',visual='',core=false){QUESTIONS[u].push({id:'q'+(++qserial),kind:'text',q,answers:Array.isArray(answers)?answers:[answers],explain,hint:hint||'Przypomnij sobie nazwę z lekcji.',visual,core});}

function svgText(x,y,text,size=16,color='#283d47',weight=600,anchor='start'){return `<text x="${x}" y="${y}" font-size="${size}" fill="${color}" font-family="system-ui, sans-serif" font-weight="${weight}" text-anchor="${anchor}">${esc(text)}</text>`;}
function esc(v){return String(v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');}
function escAttr(v){return esc(v);}

function nav(active){return `<nav class="mainnav" aria-label="Etapy"><button class="navbtn ${active==='learn'?'active':''}" data-action="menuLearn">1. Nauka</button><button class="navbtn ${active==='practice'?'active':''}" data-action="menuPractice">2. Trening</button><button class="navbtn ${active==='test'?'active':''}" data-action="menuTest">3. Test</button></nav>`;}
function progress(n,total){return `<div class="progressTrack" role="progressbar" aria-valuemin="0" aria-valuemax="${total}" aria-valuenow="${n}" aria-label="Postęp"><div class="progressFill" style="width:${total?100*n/total:0}%"></div></div>`;}
function topview(){window.scrollTo({top:0,behavior:'instant'});}
function render(){

 if(view==='practiceMenu')return renderPracticeMenu();

}

 ${saved.testBest!==null?`<div class="callout">Twój najlepszy wynik pełnego testu: <b>${saved.testBest}%</b>.</div>`:''}
 <p class="quiet">Nie ma limitu czasu. W teście nie ma podpowiedzi ani poprawiania po zatwierdzeniu, ale na końcu zobaczysz wyjaśnienia. Wynik nie jest oceną szkolną.</p></section>`;}
function buildPractice(id,count){let bank=QUESTIONS[id].map(q=>q.id),cycle=saved.cycles?.[id]||[];
 cycle=cycle.filter(x=>bank.includes(x));if(cycle.length===0)cycle=mix(bank);
 let selected=[];const total=count==='all'?bank.length:8;
 while(selected.length<total){if(!cycle.length)cycle=mix(bank.filter(x=>!selected.includes(x)));if(!cycle.length)break;selected.push(cycle.shift());}
 saved.cycles=saved.cycles||{};saved.cycles[id]=cycle;startSession('practice',id,selected,total);
}
function buildTest(full){const ids=[];for(const u of UNITS){const core=QUESTIONS[u.id].filter(q=>q.core).map(q=>q.id);ids.push(...mix(core).slice(0,full?10:5));}startSession('test',null,ids,full?10:5);}
function startSession(mode,id,ids,perChapter){
 session={mode,unit:id,ids,index:0,score:0,answered:[],orders:ids.map(qid=>lookup[qid].kind==='choice'?mix([0,1,2,3]):[]),current:{selected:null,input:'',tries:0,wrongChoices:[],done:false,feedback:'',hintVisible:false},paused:false,finished:false,perChapter};
 view='quiz';persist();render();topview();
}
function getQ(){return lookup[session.ids[session.index]];}
function correctText(q){if(q.kind==='choice')return q.options[q.correct];if(q.kind==='number')return `${formatN(q.answer)}${q.suffix?' '+q.suffix:''}`;return q.answers[0]==='przelecz'?'przełęcz':q.answers[0];}
function formatN(n){return String(n).replace('.',',');}
function normalize(s){return String(s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/ł/g,'l').replace(/[^a-z0-9]+/g,' ').trim();}
function numValue(s){let v=String(s).trim().replace(/\s+/g,'').replace(',','.');if(!/^-?(\d+(\.\d*)?|\.\d+)$/.test(v))return NaN;return Number(v);}
function isRight(q,answer){if(q.kind==='choice')return Number(answer)===q.correct;if(q.kind==='number')return Number.isFinite(numValue(answer))&&Math.abs(numValue(answer)-q.answer)<1e-8;return q.answers.some(a=>normalize(a)===normalize(answer));}
function questionVisual(key){
 if(!key)return '';
 // Nauka zawiera pełne etykiety; w zadaniach zostawiamy tylko rysunki, z których uczeń ma wnioskować.
 if(['scaleCompare','scaleBar','symbols','height','hypsometric','compass','kinds','saddle','simpleMap','valley'].includes(key))return '';
 if(key==='slopes')return S('Poziomice na stoku A i B',`
  <rect x="25" y="25" width="315" height="230" rx="12" fill="#e9f2e5"/><rect x="380" y="25" width="315" height="230" rx="12" fill="#e9f2e5"/>
  ${svgText(185,61,'STOK A',20,'#295e56',800,'middle')}${svgText(538,61,'STOK B',20,'#295e56',800,'middle')}
  ${[87,145,203,261].map((x,i)=>`<path d="M${x} 83v112" stroke="#a57d4e" stroke-width="3"/>${svgText(x,217,100+i*50,13,'#334c56',650,'middle')}`).join('')}
  ${[493,510,527,544].map((x,i)=>`<path d="M${x} 83v112" stroke="#a57d4e" stroke-width="3"/>${svgText(x,217,100+i*50,13,'#334c56',650,'middle')}`).join('')}
 `,'');
 if(key==='hill'||key==='basin'){
  const vals=key==='hill'?[400,450,500,550]:[400,350,300,250];const radii=[[265,112],[215,90],[165,68],[113,46]];
  return S('Rysunek poziomicowy z oznaczonymi wysokościami',`<rect x="24" y="21" width="671" height="241" rx="13" fill="#e8eedb"/>${radii.map(([rx,ry],i)=>`<ellipse cx="360" cy="144" rx="${rx}" ry="${ry}" fill="none" stroke="#9f805b" stroke-width="2"/>${svgText(360+rx-52,141-ry+15,vals[i]+' m',15,'#304953',690)}`).join('')}`,'');
 }
 const built=makeVisual(key);
 return built.replace(/<div class="visualLabel">[\s\S]*?<\/div><\/div>$/,'</div>');
}
function renderQuiz(){if(!session){view='home';render();return;}if(session.finished){view='result';return renderResult();}if(session.paused)return renderPause();
 const q=getQ(), c=session.current;const n=session.index+1,total=session.ids.length;let lessonHead=session.mode==='test'?'Test':'Trening';let qopts='';
 if(q.kind==='choice'){
   qopts=`<div class="choices" role="group" aria-label="Odpowiedzi">${session.orders[session.index].map((origIdx,index)=>{
    const selected=c.selected===origIdx, wrong=c.wrongChoices.includes(origIdx),correctShow=c.done&&origIdx===q.correct;
    return `<button class="option ${selected?'selected':''} ${wrong?'wrong':''} ${correctShow?'correct':''}" type="button" data-action="choose" data-choice="${origIdx}" ${c.done||(session.mode==='practice'&&wrong)?'disabled':''} aria-pressed="${selected}" ><span class="letter">${'ABCD'[index]}</span><span>${esc(q.options[origIdx])}</span></button>`;
   }).join('')}</div>`;
 }else{
  qopts=`<label for="answerInput" class="sr-only">Twoja odpowiedź</label><div class="fieldrow"><input id="answerInput" class="answerInput" type="text" inputmode="${q.kind==='number'?'decimal':'text'}" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Wpisz odpowiedź" value="${escAttr(c.input||'')}" ${c.done?'disabled':''}/>${q.suffix?`<span class="unitSuffix">${esc(q.suffix)}</span>`:''}</div><p class="tiny">${q.kind==='number'?'Możesz wpisać np. 1,5 albo 1.5. Jednostka jest już podana.':'Wpisz krótką nazwę.'}</p>`;
 }
 const isTest=session.mode==='test';
 let response='';
 if(isTest){response=c.selected===null&&q.kind==='choice'?'':`<div class="actions"><button class="primary right" data-action="submit">${n===total?'Zakończ test':'Zapisz i dalej →'}</button></div>`;}
 else{
  if(c.done){response=`<div class="feedback ${c.feedback==='bad'?'wrong':''}" role="status"><b>${c.feedback==='ok'?'Dobrze!':c.feedback==='retryok'?'Udało się po poprawce!':'Pokażę Ci rozwiązanie.'}</b><p>${esc(q.explain)}</p><p class="tiny">${c.feedback==='ok'?'Zdobyte punkty: 2':c.feedback==='retryok'?'Zdobyte punkty: 1':'Zdobyte punkty: 0'}</p></div><div class="actions"><button class="primary right" data-action="next">${n===total?'Zobacz podsumowanie':'Następne zadanie →'}</button></div>`;}
  else{
   response=`${c.tries?`<div class="feedback wrong" role="status"><b>Jeszcze nie.</b><p>Spróbuj drugi raz. Nie musisz się spieszyć.</p></div>`:''}
   ${c.hintVisible?`<div class="hintBox">Podpowiedź: ${esc(q.hint)}</div>`:''}
   <div class="actions"><button class="hintBtn" data-action="hint">${c.hintVisible?'Ukryj podpowiedź':'Potrzebuję podpowiedzi'}</button>${q.kind!=='choice'?`<button class="primary right" data-action="submit">Sprawdź odpowiedź</button>`:''}</div>`;
  }
 }
 app.innerHTML=`<section class="hero"><div class="eyebrow">${lessonHead} · ${esc(unitName(qUnit(q)))}</div><h1>${isTest?'Sprawdź, co umiesz':'Spróbuj samodzielnie'}</h1></section>${nav(isTest?'test':'practice')}
 <article class="panel"><div class="metaLine"><span>Pytanie ${n} z ${total}</span><span>${isTest?'Bez oceniania do końca':`${session.score} pkt`}</span></div>${progress(session.index,total)}
 <div class="question" tabindex="-1">${esc(q.q)}</div>${q.visual?questionVisual(q.visual):''}${qopts}${response}
 ${isTest?'<p class="tiny" style="margin-top:13px">Odpowiedź poznasz po zakończeniu testu.</p>':''}</article><div class="actions"><button class="smallBtn" data-action="home">Przerwij i zapisz postęp</button></div>`;
 if(!isTest&&q.kind==='choice'&&c.tries===0){ /* odpowiedź jest sprawdzana po dotknięciu opcji */ }
}
function qUnit(q){for(let u of UNITS){if(QUESTIONS[u.id].includes(q))return u.id;}return 'map';}
function renderPause(){const nextUnit=unitName(qUnit(getQ()));app.innerHTML=`<section class="hero"><div class="eyebrow">Test · przerwa między tematami</div><h1>Część ukończona ✓</h1></section>${nav('test')}<section class="panel"><h2>Możesz zrobić przerwę</h2><p>Za Tobą ${session.index} z ${session.ids.length} pytań. Wyniki zobaczysz na końcu.</p>${progress(session.index,session.ids.length)}<p class="quiet">Dalej: <b>${esc(nextUnit)}</b>.</p><div class="actions"><button class="secondary" data-action="home">Zapisz i odpocznij</button><button class="primary right" data-action="continueTest">Jestem gotowy →</button></div></section>`;}
function choose(i){const q=getQ(),c=session.current;if(q.kind!=='choice'||c.done||session.paused)return;c.selected=i;if(session.mode==='practice'){grade();}else{persist();render();}}
function submit(){const q=getQ(),c=session.current;if(c.done||session.paused)return;if(q.kind==='choice'&&c.selected===null)return;
 if(q.kind!=='choice'){const input=document.getElementById('answerInput');if(input)c.input=input.value.trim();if(!c.input){input?.focus();return;}if(q.kind==='number'&&!Number.isFinite(numValue(c.input))){input?.focus();return;}}
 if(session.mode==='test'){
   const ans=q.kind==='choice'?c.selected:c.input;const right=isRight(q,ans);session.answered.push({id:q.id,answer:ans,correct:right,points:right?1:0});session.score+=right?1:0;next();
 }else{grade();}}
function grade(){const q=getQ(),c=session.current;if(c.done)return;const ans=q.kind==='choice'?c.selected:c.input;if(q.kind==='choice'&&ans===null)return;
 if(isRight(q,ans)){const points=c.tries===0?2:1;session.score+=points;c.done=true;c.feedback=points===2?'ok':'retryok';session.answered.push({id:q.id,answer:ans,correct:true,points,tries:c.tries+1});}
 else{c.tries++;if(q.kind==='choice')c.wrongChoices.push(c.selected);c.selected=null;if(c.tries>=2){c.done=true;c.feedback='bad';session.answered.push({id:q.id,answer:ans,correct:false,points:0,tries:c.tries});}}
 persist();render();}
function next(){const prev=session.index;session.index++;
 if(session.index>=session.ids.length){session.finished=true;const percent=Math.round(100*session.score/(session.mode==='test'?session.ids.length:session.ids.length*2));
   if(session.mode==='test'){if(session.ids.length===40)saved.testBest=Math.max(saved.testBest===null?0:saved.testBest,percent);}else{saved.practiceBest[session.unit]=Math.max(saved.practiceBest[session.unit]||0,percent);}
   view='result';
 }else{session.current={selected:null,input:'',tries:0,wrongChoices:[],done:false,feedback:'',hintVisible:false};if(session.mode==='test'&&session.index%session.perChapter===0)session.paused=true;}
 persist();render();topview();}
function renderResult(){if(!session){view='home';return render();}
 const isTest=session.mode==='test',all=session.ids.length,percent=Math.round(100*session.score/(isTest?all:all*2));
 const wrong=session.answered.filter(a=>!a.correct);const byUnits=UNITS.map(u=>{let subset=session.answered.filter(a=>qUnit(lookup[a.id])===u.id);return {u,done:subset.length,good:subset.filter(a=>a.correct).length};}).filter(x=>x.done);
 app.innerHTML=`<section class="hero"><div class="eyebrow">${isTest?'Test ukończony':'Trening ukończony'}</div><h1>${isTest?'Twój wynik':'Koniec tej serii'}</h1><p class="lead">Każda próba pomaga. Sprawdź, które rzeczy już umiesz, a które warto przećwiczyć jeszcze raz.</p></section>${nav(isTest?'test':'practice')}
 <section class="panel"><h2>${isTest?'Wynik testu':'Wynik treningu'}</h2><div class="stats"><div class="stat"><strong>${percent}%</strong><small>wynik</small></div><div class="stat"><strong>${session.score}</strong><small>${isTest?'poprawnych odpowiedzi':`punktów na ${all*2}`}</small></div><div class="stat"><strong>${all-wrong.length}/${all}</strong><small>zadań rozwiązanych poprawnie</small></div></div>
 <h3>Wyniki według działów</h3><div class="checks">${byUnits.map(x=>`<div class="check"><b>${esc(x.u.short)}</b><span>${x.good} poprawnych z ${x.done}</span></div>`).join('')}</div>
 <div class="actions"><button class="secondary" data-action="home">Do menu</button><button class="primary right" data-action="${isTest?'menuTest':'menuPractice'}">${isTest?'Nowy test':'Jeszcze poćwiczę'}</button></div></section>
 <section class="panel"><h2>Powtórz te zadania (${wrong.length})</h2>${wrong.length?wrong.map((a,i)=>{let q=lookup[a.id];let given=q.kind==='choice'?q.options[a.answer]:(a.answer||'(brak)');return `<div class="reviewRow"><span class="tag bad">Do utrwalenia</span><p><b>${i+1}. ${esc(q.q)}</b></p><p class="tiny">Twoja odpowiedź: ${esc(given)}</p><p><span class="key">Poprawnie:</span> <b>${esc(correctText(q))}</b></p><p>${esc(q.explain)}</p></div>`;}).join(''):`<div class="callout"><b>Wszystkie zadania rozwiązane!</b><p>Możesz przejść do kolejnego tematu lub spróbować nowej serii.</p></div>`}</section>`;
}
function openLearn(id){unit=id;lessonIndex=Math.max(0,Math.min(LESSONS[id].length-1,saved.learnPosition[id]||0));view='learn';render();topview();}
function resetAll(){if(!window.confirm('Usunąć wyniki, ukończone lekcje i zapisane testy z tej przeglądarki?'))return;saved={completedLearn:{},learnPosition:{},practiceBest:{},testBest:null,cycles:{},active:null};session=null;persist();view='home';render();topview();}
app.addEventListener('click',e=>{const el=e.target.closest('button[data-action]');if(!el)return;let action=el.dataset.action;
 if(action==='home'){view='home';render();topview();return;}
 if(action==='menuLearn'){view='learnMenu';render();topview();return;}
 if(action==='menuPractice'){view='practiceMenu';render();topview();return;}
 if(action==='menuTest'){view='testIntro';render();topview();return;}
 if(action==='openLearn'){openLearn(el.dataset.unit);return;}
 if(action==='learnNext'){lessonIndex=Math.min(LESSONS[unit].length-1,lessonIndex+1);saved.learnPosition[unit]=lessonIndex;persist();render();topview();return;}
 if(action==='learnPrev'){lessonIndex=Math.max(0,lessonIndex-1);saved.learnPosition[unit]=lessonIndex;persist();render();topview();return;}
 if(action==='learnFinish'){saved.completedLearn[unit]=true;saved.learnPosition[unit]=0;persist();view='practiceMenu';render();topview();return;}
 if(action==='startPractice'){buildPractice(el.dataset.unit,el.dataset.count);return;}
 if(action==='startTest'){buildTest(el.dataset.count==='full');return;}
 if(action==='resume'){if(session){view=session.finished?'result':'quiz';render();topview();}return;}
 if(action==='choose'){choose(Number(el.dataset.choice));return;}
 if(action==='submit'){submit();return;}
 if(action==='next'){next();return;}
 if(action==='hint'){session.current.hintVisible=!session.current.hintVisible;persist();render();return;}
 if(action==='continueTest'){session.paused=false;persist();render();topview();return;}
 if(action==='reset'){resetAll();return;}
});
