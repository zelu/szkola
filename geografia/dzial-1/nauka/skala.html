und:#478b7e;border-radius:12px;transition:width .18s}.chapterhead{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}.problem{font-size:clamp(21px,3vw,27px);line-height:1.42;font-weight:750;max-width:730px}.choicegrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:22px 0}.choice{background:#fff;border:2px solid #cbdcdd;border-radius:14px;padding:17px 14px;min-height:67px;text-align:left;font-weight:750;font-size:20px;color:var(--ink)}.choice:hover:not(:disabled){background:#f3faf8;border-color:#81afa7}.choice:disabled{opacity:1}.choice.selected-good{border-color:#4a9b76;background:#e7f5eb;color:#12553a}.choice.selected-bad{border-color:#c78a68;background:#fff1e8;color:#8f4826}.feedback{border:1px solid #bfd7e5;background:#edf7fb;border-radius:15px;padding:17px 20px;margin:12px 0;font-size:17px}.feedback.good{background:#eaf7ec;border-color:#b2dbbe}.feedback.bad{background:#fff4ea;border-color:#e4bf9e}.feedback strong{display:block;margin-bottom:5px}.visual{border:1px solid #cbdedf;background:#f8fcfb;border-radius:18px;min-height:120px;padding:18px;overflow:hidden;margin:23px 0}.concept{display:inline-flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:12px;font-size:clamp(20px,4vw,29px);font-weight:800;padding:12px 0}.concept .tag{border-radius:14px;background:#e6f4f0;padding:10px 16px;max-width:100%;overflow-wrap:anywhere}.concept .other{background:#e8f2f9}.arrow{color:#548b84;font-weight:900}.mini-map{border-radius:13px;background:linear-gradient(140deg,#eaf3e6,#eff6f3);border:1px solid #d0ddd5;padding:18px}.mini-map .lane{width:100%;height:24px;border-radius:20px;background:#d9e6d8;position:relative;margin:16px 0 10px}.mini-map .lane:before{content:"";position:absolute;inset:9px 10px;height:6px;background:#b0cbb4;border-radius:10px}.visual-label{font-size:13px;color:#58746e;font-weight:750;letter-spacing:.02em}.segmentrow{display:flex;gap:5px;flex-wrap:nowrap;min-height:48px;overflow:auto;padding:8px 2px 7px}.segment{background:#dbeee7;border:2px solid #7db5a3;min-width:0;flex:1;max-width:125px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:750;white-space:nowrap;padding:5px}.segment.empty{background:white;border-style:dashed}.mapdots{display:flex;align-items:center;gap:0;max-width:650px}.mapdots .dot{width:13px;height:13px;border-radius:50%;background:#155c57;flex:none}.mapdots .bar{height:6px;background:#155c57;flex:1}.mapdots .bar.active{background:#378e77}.mapdots .map-index{font-size:12px}.readline{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}.mapping{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:12px;align-items:center;margin:12px 0}.mapbox{background:#e8f2f8;border:1px solid #cadfe8;border-radius:15px;text-align:center;padding:13px 16px}.landbox{background:#e2f3ea;border:1px solid #b7dec5;border-radius:15px;text-align:center;padding:13px 16px}.huge{font-size:clamp(25px,5vw,40px);font-weight:850;line-height:1.2}.mathline{font-size:clamp(24px,3vw,29px);font-weight:800;line-height:1.5;text-align:center;margin:18px 0}.counter{text-align:center;max-width:600px;margin:auto}.counterdisplay{font-size:clamp(30px,5vw,47px);font-weight:850;color:var(--teal)}.controlrow{display:flex;justify-content:center;align-items:center;gap:10px;flex-wrap:wrap;margin:16px 0}.counterbutton{height:54px;min-width:58px;border:1px solid #9cc9be;background:#f1faf7;color:#17675e;border-radius:14px;font-size:28px;font-weight:800}.counterbutton:hover{background:#dff3eb}.pill{display:inline-block;background:white;border:1px solid var(--border);border-radius:12px;padding:6px 12px;font-weight:700;font-size:15px}.counterpills{display:flex;gap:7px;flex-wrap:wrap;justify-content:center;margin:15px auto}.counterpills .pill{background:#e2f1e9;border-color:#b8d9ca}.unitline{border:1px solid #dce7df;border-radius:12px;padding:14px 16px;background:#fff;margin:11px 0;font-weight:700}.ruler{display:block;width:100%;max-width:680px;margin:auto}.helper{background:#fbfffd;border:1px solid #b5d6c9;border-radius:15px;padding:18px;margin:13px 0}.helper h3{font-size:19px}.helpercount{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.helpercalc{font-size:23px;font-weight:850;color:#14635b;margin:12px 0}.chiprow{display:flex;flex-wrap:wrap;gap:7px;margin:10px 0}.chip{background:#e8f2ee;border:1px solid #cbded4;border-radius:9px;padding:7px 11px;font-size:15px;font-weight:700}.muted{color:var(--secondary)}.review{display:grid;gap:12px;margin:20px 0}.reviewrow{padding:15px 17px;border:1px solid var(--border);border-radius:14px;background:white}.reviewrow strong{display:block}.toolbar{display:flex;align-items:center;justify-content:space-between;gap:15px;flex-wrap:wrap;margin-bottom:18px}.toolbar select{background:#fff;border:1px solid #cbdcdd;border-radius:12px;padding:11px 13px;min-height:49px;max-width:100%;color:var(--ink)}.toggle{display:flex;gap:8px;flex-wrap:wrap}.toggle button{border:1px solid var(--border);background:white;border-radius:12px;padding:12px 13px;color:var(--ink);font-weight:750;min-height:49px}.toggle button.active{border-color:#6ea995;background:#e9f6ef;color:#07584c}.footer{text-align:center;font-size:13px;color:var(--secondary);padding:20px}.shortcut{max-width:770px;border:1px solid #ceddd8;border-radius:15px;background:#fff;padding:15px 18px;margin:14px 0}.shortcut summary{cursor:pointer;font-weight:750;color:#22594f}.shortcut ol{padding-left:22px;margin:13px 0 0}.kicker{color:var(--teal);font-weight:800;font-size:14px;margin-top:12px}.lesson-foot{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap;margin-top:22px}.island{max-width:800px;margin:auto}.selectwrap{display:flex;align-items:center;gap:9px;flex-wrap:wrap}.congrats{border:1px solid #b6dcca;background:#ecf8f0;border-radius:16px;padding:16px 20px}.congrats h2{margin-bottom:8px}.footerlinks{margin-top:20px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}svg text{font-family:inherit}.nowrap{white-space:nowrap}

<body>
<div id="app"></div>
<script>
'use strict';
const KEY='skala_odleglosci_audhd_v1';
const STARTDATA={done:[],slide:{},practiced:0,preferences:{topic:'all',level:'easy'}};
function load(){try{const d=JSON.parse(localStorage.getItem(KEY));return {...STARTDATA,...d,preferences:{...STARTDATA.preferences,...d.preferences}}}catch(e){return JSON.parse(JSON.stringify(STARTDATA))}}
let saved=load();
function save(){try{localStorage.setItem(KEY,JSON.stringify(saved))}catch(e){}}
const modules=[
{id:'one',short:'Co oznacza skala?',description:'1 cm na mapie i prawdziwa droga.',total:'4 kroki'},
{id:'pieces',short:'Liczymy równe odcinki',description:'Dodajemy po 100 m lub po 200 m.',total:'4 kroki'},
{id:'units',short:'Centymetry, metry, kilometry',description:'Zamieniamy jednostki w prostych krokach.',total:'5 kroków'},
{id:'numbers',short:'Skala 1:10 000',description:'Zamieniamy skalę liczbową na mianowaną.',total:'5 kroków'},
{id:'distance',short:'Obliczam odległość',description:'Odległość w terenie na podstawie mapy.',total:'5 kroków'},
{id:'route',short:'Droga z dwóch odcinków',description:'Najpierw sumujemy długości na mapie.',total:'4 kroki'},
{id:'bar',short:'Podziałka liniowa',description:'Odczytujemy odległość z kreski.',total:'4 kroki'},
{id:'reverse',short:'Ile centymetrów na mapie?',description:'Odległość w terenie zamieniamy na mapę.',total:'4 kroki'}
];
const qq=(prompt,options,answer,hint,why,visual,calc)=>({kind:'question',prompt,options,answer,hint,why,visual,calc});
const note=(title,body,visual)=>({kind:'note',title,body,visual});
const slides={
one:[
note('Mapa jest pomniejszona','Prawdziwa droga może być długa. Na mapie pokazujemy ją jako krótszy odcinek. <strong>Skala</strong> mówi nam, ile drogi w terenie odpowiada odcinkowi na mapie.',{type:'compare'}),
note('Jeden centymetr to jeden krok','Na tej przykładowej mapie <strong>1 cm na mapie odpowiada 100 m w terenie</strong>. Klikaj + i −, żeby zobaczyć, ile drogi oznaczają kolejne centymetry.',{type:'explore',base:100}),
qq('Na mapie: 1 cm = 100 m. Ile metrów w terenie oznacza 1 cm?', ['10 m','100 m','200 m','1 km'],'100 m','Spójrz na zapis: po lewej jest 1 cm, po prawej odległość w terenie.','Zapis „1 cm = 100 m” odczytujemy dosłownie: 1 cm na mapie odpowiada 100 m w terenie.',{type:'concept',map:'1 cm',land:'100 m'}),
qq('Na mapie: 1 cm = 100 m. Ile metrów odpowiada 2 cm?', ['200 m','100 m','20 m','300 m'],'200 m','Dwa odcinki po 100 m: 100 m + 100 m.','2 cm to dwa odcinki po 100 m. Dlatego 100 m + 100 m = 200 m.',{type:'segments',count:2,unit:100},{type:'add',count:2,unit:100})
],
pieces:[
note('Nie musisz mnożyć w pamięci','Zamiast 4 × 200 m możesz liczyć spokojnie: <strong>200 → 400 → 600 → 800 m</strong>. Każde dodanie to kolejny centymetr na mapie.',{type:'explore',base:200}),
qq('Skala: 1 cm = 100 m. Trasa ma 3 cm na mapie. Ile to metrów?', ['100 m','200 m','300 m','400 m'],'300 m','Policz trzy kroki po 100 m.','100 m + 100 m + 100 m = 300 m.',{type:'segments',count:3,unit:100},{type:'add',count:3,unit:100}),
qq('Skala: 1 cm = 200 m. Trasa ma 3 cm na mapie. Ile to metrów?', ['400 m','500 m','600 m','900 m'],'600 m','Dodawaj po 200 m: pierwszy, drugi, trzeci odcinek.','200 m + 200 m + 200 m = 600 m.',{type:'segments',count:3,unit:200},{type:'add',count:3,unit:200}),
qq('Skala: 1 cm = 200 m. Trasa ma 4 cm na mapie. Ile to metrów?', ['600 m','800 m','400 m','1000 m'],'800 m','Cztery razy dodaj po 200 m. Możesz użyć pomocnika.','200 m + 200 m + 200 m + 200 m = 800 m.',{type:'segments',count:4,unit:200},{type:'add',count:4,unit:200})
],
units:[
note('100 cm to 1 m','Zapamiętaj jedną rzecz: <strong>100 cm = 1 m</strong>. Żeby zamienić centymetry na metry, dzielimy ich liczbę przez 100.',{type:'units'}),
note('1000 m to 1 km','Druga rzecz: <strong>1000 m = 1 km</strong>. Gdy masz np. 2000 m, to są 2 km. Najpierw jednak możesz wszystko liczyć w metrach.',{type:'kilometers'}),
qq('Ile metrów to 10 000 cm?', ['10 m','100 m','1000 m','1 m'],'100 m','100 cm to 1 m. Pomyśl, ile takich grup jest w 10 000 cm.','10 000 cm ÷ 100 = 100 m.',{type:'conversion',from:'10 000 cm',action:'÷ 100',to:'? m'},{type:'divide',number:10000,div:100,unit:'m'}),
qq('Ile metrów to 30 000 cm?', ['300 m','30 m','3000 m','3 m'],'300 m','Dzielimy liczbę centymetrów przez 100.','30 000 cm ÷ 100 = 300 m.',{type:'conversion',from:'30 000 cm',action:'÷ 100',to:'? m'},{type:'divide',number:30000,div:100,unit:'m'}),
qq('Ile kilometrów to 3000 m?', ['30 km','3 km','300 km','0,3 km'],'3 km','1000 m to 1 km. Ile pełnych tysięcy metrów masz tutaj?','3000 m ÷ 1000 = 3 km.',{type:'conversion',from:'3000 m',action:'÷ 1000',to:'? km'},{type:'divide',number:3000,div:1000,unit:'km'})
],
numbers:[
note('Jak czytać 1:10 000?','Skala <strong>1:10 000</strong> oznacza: 1 cm na mapie to 10 000 cm w terenie. Dopiero potem zamieniamy centymetry na metry.',{type:'number',den:10000}),
note('Zrób dwa małe kroki','<strong>Krok 1:</strong> 1 cm → 10 000 cm. <strong>Krok 2:</strong> 10 000 cm ÷ 100 = 100 m. Czyli skala 1:10 000 to również 1 cm = 100 m.',{type:'twoSteps',den:10000}),
qq('Skala 1:10 000. Ile centymetrów w terenie oznacza 1 cm na mapie?', ['100 cm','1000 cm','10 000 cm','100 000 cm'],'10 000 cm','Po dwukropku stoi liczba centymetrów w terenie.','W zapisie 1:10 000 druga liczba mówi, że 1 cm na mapie to 10 000 cm w terenie.',{type:'number',den:10000}),
qq('Skala 1:50 000. Ile METRÓW w terenie oznacza 1 cm na mapie?', ['50 m','500 m','5000 m','5 m'],'500 m','Najpierw 50 000 cm, potem podziel przez 100.','50 000 cm ÷ 100 = 500 m.',{type:'number',den:50000},{type:'divide',number:50000,div:100,unit:'m'}),
qq('Skala 1:100 000. Ile KILOMETRÓW w terenie oznacza 1 cm na mapie?', ['1 km','10 km','100 km','0,1 km'],'1 km','100 000 cm to 1000 m. A 1000 m to 1 km.','100 000 cm = 1000 m = 1 km.',{type:'number',den:100000},{type:'chain',den:100000})
],
distance:[
note('Prosty algorytm w 3 krokach','<strong>1.</strong> Ustal, ile metrów oznacza 1 cm. <strong>2.</strong> Sprawdź, ile centymetrów ma droga na mapie. <strong>3.</strong> Dodawaj taką odległość tyle razy, ile masz centymetrów.',{type:'algorithm'}),
note('Przykład: 3 cm w skali 1:30 000','1 cm = 300 m. Trasa ma 3 cm. Liczymy: <strong>300 + 300 + 300 = 900 m</strong>. Nie musisz używać mnożenia!',{type:'explore',base:300,initial:3}),
qq('Na mapie w skali 1:10 000 droga ma 3 cm. Ile ma w terenie?', ['30 m','300 m','3000 m','100 m'],'300 m','W tej skali 1 cm = 100 m. Policz trzy razy po 100 m.','1:10 000 to 1 cm = 100 m. Trzy odcinki po 100 m dają 300 m.',{type:'segments',count:3,unit:100,scale:10000},{type:'add',count:3,unit:100}),
qq('Na mapie w skali 1:25 000 droga ma 2 cm. Ile ma w terenie?', ['250 m','500 m','50 m','750 m'],'500 m','W tej skali 1 cm = 250 m. Dodaj 250 m dwa razy.','25 000 cm to 250 m. Dwa odcinki po 250 m dają 500 m.',{type:'segments',count:2,unit:250,scale:25000},{type:'add',count:2,unit:250}),
qq('Na mapie w skali 1:100 000 droga ma 3 cm. Ile ma w terenie?', ['1 km','2 km','3 km','300 km'],'3 km','W tej skali 1 cm oznacza dokładnie 1 km.','1 cm = 1 km, więc 3 cm odpowiadają 3 km.',{type:'segments',count:3,unit:1,suffix:'km',scale:100000},{type:'add',count:3,unit:1,suffix:'km'})
],
route:[
note('Najpierw dodaj odcinki mapy','Droga może się załamywać. Jeśli ma części <strong>2 cm + 3 cm</strong>, to najpierw liczysz 5 cm na mapie. Dopiero potem korzystasz ze skali.',{type:'route',a:2,b:3,scale:10000}),
qq('Droga na mapie ma dwie części: 2 cm i 3 cm. Ile cm ma cała trasa NA MAPIE?', ['1 cm','5 cm','6 cm','3 cm'],'5 cm','Najpierw dodaj 2 cm + 3 cm. Jeszcze nie przeliczamy skali.','2 cm + 3 cm = 5 cm na mapie.',{type:'route',a:2,b:3,scale:10000},{type:'route',a:2,b:3}),
qq('Trasa ma 5 cm na mapie. Skala to 1:10 000. Ile metrów ma w terenie?', ['100 m','300 m','500 m','50 m'],'500 m','1 cm = 100 m. Dodaj 100 m pięć razy.','5 × 100 m = 500 m. Możesz też dodawać: 100, 200, 300, 400, 500.',{type:'segments',count:5,unit:100,scale:10000},{type:'add',count:5,unit:100}),
qq('Trasa ma odcinki 2 cm i 2 cm. Skala to 1:30 000. Ile metrów ma w terenie?', ['600 m','900 m','1200 m','300 m'],'1200 m','2 + 2 = 4 cm. Potem cztery razy po 300 m.','2 + 2 = 4 cm. W skali 1:30 000 jeden cm to 300 m, więc 4 × 300 = 1200 m.',{type:'route',a:2,b:2,scale:30000},{type:'add',count:4,unit:300})
],
bar:[
note('Podziałka liniowa to gotowa miarka','Na takiej kresce są liczby: 0, 100, 200, 300 m. <strong>Nie musisz mnożyć</strong>. Odczytaj liczbę w miejscu, do którego sięga odległość.',{type:'rulerExplore',step:100,ticks:5}),
qq('Na podziałce zaznaczono koniec drogi. Jaka jest odległość?', ['100 m','200 m','300 m','400 m'],'300 m','Zacznij od zera. Czytaj liczby pod kolejnymi kreskami.','Znacznik stoi nad kreską 300 m, więc odległość wynosi 300 m.',{type:'rulerQuestion',step:100,ticks:5,target:3}),
qq('Na podziałce zaznaczono koniec drogi. Jaka jest odległość?', ['500 m','1000 m','1500 m','2000 m'],'1500 m','Każdy kolejny główny odcinek oznacza 500 m.','Znacznik stoi przy trzecim odcinku: 3 × 500 m = 1500 m.',{type:'rulerQuestion',step:500,ticks:4,target:3}),

let view={screen:'home',moduleId:'one',step:0,answered:null,errors:0,hint:false,solution:false,helper:false,helperCount:0,explore:1,practice:[],index:0,wrong:[],missed:[],revealed:false,barSelection:0};
const app=document.getElementById('app');
const fmt=n=>String(n).replace(/\B(?=(\d{3})+(?!\d))/g,' ');
const groupFromUnit=u=>u>=1000&&u%1000===0?`${fmt(u/1000)} km`:`${fmt(u)} m`;
const escapeHTML=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const percent=(n,all)=>Math.round(n/all*100);
function header(){return `<header class="top"><div class="topin"><div class="brand"><div class="brand-mark">S</div><div>Skala i odległości<small>Interaktywna nauka · geografia</small></div></div><nav class="topnav" aria-label="Nawigacja"><button type="button" class="pillbtn" data-go="home">Start</button><button type="button" class="pillbtn" data-go="learn">Lekcje</button><button type="button" class="pillbtn" data-go="practiceSetup">Trening</button></nav></div></header>`}
function render(){let body='';if(view.screen==='home')body=home();else if(view.screen==='learn')body=learnIndex();else if(view.screen==='lesson')body=lesson();else if(view.screen==='practiceSetup')body=practiceSetup();else if(view.screen==='practice')body=practice();else if(view.screen==='practiceEnd')body=practiceEnd();app.innerHTML=header()+`<main class="shell">${body}</main><footer class="footer">Działa bez internetu · bez zegara · postępy zapisują się tylko na tym urządzeniu</footer>`;wire();}
function home(){const done=saved.done.length;return `<section class="panel hero"><div class="eyebrow">Geografia · spokojny start</div><h1>Naucz się skali<br>małymi krokami</h1><p class="lead secondary">Najpierw zobaczysz, co oznacza <b>1 cm na mapie</b>. Potem nauczysz się liczyć odległości. Nie musisz umieć szybko mnożyć ani dzielić.</p><div class="actions"><button class="primary" data-go="lesson" data-module="${firstUndone()}">${done?'Kontynuuj naukę':'Zacznij od początku'} →</button><button class="secondarybtn" data-go="practiceSetup">Ćwicz samodzielnie</button></div></section><div class="grid2"><section class="panel" style="margin-bottom:0"><div class="eyebrow">8 lekcji</div><h2>Jedna rzecz naraz</h2><p class="secondary">W każdym kroku dostaniesz krótką instrukcję, przykład i proste zadanie.</p><div class="progressbar" role="progressbar" aria-valuemin="0" aria-valuemax="8" aria-valuenow="${done}"><div style="width:${percent(done,8)}%"></div></div><p class="tiny">Ukończone lekcje: ${done} z 8</p><button class="softbtn" data-go="learn">Zobacz wszystkie lekcje</button></section><section class="panel" style="margin-bottom:0"><div class="eyebrow">Pomoc w liczeniu</div><h2>Możesz dodawać zamiast mnożyć</h2><div class="concept"><span class="tag">1 cm = 200 m</span><span class="arrow">→</span><span class="tag other">3 cm = ?</span></div><div class="chiprow"><span class="chip">200 m</span><span class="chip">+ 200 m</span><span class="chip">+ 200 m</span></div><p class="secondary">W zadaniach pomocnik policzy z Tobą każdy centymetr. Dopiero na końcu pokażesz odpowiedź.</p></section></div><section class="panel"><div class="eyebrow">Jak będziemy pracować</div><div class="grid3"><div><h3>1. Zobacz</h3><p class="secondary">Krótkie wyjaśnienie i rysunek.</p></div><div><h3>2. Spróbuj</h3><p class="secondary">Jedno pytanie, kilka odpowiedzi.</p></div><div><h3>3. Popraw</h3><p class="secondary">Podpowiedź, kolejne podejście, brak kar za pomyłkę.</p></div></div></section><p class="tiny"><button class="smallbtn" data-action="reset">Wyczyść zapisane postępy</button></p>`}
function firstUndone(){return modules.find(x=>!saved.done.includes(x.id))?.id||'one'}
function learnIndex(){return `<div class="panel"><div class="eyebrow">Etap 1 · nauka</div><h1>Wybierz lekcję</h1><p class="secondary">Najlepiej iść od góry, ale do każdej lekcji możesz wrócić w dowolnej chwili. Nic nie jest zablokowane.</p><div class="grid2">${modules.map((m,i)=>`<button type="button" class="tile actiontile ${saved.done.includes(m.id)?'done':''}" data-go="lesson" data-module="${m.id}"><span class="badge">Lekcja ${i+1}</span><strong>${escapeHTML(m.short)} ${saved.done.includes(m.id)?'✓':''}</strong><p>${escapeHTML(m.description)} · ${m.total}</p></button>`).join('')}</div><div class="actions"><button class="secondarybtn" data-go="home">← Strona główna</button><button class="softbtn" data-go="practiceSetup">Przejdź do treningu →</button></div></div>`}
function shortcut(){return `<details class="shortcut"><summary>Ściąga: co robię po kolei?</summary><ol><li>Patrzę na skalę. Ustalam, co oznacza <b>1 cm</b> na mapie.</li><li>Sprawdzam, ile <b>cm</b> ma droga na mapie.</li><li>Dodaję odległość tyle razy, ile mam centymetrów.</li><li>Na końcu zapisuję wynik z jednostką: <b>m</b> lub <b>km</b>.</li></ol><p class="tiny">Gdy droga ma kilka części: najpierw dodaj długości na mapie, potem użyj skali.</p></details>`}
function lesson(){const m=modules.find(x=>x.id===view.moduleId),steps=slides[m.id],s=steps[view.step];const idx=modules.findIndex(x=>x.id===m.id);const p=percent(view.step+1,steps.length);return `<div class="island"><div class="toolbar"><button class="smallbtn" data-go="learn">← Wszystkie lekcje</button><div class="course-badge">Lekcja ${idx+1}/8 · Krok ${view.step+1}/${steps.length}</div></div><div class="panel"><div class="chapterhead"><span class="eyebrow">${escapeHTML(m.short)}</span><span class="tiny">Bez pośpiechu</span></div><div class="progressbar"><div style="width:${p}%"></div></div>${s.kind==='note'?`<h2>${s.title}</h2><p class="lead">${s.body}</p>`:`<h2 style="margin-top:24px">Spróbuj samodzielnie</h2><p class="problem">${escapeHTML(s.prompt)}</p>`}${visual(s.visual,s.kind==='question')}${s.kind==='question'?questionUI(s):`<div class="notice"><b>Wskazówka:</b> Jeżeli coś jest niejasne, możesz wrócić do tego kroku tyle razy, ile chcesz.</div>`}${shortcut()}<div class="lesson-foot"><button class="backbtn" data-action="prev" ${view.step===0?'disabled':''}>← Poprzedni krok</button>${s.kind==='note'||view.answered===s.answer||view.solution?`<button class="primary" data-action="next">${view.step===steps.length-1?'Zakończ lekcję ✓':'Następny krok →'}</button>`:''}</div></div></div>`}
function questionUI(q){let solved=view.answered===q.answer;return `<div class="choicegrid">${q.options.map(option=>`<button type="button" class="choice ${view.answered===option?(solved?'selected-good':'selected-bad'):''}" data-answer="${escapeHTML(option)}" ${solved||view.solution?'disabled':''}>${escapeHTML(option)}</button>`).join('')}</div>${view.answered!==null?`<div class="feedback ${solved?'good':'bad'}" role="status"><strong>${solved?'Tak, dobrze!':'Spróbuj jeszcze raz.'}</strong>${solved?escapeHTML(q.why):'Możesz przeczytać podpowiedź lub skorzystać z pomocnika. Nie musisz zgadywać.'}</div>`:''}${!solved?`<div class="actions"><button class="softbtn" data-action="hint">${view.hint?'Ukryj podpowiedź':'Podpowiedź'}</button>${q.calc?`<button class="softbtn" data-action="helper">${view.helper?'Ukryj pomocnika':'Licz razem ze mną'}</button>`:''}${view.errors>=1?`<button class="secondarybtn" data-action="solution">${view.solution?'Ukryj rozwiązanie':'Pokaż rozwiązanie'}</button>`:''}</div>${view.hint?`<div class="hintbox"><strong>Podpowiedź</strong>${escapeHTML(q.hint)}</div>`:''}${view.helper?renderHelper(q.calc):''}${view.solution?`<div class="notice" role="status"><b>Rozwiązanie:</b> ${escapeHTML(q.why)}<div style="margin-top:8px"><b>Odpowiedź: ${escapeHTML(q.answer)}</b></div></div>`:''}`:''}`}
function routeSvg(a,b,showScale){const width=680;const x0=55,x1=55+a*53,x2=x1+b*53;return `<svg viewBox="0 0 ${width} 210" role="img" aria-label="Droga składa się z odcinka ${a} centymetrów i odcinka ${b} centymetrów" class="ruler"><rect width="680" height="210" rx="15" fill="#ecf4eb"/><path d="M35 35 C170 0 320 100 650 45" fill="none" stroke="#c7dccc" stroke-width="19" opacity=".8"/><path d="M30 172 L640 172" stroke="#d2dfd6" stroke-width="12" stroke-linecap="round"/><polyline points="${x0},135 ${x1},135 ${x2},60" fill="none" stroke="#176b65" stroke-width="11" stroke-linejoin="round" stroke-linecap="round"/><circle cx="${x0}" cy="135" r="9" fill="#1c5859"/><circle cx="${x1}" cy="135" r="9" fill="#1c5859"/><circle cx="${x2}" cy="60" r="9" fill="#1c5859"/><text x="${(x0+x1)/2}" y="113" text-anchor="middle" font-size="23" font-weight="800" fill="#174c4a">${a} cm</text><text x="${(x1+x2)/2+20}" y="90" text-anchor="middle" font-size="23" font-weight="800" fill="#174c4a">${b} cm</text><text x="${x0-15}" y="162" font-size="18" fill="#2d5a52">A</text><text x="${x2+12}" y="65" font-size="18" fill="#2d5a52">B</text>${showScale?`<rect x="400" y="140" width="248" height="43" rx="8" fill="white" stroke="#abc6bb"/><text x="525" y="167" font-size="18" text-anchor="middle" font-weight="700">Skala 1:${fmt(showScale)}</text>`:''}</svg>`}
function rulerSVG(step,ticks,target,interactive){const width=650,left=46,right=604,y=102,dx=(right-left)/ticks;let x=Array.from({length:ticks+1},(_,i)=>{const px=left+dx*i;return `<line x1="${px}" x2="${px}" y1="${y-14}" y2="${y+17}" stroke="#265956" stroke-width="2.5"/><text x="${px}" y="${y+47}" text-anchor="middle" font-size="${ticks>=5?17:19}" font-weight="700" fill="#285752">${fmt(i*step)}</text>`}).join('');return `<svg class="ruler" viewBox="0 0 ${width} 190" role="img" aria-label="Podziałka liniowa od 0 do ${fmt(step*ticks)} metrów co ${fmt(step)} metrów${target!==null?', znacznik na '+fmt(step*target)+' metrach':''}"><rect width="650" height="190" rx="13" fill="#eff7f4"/><line x1="${left}" x2="${right}" y1="${y}" y2="${y}" stroke="#285752" stroke-width="5" stroke-linecap="round"/>${target!==null?`<line x1="${left}" x2="${left+dx*target}" y1="${y}" y2="${y}" stroke="#2a8d81" stroke-width="10" stroke-linecap="round"/><line x1="${left+dx*target}" x2="${left+dx*target}" y1="37" y2="${y-16}" stroke="#9b6333" stroke-width="3"/><circle cx="${left+dx*target}" cy="36" r="11" fill="#a7693d"/>`:''}${x}<text x="617" y="${y+47}" font-size="18" fill="#285752">m</text>${interactive?Array.from({length:ticks+1},(_,i)=>`<rect data-ruler-index="${i}" tabindex="0" role="button" aria-label="Wybierz kreskę ${i}" x="${left+dx*i-dx/2}" y="20" width="${dx}" height="${y+43}" fill="transparent" style="cursor:pointer"/>`).join(''):''}</svg>`}
function segments(count,unit,suffix='m'){return `<div class="mini-map"><div class="visual-label">DROGA NA MAPIE · ${count} cm</div><div class="segmentrow">${Array.from({length:count},(_,i)=>`<div class="segment">1 cm</div>`).join('')}</div><div class="tiny">Każdy odcinek na mapie oznacza ${fmt(unit)} ${suffix} w terenie. Schemat nie jest w rzeczywistej skali ekranu.</div></div>`}
function visual(v,isQuestion){if(!v)return '';let content='';switch(v.type){
case 'compare':content=`<div class="mapping"><div class="mapbox"><div class="visual-label">NA MAPIE</div><div class="huge">1 cm</div></div><div class="arrow">→</div><div class="landbox"><div class="visual-label">W TERENIE</div><div class="huge">np. 100 m</div></div></div><div class="mini-map"><div class="lane"></div><div class="tiny">To ta sama droga, pokazana na mapie w pomniejszeniu.</div></div>`;break;
case 'concept':content=`<div class="mapping"><div class="mapbox"><div class="visual-label">NA MAPIE</div><div class="huge">${v.map}</div></div><div class="arrow">→</div><div class="landbox"><div class="visual-label">W TERENIE</div><div class="huge">${v.land}</div></div></div>`;break;
case 'explore':{const c=Math.max(1,Math.min(6,view.explore));content=`<div class="counter"><div class="concept"><span class="tag">1 cm</span><span>→</span><span class="tag other">${fmt(v.base)} m</span></div><div class="controlrow"><button class="counterbutton" aria-label="Mniej centymetrów" data-action="exploreMinus">−</button><span class="huge" style="min-width:102px">${c} cm</span><button class="counterbutton" aria-label="Więcej centymetrów" data-action="explorePlus">+</button></div><div class="segmentrow">${Array.from({length:c},()=>`<div class="segment">${fmt(v.base)} m</div>`).join('')}</div><div class="counterdisplay">${fmt(c*v.base)} m</div><div class="tiny">${Array(c).fill(`${fmt(v.base)} m`).join(' + ')} = ${fmt(c*v.base)} m</div></div>`;break;}
case 'units':content=`<div class="unitline"><div class="concept"><span class="tag">100 cm</span><span>=</span><span class="tag other">1 m</span></div><p class="tiny">Żeby zamienić cm na m: <b>dzielimy przez 100</b>.</p></div><div class="unitline"><b>Przykład:</b> 20 000 cm ÷ 100 = 200 m</div>`;break;
case 'kilometers':content=`<div class="unitline"><div class="concept"><span class="tag">1000 m</span><span>=</span><span class="tag other">1 km</span></div><p class="tiny">Żeby zamienić m na km: <b>dzielimy przez 1000</b>.</p></div><div class="unitline"><b>Przykład:</b> 3000 m ÷ 1000 = 3 km</div>`;break;
case 'conversion':content=`<div class="concept"><span class="tag">${v.from}</span><span class="arrow">${v.action} →</span><span class="tag other">${v.to}</span></div>`;break;
case 'number':content=`<div class="mapping"><div class="mapbox"><div class="visual-label">SKALA LICZBOWA</div><div class="huge">1:${fmt(v.den)}</div></div><div class="arrow">→</div><div class="landbox"><div class="visual-label">JEDEN CENTYMETR NA MAPIE</div><div class="huge">${fmt(v.den)} cm</div><div class="tiny">w terenie</div></div></div>`;break;
case 'twoSteps':content=`<div class="steps"><div class="unitline"><span class="stepicon" style="display:inline-grid;margin-right:9px">1</span>1 cm na mapie → ${fmt(v.den)} cm w terenie</div><div class="unitline"><span class="stepicon" style="display:inline-grid;margin-right:9px">2</span>${fmt(v.den)} cm ÷ 100 = ${fmt(v.den/100)} m</div></div>`;break;
case 'segments':content=`${v.scale?`<div class="eyebrow">Skala 1:${fmt(v.scale)}</div>`:''}${segments(v.count,v.unit,v.suffix||'m')}`;break;
case 'algorithm':content=`<ol class="steps"><li><span class="stepicon">1</span><div><b>Skala:</b> co oznacza 1 cm?</div></li><li><span class="stepicon">2</span><div><b>Pomiar:</b> ile cm ma trasa?</div></li><li><span class="stepicon">3</span><div><b>Liczenie:</b> dodawaj kolejne odcinki.</div></li><li><span class="stepicon">4</span><div><b>Odpowiedź:</b> napisz m lub km.</div></li></ol>`;break;
case 'route':content=routeSvg(v.a,v.b,v.scale)+`<div class="tiny">To schemat. Nie odmierzaj odcinków linijką na ekranie.</div>`;break;
case 'rulerExplore':content=`<p class="secondary" style="margin-top:0">Dotknij dowolnej kreski. Zobaczysz, jaką odległość oznacza.</p>${rulerSVG(v.step,v.ticks,view.barSelection,true)}<p style="text-align:center;font-weight:850;font-size:25px">${fmt(view.barSelection*v.step)} m</p>`;break;
case 'rulerQuestion':content=rulerSVG(v.step,v.ticks,v.target,false);break;
case 'exploreReverse':content=`<div class="concept"><span class="tag">1 cm = ${fmt(v.base)} m</span><span class="arrow">→</span><span class="tag other">${fmt(v.target)} m = ? cm</span></div><div class="counter"><p><b>Dodawaj po ${fmt(v.base)} m:</b></p><div class="controlrow"><button class="counterbutton" data-action="exploreMinus" aria-label="Cofnij jeden krok">−</button><span class="huge">${Math.min(view.explore,v.target/v.base)} cm</span><button class="counterbutton" data-action="explorePlus" aria-label="Dodaj jeden krok">+</button></div><div class="segmentrow">${Array.from({length:Math.min(view.explore,v.target/v.base)},()=>`<div class="segment">${fmt(v.base)} m</div>`).join('')}</div><div class="counterdisplay">${fmt(Math.min(view.explore,v.target/v.base)*v.base)} / ${fmt(v.target)} m</div></div>`;break;
case 'reverse':content=`<div class="mapping"><div class="landbox"><div class="visual-label">SKALA</div><div class="huge">1 cm = ${fmt(v.unit)} ${v.suffix||'m'}</div></div><div class="arrow">→</div><div class="mapbox"><div class="visual-label">W TERENIE MAMY</div><div class="huge">${fmt(v.target)} ${v.suffix||'m'}</div></div></div><div class="tiny">Szukasz liczby centymetrów na mapie.</div>`;break;
default:content='';}
return `<div class="visual">${content}</div>`;}
function renderHelper(calc){if(!calc)return '';const c=Math.max(0,view.helperCount);let text='',pills='',controls='',result='';if(calc.type==='add'||calc.type==='reverse'){const max=calc.type==='add'?calc.count:calc.target/calc.unit,step=calc.unit,suffix=calc.suffix||'m',current=Math.min(c,max);text=calc.type==='add'?`Dodaj ${fmt(step)} ${suffix} za każdy centymetr na mapie.`:`Dodawaj po ${fmt(step)} ${suffix}, aż uzyskasz ${fmt(calc.target)} ${suffix}.`;pills=Array.from({length:max},(_,i)=>`<span class="chip" style="${i>=current?'opacity:.42;background:white;':''}">${i<current?'+ ':''}${fmt(step)} ${suffix}</span>`).join('');result=`${fmt(current*step)} ${suffix}${calc.type==='reverse'?` · ${current} cm na mapie`:''}`;controls=`<button type="button" class="smallbtn" data-action="helperMinus" ${current===0?'disabled':''}>← Cofnij</button><button type="button" class="softbtn" data-action="helperPlus" ${current>=max?'disabled':''}>Dodaj kolejny cm →</button>`;}
else if(calc.type==='divide'){text=`Z centymetrów na metry dzielimy przez 100. Z metrów na kilometry dzielimy przez 1000.`;pills=`<span class="chip">${fmt(calc.number)} ÷ ${fmt(calc.div)}</span>`;result=c>0?`${fmt(calc.number/calc.div)} ${calc.unit}`:'?';controls=`<button class="softbtn" data-action="helperPlus" ${c>0?'disabled':''}>Pokaż wynik dzielenia</button>`;}
else if(calc.type==='chain'){text='Najpierw cm → m (dziel przez 100), potem m → km (dziel przez 1000).';pills=`<span class="chip">${fmt(calc.den)} cm</span>${c>=1?`<span class="chip">= ${fmt(calc.den/100)} m</span>`:''}${c>=2?`<span class="chip">= ${fmt(calc.den/100000)} km</span>`:''}`;result=`${c===0?'Pierwszy krok: ? m':c===1?'Drugi krok: ? km':`${fmt(calc.den/100000)} km`}`;controls=`<button class="softbtn" data-action="helperPlus" ${c>=2?'disabled':''}>${c===0?'Zamień na metry':'Zamień na kilometry'}</button>`;}
else if(calc.type==='route'){text='Najpierw dodaj długości na mapie.';pills=`<span class="chip">${calc.a} cm + ${calc.b} cm</span>`;result=c===0?'? cm':`${calc.a+calc.b} cm`;controls=`<button class="softbtn" data-action="helperPlus" ${c>0?'disabled':''}>Pokaż sumę</button>`;}
return `<div class="helper" role="region" aria-label="Pomocnik liczenia"><h3>Liczymy razem</h3><p>${escapeHTML(text)}</p><div class="chiprow">${pills}</div><p class="helpercalc" aria-live="polite">${result}</p><div class="helpercount">${controls}</div></div>`}
function currentQuestion(){return view.screen==='lesson'?slides[view.moduleId][view.step]:view.practice[view.index]}
function wire(){app.querySelectorAll('[data-go]').forEach(el=>el.addEventListener('click',()=>navigate(el.dataset.go,el.dataset.module)));app.querySelectorAll('[data-action]').forEach(el=>el.addEventListener('click',()=>action(el.dataset.action,el)));app.querySelectorAll('[data-answer]').forEach(el=>el.addEventListener('click',()=>answer(el.dataset.answer)));app.querySelectorAll('[data-ruler-index]').forEach(el=>{const cb=()=>{view.barSelection=Number(el.dataset.rulerIndex);render()};el.addEventListener('click',cb);el.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();cb()}})});const a=app.querySelector('#level');if(a)a.addEventListener('change',e=>{saved.preferences.level=e.target.value;save();render()});const b=app.querySelector('#topic');if(b)b.addEventListener('change',e=>{saved.preferences.topic=e.target.value;save();render()});}
function resetInteraction(){view.answered=null;view.errors=0;view.hint=false;view.solution=false;view.helper=false;view.helperCount=0;view.explore=1;view.barSelection=0;view.revealed=false}
function navigate(screen,module){if(screen==='lesson'){view.moduleId=module||firstUndone();view.step=Math.max(0,Math.min((saved.slide||{})[view.moduleId]||0,slides[view.moduleId].length-1));resetInteraction();}
if(screen==='practiceSetup'){resetInteraction()}
view.screen=screen;render();window.scrollTo(0,0)}
function action(type,el){switch(type){case 'prev':view.step=Math.max(0,view.step-1);resetInteraction();render();window.scrollTo(0,0);break;
case 'next':{const arr=slides[view.moduleId];if(view.step===arr.length-1){if(!saved.done.includes(view.moduleId))saved.done.push(view.moduleId);saved.slide[view.moduleId]=0;save();const next=modules[modules.findIndex(x=>x.id===view.moduleId)+1];if(next)navigate('lesson',next.id);else navigate('learn');}else{view.step++;saved.slide[view.moduleId]=view.step;save();resetInteraction();render();window.scrollTo(0,0)}break;}
case 'hint':view.hint=!view.hint;render();break;
case 'solution':view.solution=!view.solution;render();break;
case 'helper':view.helper=!view.helper;view.helperCount=0;render();break;
case 'helperPlus':view.helperCount++;render();break;
case 'helperMinus':view.helperCount=Math.max(0,view.helperCount-1);render();break;
case 'explorePlus':{const v=slides[view.moduleId]?.[view.step]?.visual;const max=v?.type==='exploreReverse'?v.target/v.base:6;view.explore=Math.min(max,view.explore+1);render();break;}
case 'exploreMinus':view.explore=Math.max(0,view.explore-1);render();break;
case 'practiceStart':startPractice();break;
case 'practiceNext':{const q=view.practice[view.index];if(view.errors>0||view.answered!==q.answer){view.wrong.push({prompt:q.prompt,answer:q.answer,why:q.why});view.missed.push(q);}if(view.index+1>=view.practice.length){saved.practiced+=view.practice.length;save();navigate('practiceEnd');}else{view.index++;resetInteraction();render();window.scrollTo(0,0)}break;}
case 'tryAgain':startPractice();break;
case 'repeatMistakes':{view.practice=shuffle(view.missed.slice());view.index=0;view.wrong=[];view.missed=[];resetInteraction();view.screen='practice';render();window.scrollTo(0,0);break;}
case 'reset':{if(confirm('Czy wyczyścić ukończone lekcje i zapisane postępy?')){saved=JSON.parse(JSON.stringify(STARTDATA));save();navigate('home')}break;}
}}
function answer(answer){const q=currentQuestion();if(!q||view.solution||view.answered===q.answer)return;if(answer===q.answer){view.answered=answer;}else{view.answered=answer;view.errors++;if(view.errors>=2)view.hint=true;}render()}
function practiceSetup(){const topics=[['all','Wszystkie tematy'],['named','Odległości przy skali mianowanej'],['units','Zamiana jednostek'],['numeric','Czytanie skali liczbowej'],['distance','Skala liczbowa i odległość'],['route','Trasy złożone z dwóch odcinków'],['bar','Podziałka liniowa'],['reverse','Odległość w drugą stronę']];return `<div class="island"><div class="panel"><div class="eyebrow">Etap 2 · trening</div><h1>Poćwiczmy razem</h1><p class="lead secondary">Tylko <b>6 zadań na raz</b>. Możesz korzystać z podpowiedzi i pomocnika w liczeniu. Błędy nie odejmują punktów. Nie ma limitu czasu.</p><div class="divider"></div><div class="grid2"><div><label style="display:block;font-weight:800;margin-bottom:8px" for="topic">Co chcesz ćwiczyć?</label><select style="width:100%" id="topic">${topics.map(([v,name])=>`<option value="${v}" ${saved.preferences.topic===v?'selected':''}>${escapeHTML(name)}</option>`).join('')}</select></div><div><label style="display:block;font-weight:800;margin-bottom:8px" for="level">Poziom</label><select style="width:100%" id="level"><option value="easy" ${saved.preferences.level==='easy'?'selected':''}>Spokojny start</option><option value="medium" ${saved.preferences.level==='medium'?'selected':''}>Ćwiczę samodzielnie</option><option value="hard" ${saved.preferences.level==='hard'?'selected':''}>Wyzwanie</option></select></div></div><div class="notice" style="margin-top:18px"><b>Jak pomóc dziecku:</b> Przy pierwszych zadaniach pozwól klikać „Licz razem ze mną”. Celem jest opanowanie kolejności kroków, a nie szybkie liczenie w pamięci.</div><div class="actions"><button class="primary" data-action="practiceStart">Zacznij 6 zadań →</button><button class="secondarybtn" data-go="learn">Najpierw wróć do lekcji</button></div></div></div>`}
function random(a){return a[Math.floor(Math.random()*a.length)]}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function distractNumeric(val,unit,step){let s=new Set([val]);let picks=[val-step,val+step,val*2,val+step*2,val-step*2,val*10,Math.floor(val/10),val+100,val-100,val*3];for(const z of shuffle(picks)){if(z>0&&Number.isInteger(z)&&z!==val)s.add(z);if(s.size>=4)break;}if(s.size<4)for(let n=1;s.size<4;n++)s.add(val+n*step);return shuffle([...s].slice(0,4)).map(v=>`${fmt(v)} ${unit}`)}
const bases={easy:[100,200],medium:[100,200,250,300,500],hard:[100,200,250,300,500,1000,2500]};
function sampleQ(topic,level){const range=bases[level]||bases.easy;let unit=random(range),count=random(level==='hard'?[2,3,4,5,6,7,9]:[2,3,4,5]),result,opts,prompt,visual,calc,why,hint,answer;
switch(topic){
case 'named':{if(level==='hard'&&unit===2500)unit=500;result=unit*count;answer=`${fmt(result)} m`;opts=distractNumeric(result,'m',unit);prompt=`Skala: 1 cm = ${fmt(unit)} m. Droga ma ${count} cm na mapie. Ile metrów jest w terenie?`;visual={type:'segments',count,unit};calc={type:'add',count,unit};hint=`Dodawaj po ${fmt(unit)} m, tyle razy, ile jest centymetrów.`;why=`${count} odcinków po ${fmt(unit)} m to ${fmt(result)} m.`;break;}
case 'units':{const models=level==='easy'?[1000,5000,10000,20000,30000,50000,100000]:level==='medium'?[1000,10000,25000,30000,50000,100000,200000,500000]:[1000,10000,25000,30000,50000,100000,250000,500000,1000000];const n=random(models);const useKm=level!=='easy'&&n>=100000&&Math.random()>.45;const div=useKm?100000:100;const u=useKm?'km':'m';result=n/div;answer=`${fmt(result).replace('.',',')} ${u}`;let cand=[result,result*10,result/10,result*2,result/2,result+1,result+10,result-1,result*3].filter(v=>v>0&&v!==result);opts=shuffle([answer,...shuffle([...new Set(cand)]).slice(0,3).map(v=>`${fmt(v).replace('.',',')} ${u}`)]);prompt=`Zamień ${fmt(n)} cm na ${useKm?'kilometry':'metry'}.`;visual={type:'conversion',from:`${fmt(n)} cm`,action:useKm?'cm → m → km':'÷ 100',to:`? ${u}`};calc=useKm?{type:'chain',den:n}:{type:'divide',number:n,div,unit:u};hint=useKm?'Najpierw zamień centymetry na metry (÷ 100), a potem metry na kilometry (÷ 1000).':'100 cm = 1 m.';why=useKm?`${fmt(n)} cm ÷ 100 = ${fmt(n/100)} m. Następnie ${fmt(n/100)} m ÷ 1000 = ${answer}.`:`${fmt(n)} cm ÷ 100 = ${answer}.`;break;}
case 'numeric':{if(level==='easy')unit=random([10,50,100,200,300,500,1000]);if(level==='medium')unit=random([10,50,100,200,250,300,500,1000]);const denom=unit*100;const km=level==='hard'&&unit>=1000;const result2=km?unit/1000:unit;const u=km?'km':'m';result=result2;answer=`${fmt(result).replace('.',',')} ${u}`;let proposed=[result, result*2,result*10,result/10,result*3,result+1,result+.5,result+10].filter(v=>v>0);opts=shuffle([...new Set(proposed)].slice(0,4).map(v=>`${fmt(v).replace('.',',')} ${u}`));prompt=`Skala 1:${fmt(denom)}. Ile ${km?'kilometrów':'metrów'} w terenie oznacza 1 cm na mapie?`;visual={type:'number',den:denom};calc=km?{type:'chain',den:denom}:{type:'divide',number:denom,div:100,unit:'m'};hint='Liczba po dwukropku to centymetry w terenie. Zamień je na metry, a w razie potrzeby na kilometry.';why=`1 cm odpowiada ${fmt(denom)} cm, czyli ${fmt(unit)} m${km?`, czyli ${answer}`:''}.`;break;}
case 'distance':{if(level==='hard'&&unit===2500)unit=500;const den=unit*100;result=unit*count;answer=`${fmt(result)} m`;opts=distractNumeric(result,'m',unit);prompt=`Na mapie w skali 1:${fmt(den)} odcinek ma ${count} cm. Ile metrów ma w terenie?`;visual={type:'segments',count,unit,scale:den};calc={type:'add',count,unit};hint=`1 cm oznacza ${fmt(unit)} m. Policz ${count} takich odcinków.`;why=`1 cm = ${fmt(unit)} m. ${count} × ${fmt(unit)} = ${fmt(result)} m.`;break;}
case 'route':{if(level==='hard'&&unit===2500)unit=300;const a=random(level==='hard'?[1,2,3,4,5,6]:[1,2,3]);const b=random(level==='hard'?[2,3,4,5]:[1,2,3]);result=(a+b)*unit;answer=`${fmt(result)} m`;opts=distractNumeric(result,'m',unit);prompt=`Trasa ma dwa odcinki: ${a} cm i ${b} cm. Skala 1:${fmt(unit*100)}. Ile metrów ma cała trasa w terenie?`;visual={type:'route',a,b,scale:unit*100};calc={type:'add',count:a+b,unit};hint=`Najpierw dodaj ${a}+${b} cm. Potem dodaj tyle samo odcinków po ${fmt(unit)} m.`;why=`${a}+${b}=${a+b} cm. Każdy cm oznacza ${fmt(unit)} m, więc otrzymujemy ${fmt(result)} m.`;break;}
case 'bar':{const step=random(level==='easy'?[50,100]:level==='medium'?[100,200,250,500]:[100,200,250,500]);const target=random([1,2,3,4]);result=target*step;answer=`${fmt(result)} m`;opts=distractNumeric(result,'m',step);prompt='Odczytaj odległość zaznaczoną na podziałce liniowej.';visual={type:'rulerQuestion',step,ticks:5,target};calc={type:'add',count:target,unit:step};hint='Licz od zera. Każda następna duża kreska zwiększa odległość o tę samą liczbę metrów.';why=`Zaznaczony jest ${target}. odcinek po ${fmt(step)} m. Razem ${fmt(result)} m.`;break;}
case 'reverse':{const list=level==='hard'?[100,200,250,300,500,1000]:[100,200];unit=random(list);count=random(level==='hard'?[2,3,4,5,6]:[2,3,4,5]);result=unit*count;answer=`${count} cm`;opts=shuffle([...new Set([count,count+1,Math.max(1,count-1),count*2,count+2])].slice(0,4).map(n=>`${n} cm`));prompt=`Skala: 1 cm = ${fmt(unit)} m. Droga w terenie ma ${fmt(result)} m. Ile cm ma na mapie?`;visual={type:'reverse',unit,target:result};calc={type:'reverse',unit,target:result};hint=`Dodawaj po ${fmt(unit)} m, aż otrzymasz ${fmt(result)} m. Ile razy dodałeś?`;why=`${count} odcinków po ${fmt(unit)} m daje ${fmt(result)} m, więc na mapie mamy ${count} cm.`;break;}
default:return sampleQ('named',level);
}
return qq(prompt,opts,answer,hint,why,visual,calc)
}
function startPractice(){const level=saved.preferences.level,topic=saved.preferences.topic;const all=shuffle(['named','units','numeric','distance','route','bar','reverse']);const ids=new Set();const arr=[];let tries=0;while(arr.length<6&&tries++<100){const t=topic==='all'?all[arr.length%all.length]:topic;const q=sampleQ(t,level);const id=q.prompt+' / '+q.answer;if(ids.has(id))continue;ids.add(id);arr.push(q)}view.practice=arr;view.index=0;view.wrong=[];view.missed=[];resetInteraction();view.screen='practice';render();window.scrollTo(0,0)}
function practice(){const q=view.practice[view.index];if(!q)return practiceSetup();const solved=view.answered===q.answer;return `<div class="island"><div class="toolbar"><button class="smallbtn" data-go="practiceSetup">← Wybór treningu</button><span class="course-badge">Zadanie ${view.index+1} z ${view.practice.length}</span></div><div class="panel"><div class="eyebrow">Trening · krok po kroku</div><div class="progressbar"><div style="width:${percent(view.index+1,view.practice.length)}%"></div></div><h2 style="margin-top:23px">${escapeHTML(q.prompt)}</h2>${visual(q.visual,true)}${questionUI(q)}${shortcut()}<div class="lesson-foot"><span class="tiny">Możesz korzystać z podpowiedzi i liczyć na palcach.</span>${solved||view.solution?`<button class="primary" data-action="practiceNext">${view.index+1===view.practice.length?'Zakończ trening':'Następne zadanie →'}</button>`:''}</div></div></div>`}
function practiceEnd(){const wrong=view.wrong;return `<div class="island"><section class="panel"><div class="eyebrow">Trening zakończony</div><h1>${view.practice.length} ${view.practice.length===1?'zadanie':view.practice.length<5?'zadania':'zadań'} za Tobą ✓</h1><p class="lead secondary">Liczy się to, że ćwiczysz. Nie ma oceny ani limitu czasu.</p>${wrong.length?`<div class="notice"><b>Warto jeszcze raz powtórzyć ${wrong.length} ${wrong.length===1?'zadanie':wrong.length<=4?'zadania':'zadań'}.</b> Poniżej masz krótkie rozwiązania.</div><div class="review">${wrong.map(x=>`<div class="reviewrow"><strong>${escapeHTML(x.prompt)}</strong><p class="secondary">${escapeHTML(x.why)}</p><b>Odpowiedź: ${escapeHTML(x.answer)}</b></div>`).join('')}</div>`:`<div class="congrats"><b>Świetnie, wszystkie zadania wykonane bez potrzeby pokazania rozwiązania.</b> Możesz spróbować kolejnego zestawu.</div>`}<div class="actions">${wrong.length?`<button class="primary" data-action="repeatMistakes">Powtórz trudniejsze zadania (${wrong.length}) →</button>`:''}<button class="${wrong.length?'secondarybtn':'primary'}" data-action="tryAgain">Nowe 6 zadań →</button><button class="secondarybtn" data-go="learn">Wróć do lekcji</button><button class="secondarybtn" data-go="home">Strona główna</button></div></section></div>`}
render();
</script>
